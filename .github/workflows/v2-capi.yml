name: V2 C API
on:
  push:
    branches: [main]
  pull_request:

jobs:
  format:
    runs-on: ${{ github.repository_owner == 'duckdb' && 'namespace-profile-linux-x64' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Provision dev environment
        run: uv sync --group dev
      - name: Run pre-commit (default stages)
        run: uv run pre-commit run --all-files
      - name: Run pre-commit (manual stage)
        run: uv run pre-commit run --all-files --hook-stage manual
      - name: Verify generated header and stubs match spec
        run: git diff --exit-code

  build:
    runs-on: ${{ github.repository_owner == 'duckdb' && 'namespace-profile-linux-x64' || 'ubuntu-latest' }}
    needs:
      - format
    env:
      GEN: ninja
      CC: clang-20
      CXX: clang++-20
      # Enable -DDEBUG slow verifiers (expression verifier, operator
      # round-trips, etc.) without changing the optimization level.
      FORCE_DEBUG: 1
      FORCE_ASSERT: 1
      # Disable the UBSan vptr check: it needs __ubsan_vptr_type_cache, which
      # clang's ASan runtime provides but Rust's does not, so the sanitized
      # libduckdb.so could not load into the ASan-instrumented Rust test binary.
      # ASan + the rest of UBSan still apply to both the C++ and Rust runs.
      DISABLE_VPTR_SANITIZER: 1
      ASAN_OPTIONS: "detect_leaks=1:halt_on_error=1:abort_on_error=0"
      UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: python3 scripts/ci/retry.py -- make toolsci
      - name: Fix ASan runtime
        # libclang_rt.asan_static.a is missing in ubuntu 24.04 — workaround
        # mirrored from upstream Main.yml.
        run: |
          asan_static_dir="/usr/lib/llvm-20/lib/clang/20/lib/x86_64-pc-linux-gnu"
          asan_static_target="/usr/lib/llvm-20/lib/clang/20/lib/linux/libclang_rt.asan_static-x86_64.a"
          if [[ ! -e "${asan_static_dir}/libclang_rt.asan_static.a" && -e "${asan_static_target}" ]]; then
            sudo mkdir -p "${asan_static_dir}"
            sudo ln -sf "${asan_static_target}" "${asan_static_dir}/libclang_rt.asan_static.a"
          fi
      - uses: ./.github/actions/ccache-action
      - name: Build (relassert → ASan + UBSan + LSan)
        run: make relassert
      # V1 C API still uses DBConfig::SetOption directly; its regression
      # also covers the legacy paths the helper relies on.
      - name: Test V1 and V2 CAPI
        run: make unittest_relassert T="[capi_v2],[cpp_api],[capi]"
      # The V2 *_option_set bridges delegate to PhysicalSet::ApplyVariable
      # (extracted from PhysicalSet::GetDataInternal so SQL `SET` and the
      # V2 C API share one path). These suites exercise that same path
      # from the SQL side and must stay green when ApplyVariable changes.
      - name: SQL SET regression — settings
        # operator_memory_limit.test is excluded: its GROUP BY OOM assertion
        # only triggers when the radix HT goes external, which requires
        # number_of_threads > 2. ubuntu-latest runners have 2 vCPUs, so the
        # HT stays in the GROW strategy and the query succeeds. Upstream CI
        # passes because duckdb/duckdb runs on 4+ vCPU Namespace.so runners.
        run: make unittest_relassert T='"test/sql/table_function/duckdb_settings*","[reset]","[settings]" "~test/sql/settings/operator_memory_limit.test"'

      # Exercise the Rust bindings (tools/rust) against the libduckdb built above,
      # reusing it rather than rebuilding. That library is instrumented with
      # -fsanitize=address,undefined, so the Rust test binaries are built with
      # AddressSanitizer too (nightly -Zsanitizer=address + -Zbuild-std). This links
      # the ASan runtime into the test binary, so the instrumented libduckdb loads
      # natively; the remaining UBSan handlers resolve from Rust's ASan runtime (the
      # vptr check is disabled in the build above, which Rust's runtime can't supply).
      # Passing --target keeps host build scripts / bindgen uninstrumented.
      - name: Install Rust toolchain (nightly + rust-src)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly-2026-03-03
          components: rust-src
          cache-workspaces: tools/rust
          # Don't let the action inject its default `-D warnings`; we set RUSTFLAGS
          # explicitly for the test step below.
          rustflags: ""
      - name: Test Rust bindings
        timeout-minutes: 20
        working-directory: tools/rust
        env:
          DUCKDB_LIB_DIR: ${{ github.workspace }}/build/relassert/src
          DUCKDB_INCLUDE_DIR: ${{ github.workspace }}/src/include
          LIBCLANG_PATH: /usr/lib/llvm-20/lib
          ASAN_SYMBOLIZER_PATH: /usr/lib/llvm-20/bin/llvm-symbolizer
          # --target keeps these flags off host build scripts / bindgen. Keep line
          # info (debuginfo=1) so sanitizer reports carry file:line.
          RUSTFLAGS: -Zsanitizer=address -C debuginfo=1
          RUSTDOCFLAGS: -Zsanitizer=address
          ASAN_OPTIONS: "detect_stack_use_after_return=1:detect_leaks=1:symbolize=1"
        run: |
          set -euo pipefail
          cargo test --workspace --tests -Zbuild-std --target x86_64-unknown-linux-gnu
