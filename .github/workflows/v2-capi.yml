name: V2 C API
on:
  push:
    branches: [main]
  pull_request:

jobs:
  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Provision dev environment
        run: uv sync --group dev
      - name: Run pre-commit (default stages)
        run: uv run pre-commit run --all-files
      - name: Run pre-commit (manual stage)
        run: uv run pre-commit run --all-files --hook-stage manual
      - name: Verify generated header and stubs match spec
        run: git diff --exit-code

  build-and-test:
    runs-on: ubuntu-latest
    env:
      GEN: ninja
      CC: ccache gcc
      CXX: ccache g++
      # Enable -DDEBUG slow verifiers (expression verifier, operator
      # round-trips, etc.) without changing the optimization level.
      FORCE_DEBUG: 1
      # CMakeLists.txt:717-738 inlines CXX_EXTRA_DEBUG into CXX_EXTRA when
      # FORCE_DEBUG is set, and CXX_EXTRA flows into CMAKE_CXX_FLAGS_RELEASE.
      # ENABLE_SANITIZER defaults to TRUE and seeds CXX_EXTRA_DEBUG with
      # -fsanitize=address. Net effect: FORCE_DEBUG=1 alone produces an
      # ASan-instrumented Release build. Sanitizer coverage is the sanitize
      # job's responsibility — disable it here.
      DISABLE_SANITIZER: 1
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update -y -qq && sudo apt-get install -y -qq ninja-build ccache
      - uses: ./.github/actions/ccache-action
      - name: Build
        run: make release
      - name: Test V2 CAPI
        run: ./build/release/test/unittest "[capi_v2]"
      # The V2 *_option_set bridges delegate to PhysicalSet::ApplyVariable
      # (extracted from PhysicalSet::GetDataInternal so SQL `SET` and the
      # V2 C API share one path). These suites exercise that same path
      # from the SQL side and must stay green when ApplyVariable changes.
      - name: SQL SET regression — settings
        # operator_memory_limit.test is excluded: its GROUP BY OOM assertion
        # only triggers when the radix HT goes external, which requires
        # number_of_threads > 2. ubuntu-latest runners have 2 vCPUs, so the
        # HT stays in the GROW strategy and the query succeeds. Upstream CI
        # passes because duckdb/duckdb runs on 4+ vCPU Namespace.so runners.
        run: ./build/release/test/unittest "test/sql/settings/*" "exclude:test/sql/settings/operator_memory_limit.test"
      - name: SQL SET regression — duckdb_settings table function
        run: ./build/release/test/unittest "test/sql/table_function/duckdb_settings*"
      # V1 C API still uses DBConfig::SetOption directly; its regression
      # also covers the legacy paths the helper relies on.
      - name: V1 CAPI regression
        run: ./build/release/test/unittest "[capi]"

  sanitize:
    # FORCE_ASSERT=1 turns on -fsanitize=address,undefined in CMakeLists.txt.
    # On Linux, ASan also runs LeakSanitizer at process exit. No suppressions
    # — any leak or UB in the C-API surface fails the build. Toolchain mirrors
    # upstream's linux-relassert job (clang-20).
    runs-on: ubuntu-latest
    env:
      GEN: ninja
      CC: clang-20
      CXX: clang++-20
      FORCE_ASSERT: 1
      ASAN_OPTIONS: "detect_leaks=1:halt_on_error=1:abort_on_error=0"
      UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
    steps:
      - uses: actions/checkout@v4
      - name: Install base tools
        # mold is auto-selected by CMakeLists.txt for non-Release CI Linux builds.
        run: sudo apt-get update -y -qq && sudo apt-get install -y -qq ninja-build ccache mold
      - name: Install clang-20 (matches upstream linux-relassert)
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 20
          sudo apt-get install -y -qq libclang-rt-20-dev
      - name: Fix ASan runtime
        # libclang_rt.asan_static.a is missing in ubuntu 24.04 — workaround
        # mirrored from upstream Main.yml.
        run: |
          asan_static_dir="/usr/lib/llvm-20/lib/clang/20/lib/x86_64-pc-linux-gnu"
          asan_static_target="/usr/lib/llvm-20/lib/clang/20/lib/linux/libclang_rt.asan_static-x86_64.a"
          if [[ ! -e "${asan_static_dir}/libclang_rt.asan_static.a" && -e "${asan_static_target}" ]]; then
            sudo mkdir -p "${asan_static_dir}"
            sudo ln -sf "${asan_static_target}" "${asan_static_dir}/libclang_rt.asan_static.a"
          fi
      - uses: ./.github/actions/ccache-action
      - name: Build (relassert → ASan + UBSan + LSan)
        run: make relassert
      - name: V2 CAPI under sanitizers
        run: ./build/relassert/test/unittest "[capi_v2]"
      - name: V1 CAPI under sanitizers
        run: ./build/relassert/test/unittest "[capi]"
