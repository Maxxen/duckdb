name: Sqllogic (C API runner)

# Nightly guard that the C-API/streaming path stays equivalent to the internal one:
# runs the sqllogic suite under the stable-C++-API executor (CppApiSQLLogicExecutor)
# across the configs and platforms upstream exercises, and fails only on
# cpp_api-specific divergences. How the diff works: scripts/ci/sqllogic_executor_diff.py.
#
# The reldebug (~12GB) and relassert (~16GB) builds overflow a Linux runner's ~14GB
# free disk, so linux jobs run ./.github/actions/cleanup_runner first.
#
# Scheduled runs take workflow and code from the default branch, so this is only
# meaningful post-merge.

on:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * *' # nightly, 03:30 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Both executors are always compiled in; the diff script picks one per run via
# DUCKDB_SQLLOGIC_EXECUTOR, so the build matches upstream's and stays ccache-shareable.
env:
  GEN: ninja
  CORE_EXTENSIONS: "json;parquet;icu;tpch;tpcds;autocomplete"
  # Windows python defaults to cp1252 stdout, which crashes on the test runner's UTF-8 output.
  PYTHONUTF8: "1"

jobs:
  # The config matrix. Mirrors upstream ExtendedTests' linux-configs-all job
  # (same configs, ubuntu-24.04, reldebug).
  linux-configs:
    name: "linux ${{ matrix.config }}"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        config:
          - force_storage
          - force_storage_restart
          - latest_storage
          - block_verification
          - wal_verification
          - no_local_filesystem
          - block_size_16kB
          - latest_storage_block_size_16kB
          - block_allocator_100mib
          - variant_vector
          - compressed_in_memory
          - prefetch_all_storage
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # cleanup_runner clears the tool cache, so it must run before setup-python.
      - uses: ./.github/actions/cleanup_runner
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python3 scripts/ci/retry.py -- make toolsci
      - uses: ./.github/actions/ccache-action
      - name: Build
        run: make reldebug
      - name: "Run sqllogic (${{ matrix.config }}): cpp_api vs internal"
        run: python scripts/ci/sqllogic_executor_diff.py -- ./build/reldebug/test/run --test-config=test/configs/${{ matrix.config }}.json "*"

  # The default suite per platform (upstream: Main.yml / OSX.yml); the config
  # matrix above is Linux-only.
  default-suite:
    name: "${{ matrix.os }} default"
    runs-on: ${{ matrix.os == 'macos' && 'macos-latest' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        os: [linux, macos]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/cleanup_runner
        if: matrix.os == 'linux'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install (linux)
        if: matrix.os == 'linux'
        run: python3 scripts/ci/retry.py -- make toolsci
      - name: Install (macos)
        if: matrix.os == 'macos'
        run: python3 scripts/ci/retry.py -- brew install ninja
      - uses: ./.github/actions/ccache-action
      - name: Build
        run: make reldebug
      - name: "Run sqllogic (default config): cpp_api vs internal"
        run: python scripts/ci/sqllogic_executor_diff.py -- ./build/reldebug/test/run "*"

  # windows_release is a Release in-source build: fits the disk without cleanup,
  # binary lands under ./test. run_tests.py isolates crashes per batch (giant_query
  # overflows Windows' 1MB stack), so the suite finishes instead of aborting.
  windows-default:
    name: "windows default"
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ./.github/actions/ccache-action
      - name: Set up MSVC environment (x64)
        uses: ./.github/actions/setup-msvc-env
      - name: Build (Release)
        shell: bash
        run: |
          python scripts/ci/retry.py -- python scripts/windows_ci.py
          python scripts/ci/retry.py -- make windows_release
      - name: "Run sqllogic: cpp_api vs internal"
        shell: bash
        run: |
          unittest="./test/unittest.exe"
          if [ ! -f "$unittest" ]; then
            unittest=$(find . -name 'unittest.exe' -not -path './vcpkg*' | head -1)
          fi
          echo "Using $unittest"
          python scripts/ci/sqllogic_executor_diff.py -- python scripts/ci/run_tests.py "$unittest" "*"

  # Sanitizer coverage, mirroring upstream NightlyTests' relassert configs: assertions
  # + ASan/UBSan/LSan, guarding the C-API runner's chunk adoption and re-materialization.
  # Heaviest build (~16GB plus ASan memory), hence the swap step. Runs "~[.]" (no
  # .test_slow) to fit the 6h job limit; the slow tests' storage-config coverage comes
  # from the non-sanitized linux-configs jobs above.
  linux-relassert-configs:
    name: "linux relassert ${{ matrix.config }}"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        config:
          - release_assertions
          - vector_size_512
          - block_size_16kB
          - initial_column_segment_size
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/cleanup_runner
      - uses: ./.github/actions/swap_space
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python3 scripts/ci/retry.py -- make toolsci
      - uses: ./.github/actions/ccache-action
      - name: Build (relassert -> assertions + sanitizers)
        # ASan links need more memory, so link one job at a time. -gz compresses
        # debug sections (keeps symbolization) to shrink the tree.
        run: EXTRA_CMAKE_VARIABLES="-DDUCKDB_DEBUG_LINK_JOBS=1 -DCMAKE_C_FLAGS=-gz -DCMAKE_CXX_FLAGS=-gz" make relassert
      - name: Reclaim disk before tests
        # After linking, the object files and the link-time swapfile are dead
        # weight for the test run; reclaim both. ccache keeps its own copies, so
        # the post-job save is unaffected. The df readings bracket the peak.
        run: |
          df -h /
          find build/relassert -name '*.o' -delete
          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile
          df -h /
      - name: "Run sqllogic (${{ matrix.config }}): cpp_api vs internal"
        # Larger batch timeout: sanitized builds run the suite much slower.
        run: python scripts/ci/sqllogic_executor_diff.py -- ./build/relassert/test/run --test-config=test/configs/${{ matrix.config }}.json --batch-timeout 600 "~[.]"
      - name: Free build tree for the cache save
        # The ~16GB build tree leaves no disk for the post-job ccache save (ENOSPC,
        # so every nightly starts cold). Regular steps run before post-job actions.
        if: always()
        run: |
          df -h /
          rm -rf build
