name: Sqllogic (C API runner)

# Runs the sqllogic suite through the stable-C++-API executor
# (CppApiSQLLogicExecutor) and compares it against the internal
# ClientContext::Query path, across the configuration matrix and platforms that
# upstream/main exercises. A nightly guard that the C-API/streaming path stays
# equivalent to the internal one as the engine and bridge evolve.
#
# Each job runs the suite under BOTH executors and fails only on tests that fail
# under cpp_api but pass under internal (scripts/ci/sqllogic_executor_diff.py).
# Environment-driven failures (resource-heavy .test_slow that fail on small CI
# runners regardless of executor) show up under both executors and cancel out, so
# a job stays green unless there is a genuine C-API runner divergence.
#
# Only meaningful once the C-API runner has merged to the branch this runs on:
# scheduled runs use the workflow + code from the default branch.

on:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * *' # nightly, 03:30 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Both executors are always compiled in; sqllogic_executor_diff.py selects each
# one per run via DUCKDB_SQLLOGIC_EXECUTOR, so the build is identical to upstream's
# and stays ccache-shareable.
env:
  GEN: ninja
  CORE_EXTENSIONS: "json;parquet;icu;tpch;tpcds;autocomplete"

jobs:
  # The configuration matrix. Mirrors upstream ExtendedTests' linux-configs-all
  # job (same configs, ubuntu-24.04, reldebug, test/run --test-config), run under
  # both executors and diffed.
  linux-configs:
    name: "linux ${{ matrix.config }}"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        config:
          - force_storage
          - force_storage_restart
          - latest_storage
          - block_verification
          - wal_verification
          - no_local_filesystem
          - block_size_16kB
          - latest_storage_block_size_16kB
          - block_allocator_100mib
          - variant_vector
          - compressed_in_memory
          - prefetch_all_storage
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python3 scripts/ci/retry.py -- make toolsci
      - uses: ./.github/actions/ccache-action
      - name: Build
        run: make reldebug
      - name: "Run sqllogic (${{ matrix.config }}): cpp_api vs internal"
        run: python scripts/ci/sqllogic_executor_diff.py -- ./build/reldebug/test/run --test-config=test/configs/${{ matrix.config }}.json "*"

  # The default suite (no special config), per platform. Upstream runs the full
  # suite on each OS (Main.yml / OSX.yml); the config matrix above is Linux-only.
  default-suite:
    name: "${{ matrix.os }} default"
    runs-on: ${{ matrix.os == 'macos' && 'macos-latest' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        os: [linux, macos]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install (linux)
        if: matrix.os == 'linux'
        run: python3 scripts/ci/retry.py -- make toolsci
      - name: Install (macos)
        if: matrix.os == 'macos'
        run: python3 scripts/ci/retry.py -- brew install ninja
      - uses: ./.github/actions/ccache-action
      - name: Build
        run: make reldebug
      - name: "Run sqllogic (default config): cpp_api vs internal"
        run: python scripts/ci/sqllogic_executor_diff.py -- ./build/reldebug/test/run "*"

  # Windows. Folded into the nightly now that the build (FILE_CREATE_NEW), the
  # parallel runner (run_tests.py isolates crashes per batch -- e.g. giant_query
  # overflowing Windows' 1 MB stack), and the executor diff make it a reliable
  # signal. windows_release is an in-source build, so the binary lands under
  # ./test; the parallel runner is invoked on it directly.
  windows-default:
    name: "windows default"
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ./.github/actions/ccache-action
      - name: Set up MSVC environment (x64)
        uses: ./.github/actions/setup-msvc-env
      - name: Build (Release)
        shell: bash
        run: |
          python scripts/ci/retry.py -- python scripts/windows_ci.py
          python scripts/ci/retry.py -- make windows_release
      - name: "Run sqllogic: cpp_api vs internal"
        shell: bash
        run: |
          unittest="./test/unittest.exe"
          if [ ! -f "$unittest" ]; then
            unittest=$(find . -name 'unittest.exe' -not -path './vcpkg*' | head -1)
          fi
          echo "Using $unittest"
          python scripts/ci/sqllogic_executor_diff.py -- python scripts/ci/run_tests.py "$unittest" "*"

  # Sanitizer coverage. Mirrors upstream NightlyTests' relassert config runs.
  # `make relassert` builds RelWithDebInfo + FORCE_ASSERT with ASan/UBSan (and
  # LSan on Linux), so this is the pass that exercises the C-API runner's chunk
  # adoption + re-materialization under a sanitizer across the corpus. The diff
  # filters out pre-existing / environment sanitizer hits (those fire under both
  # executors), leaving only C-API-specific ones. Linux-only: that is where LSan
  # runs.
  linux-relassert-configs:
    name: "linux relassert ${{ matrix.config }}"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        config:
          - release_assertions
          - vector_size_512
          - block_size_16kB
          - initial_column_segment_size
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python3 scripts/ci/retry.py -- make toolsci
      - uses: ./.github/actions/ccache-action
      - name: Build (relassert -> assertions + sanitizers)
        # Link one extension at a time: ASan + the large loadable extensions (icu)
        # OOM the linker on the 4-core/16GB runner at the default concurrency
        # (relassert is RelWithDebInfo -> the debug_link_jobs pool, default 2).
        run: EXTRA_CMAKE_VARIABLES="-DDUCKDB_DEBUG_LINK_JOBS=1" make relassert
      - name: "Run sqllogic (${{ matrix.config }}): cpp_api vs internal"
        # Larger batch timeout: sanitized builds run the suite much slower.
        run: python scripts/ci/sqllogic_executor_diff.py -- ./build/relassert/test/run --test-config=test/configs/${{ matrix.config }}.json --batch-timeout 600 "*"
