name: Sqllogic (C API runner)

# Runs the sqllogic suite through the stable-C++-API executor
# (CppApiSQLLogicExecutor) and compares it against the internal
# ClientContext::Query path, across the config matrix and platforms upstream/main
# exercises. A nightly guard that the C-API/streaming path stays equivalent to the
# internal one as the engine and bridge evolve.
#
# Each job runs the suite under BOTH executors and fails only on tests that fail
# under cpp_api but pass under internal (scripts/ci/sqllogic_executor_diff.py).
# Environment-driven failures (resource-heavy .test_slow that fail on small CI
# runners regardless of executor) fire under both executors and cancel out, so a
# job stays green unless there is a genuine C-API runner divergence.
#
# The reldebug (~12GB) and relassert (~16GB) builds overflow a GitHub Linux
# runner's ~14GB free disk (the loadable extensions, esp. icu, dominate), so the
# linux jobs run ./.github/actions/cleanup_runner first to reclaim ~20GB.
#
# Only meaningful once the C-API runner has merged to the branch this runs on:
# scheduled runs use the workflow + code from the default branch.

on:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * *' # nightly, 03:30 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Both executors are always compiled in; sqllogic_executor_diff.py selects each
# one per run via DUCKDB_SQLLOGIC_EXECUTOR, so the build is identical to upstream's
# and stays ccache-shareable.
env:
  GEN: ninja
  CORE_EXTENSIONS: "json;parquet;icu;tpch;tpcds;autocomplete"
  # Windows runners default python to a cp1252 stdout, which cannot encode the
  # test runner's progress glyphs and dies with UnicodeEncodeError mid-report.
  PYTHONUTF8: "1"

jobs:
  # The configuration matrix. Mirrors upstream ExtendedTests' linux-configs-all
  # job (same configs, ubuntu-24.04, reldebug, test/run --test-config), run under
  # both executors and diffed.
  linux-configs:
    name: "linux ${{ matrix.config }}"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        config:
          - force_storage
          - force_storage_restart
          - latest_storage
          - block_verification
          - wal_verification
          - no_local_filesystem
          - block_size_16kB
          - latest_storage_block_size_16kB
          - block_allocator_100mib
          - variant_vector
          - compressed_in_memory
          - prefetch_all_storage
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Free disk before setup-python: cleanup_runner clears the tool cache, so
      # setup-python must re-install Python after it.
      - uses: ./.github/actions/cleanup_runner
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python3 scripts/ci/retry.py -- make toolsci
      - uses: ./.github/actions/ccache-action
      - name: Build
        run: make reldebug
      - name: "Run sqllogic (${{ matrix.config }}): cpp_api vs internal"
        run: python scripts/ci/sqllogic_executor_diff.py -- ./build/reldebug/test/run --test-config=test/configs/${{ matrix.config }}.json "*"

  # The default suite (no special config), per platform. Upstream runs the full
  # suite on each OS (Main.yml / OSX.yml); the config matrix above is Linux-only.
  default-suite:
    name: "${{ matrix.os }} default"
    runs-on: ${{ matrix.os == 'macos' && 'macos-latest' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        os: [linux, macos]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/cleanup_runner
        if: matrix.os == 'linux'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install (linux)
        if: matrix.os == 'linux'
        run: python3 scripts/ci/retry.py -- make toolsci
      - name: Install (macos)
        if: matrix.os == 'macos'
        run: python3 scripts/ci/retry.py -- brew install ninja
      - uses: ./.github/actions/ccache-action
      - name: Build
        run: make reldebug
      - name: "Run sqllogic (default config): cpp_api vs internal"
        run: python scripts/ci/sqllogic_executor_diff.py -- ./build/reldebug/test/run "*"

  # Windows. windows_release is a Release (no debug info) in-source build, so it
  # fits the runner disk without cleanup; the binary lands under ./test. The
  # parallel runner (run_tests.py) isolates crashes per batch -- e.g. giant_query
  # overflowing Windows' 1MB stack -- so the suite finishes instead of aborting.
  windows-default:
    name: "windows default"
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ./.github/actions/ccache-action
      - name: Set up MSVC environment (x64)
        uses: ./.github/actions/setup-msvc-env
      - name: Build (Release)
        shell: bash
        run: |
          python scripts/ci/retry.py -- python scripts/windows_ci.py
          python scripts/ci/retry.py -- make windows_release
      - name: "Run sqllogic: cpp_api vs internal"
        shell: bash
        run: |
          unittest="./test/unittest.exe"
          if [ ! -f "$unittest" ]; then
            unittest=$(find . -name 'unittest.exe' -not -path './vcpkg*' | head -1)
          fi
          echo "Using $unittest"
          python scripts/ci/sqllogic_executor_diff.py -- python scripts/ci/run_tests.py "$unittest" "*"

  # Sanitizer coverage. Mirrors upstream NightlyTests' relassert config runs.
  # `make relassert` builds RelWithDebInfo + FORCE_ASSERT with ASan/UBSan (and LSan
  # on Linux), exercising the C-API runner's chunk adoption + re-materialization
  # under a sanitizer. The diff filters pre-existing / environment sanitizer hits
  # (those fire under both executors), leaving only C-API-specific ones. This is
  # the heaviest build (~16GB on disk + ASan memory), so it also adds swap.
  #
  # The full suite under a sanitizer overruns the 6h GitHub job limit (and fills
  # the runner disk), so this run excludes the .test_slow tests (the Catch2 [.]
  # hidden tag, via the "~[.]" pattern). The sanitizer here guards the C-API
  # runner code path, which the fast suite exercises fully; exhaustive
  # storage-config coverage of the slow tests is already provided by the
  # non-sanitizer linux-configs jobs above.
  linux-relassert-configs:
    name: "linux relassert ${{ matrix.config }}"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        config:
          - release_assertions
          - vector_size_512
          - block_size_16kB
          - initial_column_segment_size
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/cleanup_runner
      - uses: ./.github/actions/swap_space
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python3 scripts/ci/retry.py -- make toolsci
      - uses: ./.github/actions/ccache-action
      - name: Build (relassert -> assertions + sanitizers)
        # Keep linking one job at a time as a precaution for ASan's larger link
        # memory (relassert is RelWithDebInfo -> the debug_link_jobs pool, default 2).
        run: EXTRA_CMAKE_VARIABLES="-DDUCKDB_DEBUG_LINK_JOBS=1" make relassert
      - name: "Run sqllogic (${{ matrix.config }}): cpp_api vs internal"
        # "~[.]" excludes the .test_slow tests so the sanitized run fits the 6h
        # limit (see the job comment above). Larger batch timeout: sanitized
        # builds run the suite much slower.
        run: python scripts/ci/sqllogic_executor_diff.py -- ./build/relassert/test/run --test-config=test/configs/${{ matrix.config }}.json --batch-timeout 600 "~[.]"
      - name: Free build tree for the cache save
        # The ~16GB relassert build fills the disk, leaving the post-job ccache
        # save to die with ENOSPC, so every nightly relassert build starts cold.
        # Regular steps run before post-job actions; dropping the build tree
        # here gives the save its headroom back.
        if: always()
        run: rm -rf build
