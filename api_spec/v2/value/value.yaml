module: value
#
# Value construction + reading + NULL + composition + descent + cast.
#
# Mirrors duckdb::Value. A value carries a logical type plus a typed payload.
# Internal storage:
#   - primitives: inline union (bool, integer widths, float/double, hugeint,
#     interval, all date/time/timestamp variants).
#   - varchar/blob/bit/bignum/geometry: StringValueInfo (a managed std::string).
#   - type: StringValueInfo holding the serialized logical type
#     (value_create_type_from_context / _from_connection and value_get_type
#     wrap and unwrap it).
#   - composites (list/struct/tuple/map/array/union): NestedValueInfo (a vector
#     of child Values). Built via value_create (LIST/ARRAY/STRUCT/TUPLE/MAP) or
#     value_cast (UNION from a member value, ENUM from VARCHAR); read via
#     value_get_child_count / value_get_child.
#
# Leaf payloads cross the boundary through the per-kind typed pairs:
# value_create_<kind>_from_context / _from_connection build one, and
# value_get_<kind> reads one back. The constructors take a context or a
# connection because a value's construction is scoped to a catalog; the
# getters need no scope. A getter is not a cast, so it reads exactly its
# own type id and refuses anything else.
#
# The typed set covers the built-ins whose payload is a plain C scalar or
# byte string. Every other kind -- DATE, the TIME and TIMESTAMP variants,
# INTERVAL, UUID, DECIMAL, ENUM, UNION, extension types -- is reached
# through value_cast, which is the engine's own construction path for
# them: build the nearest typed value, usually a VARCHAR, and cast it.
# BIGNUM reads back through value_get_blob, whose bytes are opaque storage
# (negatives are stored bit-inverted behind a header); the vector module's
# bignum_encode / bignum_decode translate between those bytes and a
# magnitude + sign flag.
#
# All constructors copy their input. Getters return owned outputs
# (caller-destroyed) or borrowed pointers (valid until the value handle is
# destroyed); the contract is documented per function.
#
# NULL handling: the payload readers (value_get_<kind>, value_get_type,
# value_get_variant) return ERROR_INPUT_INVALID when the value is NULL: a
# NULL has no typed payload to hand back. Use value_is_null first (or
# value_get_logical_type / value_to_string, which both accept NULL
# values).

functions:
  # -----------------------------------------------------------------------
  # Lifecycle + NULL
  # -----------------------------------------------------------------------
  value_destroy:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-08-04" ]
    description: |
      Destroys a value handle.

      Null-safe: passing nullptr or a slot already set to nullptr is a
      no-op. On success the slot is set to nullptr.
    role: destructor
    belongs_to: value
    parameters:
      value:
        type: value
        indirection: 1
        description: The value to destroy.
    return_type: ERROR
  value_create_null:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-08-04" ]
    description: |
      Creates a NULL value of the given logical type.

      The input logical type is borrowed; the value internally copies the
      type so the caller can destroy the logical type independently.
    role: constructor
    belongs_to: value
    parameters:
      type:
        type: logical_type
        description: The borrowed logical type to attach to the NULL value.
      out_value:
        type: value
        indirection: 1
        kind: OUT
        description: Receives the new NULL value.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: ERROR
  # --------------------------------------------------------------------------------------------------------------------
  # Accessors
  # --------------------------------------------------------------------------------------------------------------------
  value_get_bool:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-08-04" ]
    description: |
      returns the values as a BOOLEAN
    role: getter
    belongs_to: value
    parameters:
      value:
        type: value
      out:
        type: bool
        indirection: 1
        kind: OUT
        description: Receives the payload as a bool.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: ERROR

  value_get_utinyint:
