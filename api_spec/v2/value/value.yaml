  # -----------------------------------------------------------------------
  # VARIANT codec (wire encoding not committed; unwrap is the read path)
  # -----------------------------------------------------------------------
  value_get_variant:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-08-04" ]
    description: |
      Unwraps a VARIANT value into the plain value it carries.

      Decodes the variant payload engine-side and returns the carried
      value with its real logical type, so per-row inner-type discovery
      needs no prior knowledge: inspect the result via
      value_get_logical_type and descend or read it like any other value.
      Returns ERROR_INPUT_INVALID unless the input is a non-NULL VARIANT
      value. The returned value is caller-owned; destroy via
      value_destroy.

      Decoding is faithful to the variant encoding, not to the original
      SQL type: homogeneous arrays come back as typed LISTs, variant
      objects as STRUCTs with field names, MAPs as their key-value-array
      form (LIST of STRUCT(key, value)), and heterogeneous arrays as
      LIST(VARIANT) whose elements unwrap individually.

      The variant wire encoding itself is not committed contract:
      vector_get_value hands out the boxed VARIANT cell and this unwrap
      decodes it, mirroring how the BIGNUM codec pair owns that kind's
      uncommitted encoding.
    role: getter
    belongs_to: value
    parameters:
      value:
        type: value
      out_value:
        type: value
        indirection: 1
        kind: OUT
        description: Receives the owned unwrapped value.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: ERROR

  # -----------------------------------------------------------------------
  # Composite construction + descent + cast
  # -----------------------------------------------------------------------
  # -----------------------------------------------------------------------
  # Composite constructors
  # -----------------------------------------------------------------------
  value_create_list_from_context:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-08-04" ]
    description: |
      Creates a LIST value from its elements.

      The child type is the common type of the elements, resolved through
      the same rule the engine uses for a list literal, and every element
      is cast to it; a set with no common type surfaces the cast error.
      Pass child_type to name it instead, which is also how an empty list
      is built: with child_type NULL, an empty element array has no type
      to resolve and returns ERROR_INPUT_INVALID.

      The elements are borrowed (copied in). NULL elements become typed
      NULLs. The type is rebuilt from its child, so an alias on the outer
      LIST type is not preserved; value_cast is the alias-preserving path.
    role: constructor
    belongs_to: value
    parameters:
      ctx:
        type: context
        description: The context to use for the construction.
      child_type:
        type: logical_type
        description: Optional. The element type. Pass NULL to resolve it from the elements.
      children:
        type: value
        indirection: 1
        const: true
        description: An array of child_count elements. Borrowed (copied in). Pass NULL when child_count is 0.
      child_count:
        type: idx
        description: The number of elements.
      out_value:
        type: value
        indirection: 1
        kind: OUT
        description: Receives the new composite value.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: ERROR
  value_create_list_from_connection:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-08-04" ]
    description: |
