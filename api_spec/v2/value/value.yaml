        description: An array of field_count field values. Borrowed (copied in). Pass NULL when field_count is 0.
      field_count:
        type: idx
        description: The number of fields.
      out_value:
        type: value
        indirection: 1
        kind: OUT
        description: Receives the new composite value.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: ERROR
  value_create_tuple_from_context:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-08-04" ]
    description: |
      Creates a TUPLE value from positional fields.

      TUPLE is the unnamed struct: the same positional children as
      value_create_struct, a distinct type id, and no names. Each field
      keeps its own child's type. An empty field list builds the empty
      tuple, which is a real type.

      The children are borrowed (copied in). NULL children become typed
      NULLs.
    role: constructor
    belongs_to: value
    parameters:
      ctx:
        type: context
        description: The context to use for the construction.
      children:
        type: value
        indirection: 1
        const: true
        description: An array of field_count field values. Borrowed (copied in). Pass NULL when field_count is 0.
      field_count:
        type: idx
        description: The number of fields.
      out_value:
        type: value
        indirection: 1
        kind: OUT
        description: Receives the new composite value.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
