  value_create_map_from_context:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-08-04" ]
    description: |
      Creates a MAP value from parallel key and value arrays.

      The key and value types are the common types of the keys and of the
      values, resolved as for value_create_list, and every entry is cast
      to them. Pass key_type and value_type to name them instead, which is
      also how an empty map is built: with them NULL, empty key and value
      arrays have no types to resolve and return ERROR_INPUT_INVALID.

      Keys and values are borrowed (copied in) and must be the same
      count. Keys must be non-NULL and unique; the engine enforces both.
    role: constructor
    belongs_to: value
    parameters:
      ctx:
        type: context
        description: The context to use for the construction.
      key_type:
        type: logical_type
        description: Optional. The key type. Pass NULL to resolve it from the keys.
      value_type:
        type: logical_type
        description: Optional. The value type. Pass NULL to resolve it from the values.
      keys:
        type: value
        indirection: 1
        const: true
        description: An array of entry_count keys. Borrowed (copied in). Pass NULL when entry_count is 0.
      values:
        type: value
        indirection: 1
        const: true
        description: An array of entry_count values, parallel to keys. Borrowed (copied in). Pass NULL when entry_count is 0.
      entry_count:
        type: idx
        description: The number of entries.
      out_value:
        type: value
        indirection: 1
        kind: OUT
        description: Receives the new composite value.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: ERROR
  value_create_map_from_connection:
    lifecycle:
      - [ "stable", "v2.0.0", "2026-08-04" ]
    description: |
      Creates a MAP value from parallel key and value arrays.

      The key and value types are the common types of the keys and of the
      values, resolved as for value_create_list, and every entry is cast
      to them. Pass key_type and value_type to name them instead, which is
      also how an empty map is built: with them NULL, empty key and value
      arrays have no types to resolve and return ERROR_INPUT_INVALID.

      Keys and values are borrowed (copied in) and must be the same
      count. Keys must be non-NULL and unique; the engine enforces both.
    role: constructor
    belongs_to: value
    parameters:
      conn:
        type: connection
        description: The connection to use for the construction.
      key_type:
        type: logical_type
        description: Optional. The key type. Pass NULL to resolve it from the keys.
      value_type:
        type: logical_type
        description: Optional. The value type. Pass NULL to resolve it from the values.
      keys:
        type: value
        indirection: 1
        const: true
        description: An array of entry_count keys. Borrowed (copied in). Pass NULL when entry_count is 0.
      values:
        type: value
        indirection: 1
        const: true
        description: An array of entry_count values, parallel to keys. Borrowed (copied in). Pass NULL when entry_count is 0.
      entry_count:
        type: idx
        description: The number of entries.
      out_value:
        type: value
        indirection: 1
        kind: OUT
        description: Receives the new composite value.
