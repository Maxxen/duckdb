# yaml-language-server: $schema=https://raw.githubusercontent.com/duckdblabs/capiv2/main/src/capigen/schema/module.schema.json
module: common
handles:
  environment:
    description: |
      An opaque handle to the V2 environment: the required root through
      which databases are opened. Holds the shared DBInstanceCache so
      that file-level conflicts (the same database file opened twice)
      are detected across all databases under the same environment.
      Destroying the environment refuses with
      ERROR_RESOURCE_IN_USE while any database opened through
      it is still alive — close those first.
    cleanup_with: destroy_environment
  database:
    description: An opaque handle to a DuckDB database instance
  connection:
    description: An opaque handle to a DuckDB connection
  option:
    description: |
      An opaque, owned handle to a single config option: name + setting,
      plus optional metadata (description, default setting, target scope,
      aliases). Created via option_create with a name and
      setting; created by the library with full metadata when returned
      from a database/connection get. Always destroyed by the caller via
      option_destroy. All accessors return values valid until
      destroy.
    cleanup_with: option_destroy
  # Error reporting. Every fallible function takes a trailing
  # `error_info *err` out-parameter.
  #
  # Contract:
  #   - The return value always carries the error code and is authoritative.
  #   - `err` is optional: callers may pass nullptr to opt out of detail.
  #   - If the call succeeds, `*err` is left as nullptr.
  #   - If the call fails and `err != nullptr`, the library allocates an
  #     info handle and stores its pointer in `*err`. The caller owns it
  #     and must destroy it with error_info_destroy.
  #   - If `*err` is already non-null on entry, the library destroys the
  #     previous info before writing. To preserve info across calls, detach
  #     it first: `saved = *err; *err = nullptr;`.
  error_info:
    description: Opaque detail for a failed call; destroy with error_info_destroy.
    cleanup_with: error_info_destroy
  logical_type:
    description: |
      An opaque, owned handle to a logical type. Carries a type id plus any
      kind-specific metadata (decimal width/scale, enum dictionary, list /
      array / struct / map / union child types, alias). Read-only from the C
      side today: instances arrive either from a query result schema or from
      logical_type_create_from_id for primitives. Composite construction
      (CREATE_LIST/STRUCT/etc) is not yet exposed. Always destroy via
      logical_type_destroy. Borrowed strings returned by getters
      are valid until destroy.
    cleanup_with: logical_type_destroy
  value:
    description: |
      An opaque, owned handle to a single SQL value. Carries a logical type
      plus a typed payload. Created via the primitive value_create_*
      constructors. Composite construction (LIST/STRUCT/MAP/ARRAY/UNION/ENUM)
      is not yet exposed. Always destroy via value_destroy. The
      pointers returned by *_get_varchar / *_get_blob / *_get_bit are
      borrowed and valid until the value is destroyed; *_get_bignum returns
      an owned magnitude buffer the caller must free() (BIGNUM is bit-encoded
      in storage, so the magnitude bytes are produced fresh on each call).
    cleanup_with: value_destroy
  result:
    description: |
      An opaque, owned handle to the streaming result of a query. Carries
      the schema (column names and logical types), the statement type,
      and the result type from prepare time; row data is produced
      incrementally by stepping (result_step) or draining
      (result_fetch_chunk). Single consumer: step from one thread at a
      time.

      A result is a cursor on the connection's execution, not a box of
      data. While it is live (not finished, cancelled, errored, or
      destroyed) the connection refuses new queries with
      ERROR_RESOURCE_IN_USE, and the query's transaction stays open,
      deferring version cleanup and checkpointing. Drain or destroy
      promptly. Side-effecting statements take effect only when the
      result is drained. Always destroy via result_destroy, which is
      safe even on a partially consumed stream.
    cleanup_with: result_destroy
  data_chunk:
    description: |
      An opaque, owned handle to a data chunk: a set of vectors of equal
      logical length plus a cardinality (row count). Each vector carries
      its own logical type. Chunks are produced by a streaming result
      via result_step / result_fetch_chunk and must be destroyed by
      the caller.

      Lifetime is fully independent of the producing result, connection,
      and database: the chunk owns its data, so the chunk and the
      vectors and view pointers borrowed from it remain valid until
      data_chunk_destroy, even if the producers are destroyed first.
    cleanup_with: data_chunk_destroy
  vector:
    description: |
      A borrowed handle to a vector within a data chunk. Carries one
      logical column's worth of values for the chunk. Lifetime is bound to
      the owning chunk; do not destroy. Use vector_get_view to read in a
      unified-format shape (data + validity + selection) per kind; the
      row count comes from the caller's context (the chunk for top-level
      vectors; parent geometry for nested children).
  string_heap:
    description: |
      Borrowed handle to a vector's string heap: the arena owning the
      out-of-line bytes of non-inlined VARCHAR / BLOB / BIT / BIGNUM values.
      Obtained via vector_get_string_heap. Do not destroy; valid until the
      owning vector is flattened, reallocated, or destroyed. Bytes added to it
      are owned by the vector.
  context:
    description: The DuckDB "context", essentially a "connection", but from the "inside" of DuckDB.
structs:
  str:
    description: |
      A borrowed, length-delimited string view: `ptr` points to `len` bytes
      of character data. The bytes are NOT guaranteed to be null-terminated
      and may contain interior null bytes; always honour `len` instead of
      scanning for a terminator. The view never owns its bytes — lifetime
      is documented by whichever function produced it (typically "valid
      until the owning handle is destroyed"). `{NULL, 0}` is the canonical
      empty view; `ptr` must not be dereferenced when `len` is 0. Not to be
      confused with `string`, the transparent 16-byte VARCHAR *storage*
      format — `str` is the decoded *view* shape that byte reads across the
      API boundary use.
    fields:
      - {name: ptr, type: char, pointer: 1, const: true}
      - {name: len, type: idx}
  string:
    description: |
      16-byte storage for a byte-backed value (VARCHAR / BLOB / BIT /
      BIGNUM), mirroring duckdb::string_t. Inlined when length <=
      STRING_INLINE_LENGTH (bytes in value.inlined.inlined); otherwise
      value.pointer.ptr holds the bytes and value.pointer.prefix the
      first 4. Read the fields directly; BIT / BIGNUM additionally
      carry a wire encoding, decoded via bit_decode / bignum_decode.
    fields:
      - name: value
        union:
          - name: pointer
            fields:
              - {name: length, type: u32}
              - {name: prefix, type: char, array_size: 4}
              - {name: ptr, type: char, pointer: 1}
          - name: inlined
            fields:
              - {name: length, type: u32}
              - {name: inlined, type: char, array_size: 12}
  opaque:
    description: |
      An opaque, owned handle to a user-defined resource. Bundles the pointer
      with optional callbacks to destroy and compare the resource.
    fields:
      - {name: ptr, type: void, pointer: 1}
      - {name: destroy, type: opaque_destroy}
      - {name: equals, type: opaque_equals}
callbacks:
  opaque_equals:
    return_type: bool
    parameters:
      a:
        type: void
        indirection: 1
        description: |
          Opaque pointer to the first resource. The library passes this pointer
          to the equality function when it needs to compare two resources for
          equality.
      b:
        type: void
        indirection: 1
        description: |
          Opaque pointer to the second resource. The library passes this pointer
          to the equality function when it needs to compare two resources for
          equality.
  opaque_destroy:
    return_type: void
    parameters:
      data:
        type: void
        indirection: 1
        description: |
          Opaque pointer to the resource to destroy. The library passes this
          pointer to the destructor when it's time to clean up the resource.
          The destructor is responsible for freeing it.
aliases:
  error_kind:
    underlying: u32
    description: The category part of an error code (the upper 16 bits)
  error_code:
    underlying: u32
    description: 'Full 32-bit error code: (group_id << 16) | code'
  API_CALL:
    underlying: error_code
  sel:
    underlying: u32
    description: Selection-vector entry. Mirrors duckdb::sel_t.
  varchar:
    underlying: string
    description: VARCHAR storage. Read the transparent string fields directly.
  blob:
    underlying: string
    description: BLOB storage. Read the transparent string fields directly.
  bit:
    underlying: string
    description: BIT storage. Decode via bit_decode.
  bignum:
    underlying: string
    description: BIGNUM storage. Decode via bignum_decode.
constants:
  STRING_INLINE_LENGTH:
    value: 12
    description: "Inline cutoff for `string` storage: a value of at most this many bytes is stored inline."
