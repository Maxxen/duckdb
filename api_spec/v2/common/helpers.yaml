    return_type: API_CALL
    static_inline: true
    description: Whether or not the BLOB value is inlined.
  blob_get_length:
    status:
      - ["frozen", "v1.5.4", "2026-05-18"]
    summary: Get the byte length of a BLOB value.
    parameters:
      blob:
        type: blob
        indirection: 1
        const: true
        description: The BLOB value to get the length of.
      out_length:
        type: u32
        indirection: 1
        kind: OUT
