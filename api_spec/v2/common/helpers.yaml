      - ["frozen", "v1.5.4", "2026-05-18"]
    summary: Whether or not the VARCHAR data is inlined.
    parameters:
      string:
        type: varchar
        indirection: 1
        const: true
      out_inlined:
        type: bool
        indirection: 1
