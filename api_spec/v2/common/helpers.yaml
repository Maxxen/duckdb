      - ["frozen", "v1.5.4", "2026-05-18"]
    summary: Get a pointer to the VARCHAR data.
    parameters:
      string:
        type: varchar
        indirection: 1
        const: true
        description: The VARCHAR data to get a data pointer for.
      out_data:
        type: char
        indirection: 2
        const: true
        kind: OUT_BORROW
        description: "Borrowed pointer to the VARCHAR data. Valid for the lifetime of the string data."
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy."
    return_type: API_CALL
    static_inline: true
    description: Get a pointer to the VARCHAR data.
