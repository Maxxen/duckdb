# yaml-language-server: $schema=https://raw.githubusercontent.com/duckdblabs/capiv2/main/src/capigen/schema/module.schema.json
module: common-helpers
functions:
  string_is_inlined:
    status:
      - ["frozen", "v1.5.4", "2026-05-18"]
    summary: Whether or not the string value is inlined.
    parameters:
      string:
        type: string
        indirection: 1
        const: true
      out_inlined:
        type: bool
        indirection: 1
        kind: OUT
        description: Set to true if the string data is stored inline (no separate allocation).
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy."
    return_type: API_CALL
    static_inline: true
    description: |-
      Whether or not the string value is inlined.
      This means that the data of the string does not have a separate allocation.
  string_get_length:
    status:
      - ["frozen", "v1.5.4", "2026-05-18"]
    summary: Get the length of a string.
    parameters:
      string:
        type: string
        indirection: 1
        const: true
        description: The string to get the length of.
      out_length:
        type: u32
        indirection: 1
        kind: OUT
        description: The length of the string.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy."
    return_type: API_CALL
    static_inline: true
    description: Get the length of a string.
  string_get_data:
    status:
      - ["frozen", "v1.5.4", "2026-05-18"]
    summary: Get a pointer to the string data.
    parameters:
      string:
        type: string
        indirection: 1
        const: true
        description: The string to get a data pointer for.
      out_data:
        type: char
        indirection: 2
        const: true
        kind: OUT_BORROW
        description: "Borrowed pointer to the string data. Valid for the lifetime of the string value."
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy."
    return_type: API_CALL
    static_inline: true
    description: Get a pointer to the string data.
  varchar_is_inlined:
