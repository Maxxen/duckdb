  bit_padding:
    status:
      - ["frozen", "v1.5.4", "2026-05-18"]
    summary: Get the number of padding bits in a BIT value.
    parameters:
      bit:
        type: bit
        indirection: 1
        const: true
        description: The BIT value to inspect.
      out_padding:
        type: u8
        indirection: 1
        kind: OUT
        description: "Number of padding bits (0-7) in the first byte."
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy."
    return_type: API_CALL
    static_inline: true
    description: Get the number of padding bits (0-7) stored in the first byte of a BIT value.
  bit_count:
    status:
      - ["frozen", "v1.5.4", "2026-05-18"]
    summary: Get the number of bits in a BIT value.
    parameters:
      bit:
        type: bit
        indirection: 1
        const: true
        description: The BIT value to measure.
      out_count:
        type: u64
        indirection: 1
        kind: OUT
        description: The number of bits in the BIT value.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy."
    return_type: API_CALL
    static_inline: true
    description: Get the number of bits in a BIT value.
  bit_get_data:
    status:
      - ["frozen", "v1.5.4", "2026-05-18"]
    summary: Get a pointer to the BIT payload data.
    parameters:
      bit:
        type: bit
        indirection: 1
        const: true
        description: The BIT value to get a data pointer for.
      out_data:
        type: u8
        indirection: 2
        const: true
        kind: OUT_BORROW
        description: "Borrowed pointer to the bit payload (data[0] is the padding byte; data[1..] is the bit data). Valid for the lifetime of the bit value."
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy."
    return_type: API_CALL
    static_inline: true
    description: Get a pointer to the BIT payload data. The first byte is the padding count; the bit data follows.
  bignum_is_negative:
    status:
      - ["frozen", "v1.5.4", "2026-05-18"]
    summary: Whether a BIGNUM value is negative.
    parameters:
      bignum:
        type: bignum
        indirection: 1
        const: true
        description: The BIGNUM value to inspect.
      out_negative:
        type: bool
        indirection: 1
        kind: OUT
        description: Set to true if the BIGNUM value is negative.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy."
    return_type: API_CALL
    static_inline: true
    description: "Whether a BIGNUM value is negative. Sign encoding: the MSB of data[0] clear = negative, set = positive."
