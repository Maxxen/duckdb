        description: The BLOB value to get a data pointer for.
      out_data:
        type: char
        indirection: 2
        const: true
        kind: OUT_BORROW
        description: "Borrowed pointer to the BLOB data. Valid for the lifetime of the blob value."
      err:
        type: error_info
        indirection: 1
