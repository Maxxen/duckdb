      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy."
    return_type: API_CALL
    static_inline: true
    description: Whether or not the VARCHAR data is inlined.
  varchar_get_length:
    status:
      - ["frozen", "v1.5.4", "2026-05-18"]
    summary: Get the length of a VARCHAR data.
    parameters:
      string:
        type: varchar
        indirection: 1
