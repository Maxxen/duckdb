# yaml-language-server: $schema=https://cdn.jsdelivr.net/gh/duckdb/capigen@v0.5.0/src/capigen/schema/module.schema.json
module: function
# Shared, generic function property channel. Used by the various function
# builders (scalar, aggregate, ...) via `*_builder_set_property` /
# `_get_property` to configure metadata that influences planning and execution.
# Properties are expressed as a (key, value) pair of named enum values rather
# than typed booleans so that boolean-like properties can grow additional
# values later without breaking the ABI.
#
# Numbering scheme. Identifiers are laid out as 0xGGKKVV, mirroring the C++
# FunctionProperties inheritance hierarchy:
#   * GG (bits 16-23): function-type group / super-range. The COMMON group holds
#     the properties shared by every function type (the base class); each other
#     group reserves a range for properties specific to that function type:
#       0x01 COMMON     (applies to all function types)
#       0x02 SCALAR     (reserved)
#       0x03 AGGREGATE
#       0x04 WINDOW     (reserved)
#       0x05 TABLE      (reserved)
#       0x06 COPY       (reserved)
#   * KK (bits 8-15): key index within the group. A KEY id is `0xGGKK00`.
#   * VV (bits 0-7): value index within the key. A VALUE id is `0xGGKKVV`.
# Therefore:
#   * value V belongs to key K        iff `(V & 0xFFFF00) == K`
#   * a key/value belongs to group G  iff `(id & 0xFF0000) == G`
# A key is valid for a given builder iff its group is COMMON or that builder's
# own group. Existing numeric values are stable; only append new keys/values.
enums:
  FUNCTION_PROPERTY_KEY:
    description: |
      Identifies a configurable function property. Pass one of these to
      `*_function_builder_set_property` / `_get_property` together with a
      matching `FUNCTION_PROPERTY_VALUE`. The high byte is the function-type
      group: COMMON (`0x01xxxx`) keys apply to all function types, while
      group-specific keys (e.g. aggregate `0x03xxxx`) are only valid for that
      function type and are rejected with an error otherwise.
    values:
      # COMMON group (0x01xxxx)
      FUNCTION_PROPERTY_STABILITY:
        value: 0x010000
        description: "How stable/deterministic the function's result is across rows and queries. Accepts the `FUNCTION_PROPERTY_STABILITY_*` values. Defaults to `CONSISTENT`."
      FUNCTION_PROPERTY_NULL_HANDLING:
        value: 0x010100
        description: "Whether the function handles NULL inputs itself. Accepts the `FUNCTION_PROPERTY_NULL_HANDLING_*` values. Defaults to `DEFAULT` (NULL in, NULL out)."
      FUNCTION_PROPERTY_FALLIBILITY:
        value: 0x010200
        description: "Whether the function can raise a runtime error. Accepts the `FUNCTION_PROPERTY_FALLIBILITY_*` values. Defaults to `INFALLIBLE`."
      FUNCTION_PROPERTY_COLLATION_HANDLING:
        value: 0x010300
        description: "How the function interacts with collations on its arguments. Accepts the `FUNCTION_PROPERTY_COLLATION_HANDLING_*` values. Defaults to `PROPAGATE`."
      # AGGREGATE group (0x03xxxx)
      FUNCTION_PROPERTY_AGG_ORDER_DEPENDENT:
        value: 0x030000
        description: "Aggregate only. Whether the aggregate's result depends on the order in which rows are aggregated. Accepts the `FUNCTION_PROPERTY_AGG_ORDER_DEPENDENT_*` values. Defaults to `YES`."
      FUNCTION_PROPERTY_AGG_DISTINCT_DEPENDENT:
        value: 0x030100
        description: "Aggregate only. Whether the aggregate's result is affected by a DISTINCT modifier. Accepts the `FUNCTION_PROPERTY_AGG_DISTINCT_DEPENDENT_*` values. Defaults to `YES`."
  FUNCTION_PROPERTY_VALUE:
    description: |
      A value for a `FUNCTION_PROPERTY_KEY`. Each key owns a 256-value block: a
      value `V` is valid for key `K` iff `(V & 0xFFFF00) == K`, and shares the
      key's function-type group (`V & 0xFF0000`) in its high byte. Passing a
      value that does not match the key is rejected with an error. Boolean-like
      properties are
      expressed as named values so that additional values can be added later
      without breaking the ABI.
    values:
      # FUNCTION_PROPERTY_STABILITY (0x010000)
      FUNCTION_PROPERTY_STABILITY_CONSISTENT:
        value: 0x010000
        description: "The function always returns the same result given the same input."
      FUNCTION_PROPERTY_STABILITY_VOLATILE:
        value: 0x010001
        description: "The result may differ per row (e.g. random())."
      FUNCTION_PROPERTY_STABILITY_CONSISTENT_WITHIN_QUERY:
        value: 0x010002
        description: "The result is stable within a single query/transaction but may change across queries (e.g. now())."
      # FUNCTION_PROPERTY_NULL_HANDLING (0x010100)
      FUNCTION_PROPERTY_NULL_HANDLING_DEFAULT:
        value: 0x010100
        description: "Default NULL handling: if any argument is NULL the result is NULL and the function is not invoked for that row."
      FUNCTION_PROPERTY_NULL_HANDLING_SPECIAL:
        value: 0x010101
        description: "The function handles NULL inputs itself and is invoked even when arguments are NULL."
      # FUNCTION_PROPERTY_FALLIBILITY (0x010200)
      FUNCTION_PROPERTY_FALLIBILITY_INFALLIBLE:
        value: 0x010200
        description: "The function never raises a runtime error."
      FUNCTION_PROPERTY_FALLIBILITY_FALLIBLE:
        value: 0x010201
        description: "The function may raise a runtime error for some inputs."
      # FUNCTION_PROPERTY_COLLATION_HANDLING (0x010300)
      FUNCTION_PROPERTY_COLLATION_HANDLING_PROPAGATE:
        value: 0x010300
        description: "The function combines collations from its inputs and propagates them to its result (default)."
      FUNCTION_PROPERTY_COLLATION_HANDLING_PUSH_COMBINABLE:
        value: 0x010301
        description: "Combinable collations are executed on the input arguments before the function runs."
      FUNCTION_PROPERTY_COLLATION_HANDLING_IGNORE:
        value: 0x010302
        description: "Collations are ignored by the function."
      # FUNCTION_PROPERTY_AGG_ORDER_DEPENDENT (0x030000)
      FUNCTION_PROPERTY_AGG_ORDER_DEPENDENT_YES:
        value: 0x030000
        description: "The aggregate's result depends on the order in which rows are aggregated (default)."
      FUNCTION_PROPERTY_AGG_ORDER_DEPENDENT_NO:
        value: 0x030001
        description: "The aggregate's result does not depend on input order."
      # FUNCTION_PROPERTY_AGG_DISTINCT_DEPENDENT (0x030100)
      FUNCTION_PROPERTY_AGG_DISTINCT_DEPENDENT_YES:
        value: 0x030100
        description: "The aggregate's result is affected by a DISTINCT modifier (default)."
      FUNCTION_PROPERTY_AGG_DISTINCT_DEPENDENT_NO:
        value: 0x030101
        description: "The aggregate's result is not affected by a DISTINCT modifier."
# Bind-time argument list, shared by scalar, aggregate, and table functions. Reached via the
# family's bind_get_arguments during the bind callback. The list is in signature-slot order: one
# entry per fixed parameter (a table call's omitted defaults already injected), then any varargs
# extras, already expanded. Arguments surface as types, folded values, and slot names, never as
# expressions (table arguments are constant values engine-side, so folding them is a copy). The
# list is read-only: a bind callback inspects the arguments for its own bind data but does not
# mutate the plan.
handles:
  bind_arguments:
    description: |
      Borrowed handle to a function's bound argument list during the bind callback, in
      signature-slot order. Provides the argument count and per-index access to argument types,
      folded values, and slot names. Read-only; valid only for the duration of the bind callback;
      do not store it.
functions:
  bind_arguments_get_count:
    description: |
      Returns the number of bound arguments.

      One entry per argument the call supplied, including varargs extras (already expanded).
    role: getter
    belongs_to: bind_arguments
    parameters:
      args:
        type: bind_arguments
        description: The bind arguments handle.
      out_count:
        type: idx
        indirection: 1
        kind: OUT
        description: Receives the argument count.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: ERROR
  bind_arguments_get_type:
    description: |
      Returns the resolved type of a bound argument.

      An owned copy of argument `index`'s resolved type; the caller destroys it via
      logical_type_destroy. Returns ERROR_INPUT_INVALID if index is out of range (>= the count
      from bind_arguments_get_count).
    role: getter
    belongs_to: bind_arguments
    parameters:
      args:
        type: bind_arguments
        description: The bind arguments handle.
      index:
        type: idx
        description: Zero-based argument index.
      out_type:
        type: logical_type
        indirection: 1
        kind: OUT
        description: Receives the owned argument type.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: ERROR
  bind_arguments_get_name:
    description: |
      Borrows the resolved slot name of a bound argument.

      The resolved name of the slot at `index`: the signature parameter name for a fixed slot,
      the caller-provided name for a named vararg, and the empty view {NULL, 0} for an unnamed
      vararg. The view is borrowed and valid only for the duration of the bind callback. Returns
      ERROR_INPUT_INVALID if index is out of range.
    role: getter
    belongs_to: bind_arguments
    parameters:
      args:
        type: bind_arguments
        description: The bind arguments handle.
      index:
        type: idx
        description: Zero-based argument index.
      out_name:
        type: identifier
        indirection: 1
        kind: OUT_BORROW
        description: Receives a borrowed view of the slot name; the empty view for an unnamed vararg.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: ERROR
  bind_arguments_fold:
    description: |
      Folds a bound argument to a constant value.

      Evaluates argument `index` to a single owned value the caller destroys via value_destroy.
      Exists because bind runs before optimizer constant folding, so a constant-computable
      argument (e.g. 0.25 + 0.25) is not yet a plain constant. Table function arguments are
      already constant values, so folding them always succeeds. Returns ERROR_INPUT_INVALID if
      the argument is not constant-foldable (e.g. it references a column) or index is out of
      range; a runtime error raised while evaluating surfaces as its own error code.
    belongs_to: bind_arguments
    parameters:
      args:
        type: bind_arguments
        description: The bind arguments handle.
      ctx:
        type: context
        description: The bind callback's context.
      index:
        type: idx
        description: Zero-based argument index.
      out_value:
        type: value
        indirection: 1
        kind: OUT
        description: Receives the owned folded value.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: ERROR
