# yaml-language-server: $schema=https://cdn.jsdelivr.net/gh/duckdb/capigen@v0.4.0/src/capigen/schema/module.schema.json
module: scalar
handles:
  scalar_function_builder:
    description: "An opaque handle to a scalar function builder. \nCreated with `scalar_function_builder_create`, configured with the various `scalar_function_set_*` functions, and registered with `scalar_function_register`. \nThe builder is owned by the caller and must be destroyed with `scalar_function_builder_destroy` when no longer needed.\n"
    cleanup_with: scalar_function_builder_destroy
# Callback Structs
structs:
  scalar_function_bind_args:
    fields:
      - {name: struct_size, type: u32, description: "The size of this struct. This can be used for versioning and compatibility checks."}
      - {name: function_name, type: identifier, description: "The name of the function being bound. Borrowed; only valid for the duration of the callback."}
      - {name: user_data, type: void, pointer: 1, description: "Opaque pointer to user data set by the caller when registering the function, if any"}
      - {name: out_bind_data, type: opaque, description: "On success, the callback can set this to an opaque handle bundling a pointer to user data (the function's \"bind data\") plus optional destructor and equality callbacks. The bind data is accessible from later callbacks (e.g. \"init\" and \"exec\"), which is useful for sharing information between the planning and execution phases such as resolved argument types, prepared statements, or other metadata computed during binding. The destructor, if provided, is used to destroy the bind data when it's no longer needed (e.g. at the end of query execution). The equality callback, if provided, is used to compare two bind data pointers (e.g. for plan caching/reuse); otherwise a default pointer equality check is used."}
      - {name: arguments, type: bind_arguments, description: "Borrowed handle to the function's bound argument list, for inspection and mutation during bind. Read it with the bind_arguments accessors: count, get an argument's type, fold an argument to a value, replace an argument with a constant, or truncate the list from the tail. Present when struct_size covers this field. Borrowed; valid only for the duration of the callback."}
  scalar_function_init_args:
    fields:
      - {name: struct_size, type: u32, description: "The size of this struct. This can be used for versioning and compatibility checks."}
      - {name: function_name, type: identifier, description: "The name of the function being initialized. Borrowed; only valid for the duration of the callback."}
      - {name: user_data, type: void, pointer: 1, description: "Opaque pointer to user data set by the caller when registering the function, if any"}
      - {name: bind_data, type: void, pointer: 1, description: "Opaque pointer to user data set by the function's \"bind\" callback, if any"}
      - {name: out_init_data, type: opaque, description: "On success, the callback can set this to an opaque handle bundling a pointer to worker-local \"init data\" plus an optional destructor callback. The init data is associated with the executing worker thread for the duration of the query and accessible from the function's \"exec\" callback. Note that the \"init data\" is worker-local, not _thread local_: there is no guarantee that the same thread will see the same \"init data\" across multiple invocations of the function. The destructor, if provided, is used to destroy the init data when it's no longer needed; the opaque handle's equality callback is unused for init data."}
  scalar_function_exec_args:
    fields:
      - {name: struct_size, type: u32, description: "The size of this struct. This can be used for versioning and compatibility checks."}
      - {name: function_name, type: identifier, description: "The name of the function being executed. Borrowed; only valid for the duration of the callback."}
      - {name: user_data, type: void, pointer: 1, description: "Opaque pointer to user data set by the caller when registering the function, if any"}
      - {name: bind_data, type: void, pointer: 1, description: "Opaque pointer to user data set by the function's \"bind\" callback, if any"}
      - {name: init_data, type: void, pointer: 1, description: "Opaque pointer to user data set by the function's \"init\" callback for the executing worker thread, if any"}
      - {name: input, type: data_chunk, description: "The input data chunk for the current invocation. This contains vectors for each argument passed to the function, with one row per input row for the current batch."}
      - {name: result, type: vector, description: "The vector in which the function should write its result values for the current invocation."}
# Callbacks
callbacks:
  scalar_function_bind_callback:
    return_type: void
    parameters:
      args:
        type: scalar_function_bind_args
        indirection: 1
        description: "The bind callback's arguments struct, providing access to information about the function being bound as well as user data set at registration time. \nThe library owns this struct and guarantees its validity only for the duration of the callback invocation; Callees must not attempt to store or use it after the callback returns.\n"
      context:
        type: context
        description: "The DuckDB context in which the function is being bound. Borrowed; only valid for the duration of the callback."
      err:
        type: error_info
        indirection: 1
        description: "Error info handle, provided by DuckDB. \nCan be used to signal failure and report error details if the callback encounters an error. \nOn success, leave `*err` unchanged. On failure, set an appropriate error code and message in `err` and return. DuckDB will inspect the error info after the callback returns to determine whether the call succeeded or failed.\nThe error info handle is owned by DuckDB, is always valid when the callback is invoked, and must not be stored or destroyed by the callee.\n"
  scalar_function_init_callback:
    return_type: void
    parameters:
      args:
        type: scalar_function_init_args
        indirection: 1
        description: "The init callback's arguments struct, providing access to information about the function being initialized as well as user data set at registration time and by the function's bind callback. \nThe library owns this struct and guarantees its validity only for the duration of the callback invocation; Callees must not attempt to store or use it after the callback returns.\n"
      context:
        type: context
        description: "The DuckDB context in which the function is being initialized, or null for invocations that initialize the function without a client context (some internal expression evaluations, e.g. index expressions, run this way). Borrowed; only valid for the duration of the callback."
      err:
        type: error_info
        indirection: 1
        description: "Error info handle, provided by DuckDB. \nCan be used to signal failure and report error details if the callback encounters an error. \nOn success, leave `*err` unchanged. On failure, set an appropriate error code and message in `err` and return. DuckDB will inspect the error info after the callback returns to determine whether the call succeeded or failed.\nThe error info handle is owned by DuckDB, is always valid when the callback is invoked, and must not be stored or destroyed by the callee.\n"
  scalar_function_exec_callback:
    return_type: void
    parameters:
      args:
        type: scalar_function_exec_args
        indirection: 1
        description: "The exec callback's arguments struct, providing access to information about the function being executed as well as user data set at registration time and by the function's bind and init callbacks. \nThe library owns this struct and guarantees its validity only for the duration of the callback invocation; Callees must not attempt to store or use it after the callback returns.\n"
      context:
        type: context
        description: "The execution context, or null for invocations that evaluate the function without a client context (some internal expression evaluations, e.g. index expressions, run this way). Borrowed; only valid for the duration of the callback. Enables context-dependent work in exec such as Arrow conversions and value casts."
      err:
        type: error_info
        indirection: 1
        description: "Error info handle, provided by DuckDB. \nCan be used to signal failure and report error details if the callback encounters an error. \nOn success, leave `*err` unchanged. On failure, set an appropriate error code and message in `err` and return. DuckDB will inspect the error info after the callback returns to determine whether the call succeeded or failed.\nThe error info handle is owned by DuckDB, is always valid when the callback is invoked, and must not be stored or destroyed by the callee.\n"
# Functions
functions:
  scalar_function_builder_create:
    summary: Creates a new scalar function.
    description: "Creates a new scalar function builder that can be configured with the various `scalar_function_set_*` functions and registered with `scalar_function_register`. \nOn success, returns a handle to the new builder. The builder is owned by the caller and must be destroyed with `scalar_function_builder_destroy` when no longer needed.\n"
    parameters:
      name:
        type: context
        description: The DuckDB context in which the function will be created.
      out:
        type: scalar_function_builder
        indirection: 1
        kind: OUT
        description: On success, receives the newly created scalar function builder. The caller owns the builder and must destroy it with `scalar_function_builder_destroy`.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: API_CALL
  scalar_function_builder_set_name:
    summary: Sets the name of a scalar function.
    description: "The library makes an internal copy of the provided name and does not take ownership. \nFailing to set a name before registration results in an error.\n"
    parameters:
      func:
        type: scalar_function_builder
        description: The scalar function to configure
      name:
        type: identifier
        description: The name to set for the function.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: API_CALL
  scalar_function_builder_set_bind_callback:
    summary: Sets the bind callback for a scalar function.
    description: "The \"Bind\" callback is invoked during query planning and can be used to perform type resolution, argument validation, and other setup tasks. \nAdditionally a \"Bind\" callback can set a \"bind data\" pointer which can be accessed by later callbacks (e.g. \"Init\" and \"Exec\") to share information between the planning and execution phases.\n"
    parameters:
      func:
        type: scalar_function_builder
        description: The scalar function to configure.
      callback:
        type: scalar_function_bind_callback
        description: The bind callback to set for the function.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: API_CALL
  scalar_function_builder_set_init_callback:
    summary: Sets the init callback for a scalar function.
    description: |
      The "Init" callback is invoked at the beginning of query execution for each worker thread that will execute the function.
      It can be used to setup an "init data" pointer which can be accessed by the "Exec" callback via `scalar_function_get_init_data` to keep worker-local mutable state across invocations of the function.
    parameters:
      func:
        type: scalar_function_builder
        description: The scalar function to configure.
      callback:
        type: scalar_function_init_callback
        description: The "init callback" to set for the function.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: API_CALL
  scalar_function_builder_set_exec_callback:
    summary: Sets the "exec" callback for a scalar function.
    description: "The \"Exec\" callback is invoked during query execution to evaluate the function for each batch of input rows. \nThis is the main callback that implements the logic of the function. \nFailing to set an \"exec\" callback before registration results in an error.\n"
    parameters:
      func:
        type: scalar_function_builder
        description: The scalar function to configure.
      callback:
        type: scalar_function_exec_callback
        description: The "exec" callback to set for the function. This is the callback that will be invoked to execute the function for each batch of input rows during query execution.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: API_CALL
  scalar_function_builder_register:
    summary: Registers a scalar function with a database, making the function available for use in queries.
    description: "This function registers a fully configured scalar function builder with a database, making the function available for use in SQL queries executed on that database. \nThe function builder must have at least its name and exec callback set before registration; otherwise, registration will fail with an error.\nDuckDB makes an internal copy of the configured function and its properties during registration, so the caller retains ownership of the builder and can safely destroy or modify it after registration without affecting the registered function.\nRegistered functions do not support plan serialization; the bind callback runs once per binding of a call site.\n"
    parameters:
      context:
        type: context
        description: The DuckDB context in which to register the function.
      func:
        type: scalar_function_builder
        description: The scalar function to register.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: API_CALL
  scalar_function_builder_destroy:
    summary: Destroys a scalar function, releasing its resources.
    description: "This function destroys a scalar function builder that was created with `scalar_function_builder_create`, releasing any resources associated with it. \nIf the builder has already been registered with a database, destroying it does not affect the registered function in the database, as DuckDB makes an internal copy of the function during registration. \nThis function is null-safe: calling it with a null pointer is a no-op and returns ERROR_NONE.\nThe handle is set to null on return to prevent double-destruction.\n"
    parameters:
      func:
        type: scalar_function_builder
        indirection: 1
        description: The scalar function to destroy.
    return_type: API_CALL
  scalar_function_builder_set_user_data:
    summary: Sets arbitrary extra data on a scalar function.
    description: "This function allows the caller to associate an opaque pointer to arbitrary user data with a scalar function. \nThis is useful for associating custom metadata or static context with the function that can be retrieved later from callbacks via `scalar_function_get_user_data`.\n"
    parameters:
      func:
        type: scalar_function_builder
        description: The scalar function to configure.
      data:
        type: opaque
        description: Opaque pointer to user data.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: API_CALL
  scalar_function_builder_set_varargs:
    summary: Sets the varargs type of a scalar function.
    description: |
      Makes the function variadic: after its fixed parameters, it accepts any number of extra
      trailing arguments, each implicitly cast to `type`. Pass ANY for a heterogeneous tail whose
      arguments keep their own types (read them per column in the exec callback). A NULL or INVALID
      type is rejected with ERROR_INVALID_INPUT; ANY is accepted. Calling this again overwrites the
      previous varargs type. The library copies the type and does not take ownership.
    parameters:
      func:
        type: scalar_function_builder
        description: The scalar function to configure.
      type:
        type: logical_type
        description: The type extra trailing arguments are cast to. ANY leaves them un-cast.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: API_CALL
  # TODO: Make this more involved.
  scalar_function_builder_add_parameter:
    summary: Adds a parameter to a scalar function.
    description: "Adds a fixed parameter to a scalar function with the specified name and type. \nThe library makes an internal copy of the provided name and type, and does not take ownership of either. \nANY is accepted (a fixed-arity wildcard parameter); a variadic tail is configured separately via scalar_function_builder_set_varargs.\n"
    parameters:
      func:
        type: scalar_function_builder
        description: The scalar function to configure.
      name:
        type: identifier
        description: The name of the parameter to add.
      type:
        type: logical_type
        description: The type of the parameter to add.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: API_CALL
  scalar_function_builder_set_return_type:
    summary: Sets the return type of a scalar function.
    description: |
      Sets the return type of a scalar function. The library makes an internal copy of the provided type and does not take ownership of it.
      Failing to set a return type before registration results in an error. The return type must be a fully defined concrete type: registration rejects ANY (and any other incomplete type) with ERROR_INVALID_INPUT.
    parameters:
      func:
        type: scalar_function_builder
        description: The scalar function to configure.
      type:
        type: logical_type
        description: The return type to set for the function.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: API_CALL
  scalar_function_builder_set_property:
    summary: Sets a property on a scalar function.
    description: |
      Configures a function property that influences planning and execution, such as stability (volatility), NULL handling, fallibility, or collation handling.
      The `value` must be one of the `FUNCTION_PROPERTY_VALUE` entries that matches `key`; passing a value that does not correspond to `key`, or a key that is not valid for scalar functions, results in an error.
    parameters:
      func:
        type: scalar_function_builder
        description: The scalar function to configure.
      key:
        type: FUNCTION_PROPERTY_KEY
        description: The property to set.
      value:
        type: FUNCTION_PROPERTY_VALUE
        description: The value to set for the property. Must be a value that matches `key`.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: API_CALL
  scalar_function_builder_get_property:
    summary: Gets a property from a scalar function.
    description: |
      Retrieves the current value of a function property previously set with `scalar_function_builder_set_property`, or its default if it was never set.
      Passing a key that is not valid for scalar functions results in an error.
    parameters:
      func:
        type: scalar_function_builder
        description: The scalar function to query.
      key:
        type: FUNCTION_PROPERTY_KEY
        description: The property to retrieve.
      out_value:
        type: FUNCTION_PROPERTY_VALUE
        indirection: 1
        kind: OUT
        description: On success, receives the current value of the property.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: API_CALL
