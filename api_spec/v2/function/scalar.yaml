module: scalar
handles:
  scalar_function_builder:
    description: "An opaque handle to a scalar function builder. \nCreated with `scalar_function_builder_create`, configured with the various `scalar_function_set_*` functions, and registered with `scalar_function_register`. \nThe builder is owned by the caller and must be destroyed with `scalar_function_builder_destroy` when no longer needed.\n"
    cleanup_with: scalar_function_builder_destroy
  scalar_function_bind_info:
    description: |
      Borrowed handle passed to the bind callback. Provides access to the function name, user data set at
      registration, and the bound argument list, and is used to set the function's bind data. Valid only for
      the duration of the callback; must not be stored or used after the callback returns.
  scalar_function_init_info:
    description: |
      Borrowed handle passed to the init callback. Provides access to the function name, user data set at
      registration, and the bind data set during bind, and is used to set worker-local init data. Valid only
      for the duration of the callback; must not be stored or used after the callback returns.
  scalar_function_exec_info:
    description: |
      Borrowed handle passed to the exec callback. Provides access to the function name, user data set at
      registration, the bind data, the worker-local init data, the input data chunk, and the result vector to
      fill. Valid only for the duration of the callback; must not be stored or used after the callback returns.
# Callbacks
callbacks:
  scalar_function_bind_callback:
    return_type: void
    parameters:
      info:
        type: scalar_function_bind_info
        description: "Borrowed handle providing access to the function being bound and user data, and used to set bind data via `scalar_function_bind_set_bind_data`. \nThe library owns this handle and guarantees its validity only for the duration of the callback invocation; callees must not store or use it after the callback returns.\n"
      context:
        type: context
        description: "The DuckDB context in which the function is being bound. Borrowed; only valid for the duration of the callback."
      err:
        type: error_info
        indirection: 1
        description: "Error info handle, provided by DuckDB. \nCan be used to signal failure and report error details if the callback encounters an error. \nOn success, leave `*err` unchanged. On failure, set an appropriate error code and message in `err` and return. DuckDB will inspect the error info after the callback returns to determine whether the call succeeded or failed.\nThe error info handle is owned by DuckDB, is always valid when the callback is invoked, and must not be stored or destroyed by the callee.\n"
  scalar_function_init_callback:
    return_type: void
    parameters:
      info:
        type: scalar_function_init_info
        description: "Borrowed handle providing access to the function being initialized, user data, and bind data, and used to set init data via `scalar_function_init_set_init_data`. \nThe library owns this handle and guarantees its validity only for the duration of the callback invocation; callees must not store or use it after the callback returns.\n"
      context:
        type: context
        description: "The DuckDB context in which the function is being initialized, or null for invocations that initialize the function without a client context (some internal expression evaluations, e.g. index expressions, run this way). Borrowed; only valid for the duration of the callback."
      err:
        type: error_info
        indirection: 1
        description: "Error info handle, provided by DuckDB. \nCan be used to signal failure and report error details if the callback encounters an error. \nOn success, leave `*err` unchanged. On failure, set an appropriate error code and message in `err` and return. DuckDB will inspect the error info after the callback returns to determine whether the call succeeded or failed.\nThe error info handle is owned by DuckDB, is always valid when the callback is invoked, and must not be stored or destroyed by the callee.\n"
  scalar_function_exec_callback:
    return_type: void
    parameters:
      info:
        type: scalar_function_exec_info
        description: "Borrowed handle providing access to the input data chunk and the result vector to fill, plus bind data, init data, and user data. \nThe library owns this handle and guarantees its validity only for the duration of the callback invocation; callees must not store or use it after the callback returns.\n"
      context:
        type: context
        description: "The execution context, or null for invocations that evaluate the function without a client context (some internal expression evaluations, e.g. index expressions, run this way). Borrowed; only valid for the duration of the callback. Enables context-dependent work in exec such as Arrow conversions and value casts."
      err:
        type: error_info
        indirection: 1
        description: "Error info handle, provided by DuckDB. \nCan be used to signal failure and report error details if the callback encounters an error. \nOn success, leave `*err` unchanged. On failure, set an appropriate error code and message in `err` and return. DuckDB will inspect the error info after the callback returns to determine whether the call succeeded or failed.\nThe error info handle is owned by DuckDB, is always valid when the callback is invoked, and must not be stored or destroyed by the callee.\n"
# Functions
functions:
  scalar_function_builder_create:
    description: |
      Creates a new scalar function builder that can be configured with the various `scalar_function_set_*` functions and registered with `scalar_function_builder_register_with_connection` or `scalar_function_builder_register_with_extension`.
      On success, returns a handle to the new builder. The builder is owned by the caller and must be destroyed with `scalar_function_builder_destroy` when no longer needed.
    parameters:
      out:
        type: scalar_function_builder
        indirection: 1
        kind: OUT
        description: On success, receives the newly created scalar function builder. The caller owns the builder and must destroy it with `scalar_function_builder_destroy`.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: ERROR
  scalar_function_builder_set_name:
    description: |
      Sets the name of a scalar function.

      The library makes an internal copy of the provided name and does not take ownership.
      Failing to set a name before registration results in an error.
    parameters:
      func:
        type: scalar_function_builder
        description: The scalar function to configure
      name:
        type: identifier
        description: The name to set for the function.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: ERROR
  scalar_function_builder_set_bind_callback:
    description: |
      Sets the bind callback for a scalar function.

      The "Bind" callback is invoked during query planning and can be used to perform type resolution, argument validation, and other setup tasks.
      Additionally a "Bind" callback can set a "bind data" pointer which can be accessed by later callbacks (e.g. "Init" and "Exec") to share information between the planning and execution phases.
    parameters:
      func:
        type: scalar_function_builder
        description: The scalar function to configure.
      callback:
        type: scalar_function_bind_callback
        description: The bind callback to set for the function.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: ERROR
  scalar_function_builder_set_init_callback:
    description: |
      Sets the init callback for a scalar function.

      The "Init" callback is invoked at the beginning of query execution for each worker thread that will execute the function.
      It can be used to setup an "init data" pointer which can be accessed by the "Exec" callback via `scalar_function_exec_get_init_data` to keep worker-local mutable state across invocations of the function.
    parameters:
      func:
        type: scalar_function_builder
        description: The scalar function to configure.
      callback:
        type: scalar_function_init_callback
        description: The "init callback" to set for the function.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: ERROR
  scalar_function_builder_set_exec_callback:
    description: |
      Sets the "exec" callback for a scalar function.

      The "Exec" callback is invoked during query execution to evaluate the function for each batch of input rows.
      This is the main callback that implements the logic of the function.
      Failing to set an "exec" callback before registration results in an error.
    parameters:
      func:
        type: scalar_function_builder
        description: The scalar function to configure.
      callback:
        type: scalar_function_exec_callback
        description: The "exec" callback to set for the function. This is the callback that will be invoked to execute the function for each batch of input rows during query execution.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: ERROR
  scalar_function_builder_register_with_connection:
    description: |
      Registers a scalar function on a connection, making the function available for use in queries.

      This function registers a fully configured scalar function builder with the connection's database, making the function available for use in SQL queries executed on that database. The registration runs in its own transaction on the connection's context.
      The function builder must have at least its name and exec callback set before registration; otherwise, registration will fail with an error.
      DuckDB makes an internal copy of the configured function and its properties during registration, so the caller retains ownership of the builder and can safely destroy or modify it after registration without affecting the registered function.
      Registered functions do not support plan serialization; the bind callback runs once per binding of a call site.
    parameters:
      conn:
        type: connection
        description: The connection whose database to register the function on.
      func:
        type: scalar_function_builder
        description: The scalar function to register.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: ERROR
  scalar_function_builder_register_with_extension:
    description: |
      Registers a scalar function on the extension being loaded, making the function available for use in queries.

      This function registers a fully configured scalar function builder with the loading extension's database, making the function available for use in SQL queries. Use this from an extension-load callback, where an extension handle is in hand; the entry is attributed to the extension and installed on the database's system transaction.
      The function builder must have at least its name and exec callback set before registration; otherwise, registration will fail with an error.
      DuckDB makes an internal copy of the configured function and its properties during registration, so the caller retains ownership of the builder and can safely destroy or modify it after registration without affecting the registered function.
      Registered functions do not support plan serialization; the bind callback runs once per binding of a call site.
    parameters:
      extension:
        type: extension
        description: The extension being loaded, on which to register the function.
      func:
        type: scalar_function_builder
        description: The scalar function to register.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: ERROR
  scalar_function_builder_destroy:
    description: |
      Destroys a scalar function, releasing its resources.

      This function destroys a scalar function builder that was created with `scalar_function_builder_create`, releasing any resources associated with it.
      If the builder has already been registered with a database, destroying it does not affect the registered function in the database, as DuckDB makes an internal copy of the function during registration.
      This function is null-safe: calling it with a null pointer is a no-op and returns ERROR_NONE.
      The handle is set to null on return to prevent double-destruction.
    parameters:
      func:
        type: scalar_function_builder
        indirection: 1
        description: The scalar function to destroy.
    return_type: ERROR
  scalar_function_builder_set_user_data:
    description: |
      Sets arbitrary extra data on a scalar function.

      This function allows the caller to associate an opaque pointer to arbitrary user data with a scalar function.
      This is useful for associating custom metadata or static context with the function that can be retrieved later from callbacks via the `scalar_function_*_get_user_data` accessors.
    parameters:
      func:
        type: scalar_function_builder
        description: The scalar function to configure.
      data:
        type: opaque
        description: Opaque pointer to user data.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: ERROR
  scalar_function_builder_set_signature:
    description: |
      Sets the signature of a scalar function.

      Copies a function signature into the builder: the fixed parameters (names, types, defaults), the optional variadic tail, and the return type.
      The signature is borrowed and copied; the caller destroys it independently. Calling this again replaces the previous signature.
      Registration requires a signature whose return type is present and a fully defined concrete type: it rejects a missing return type, and rejects ANY (or any other incomplete type) with ERROR_INPUT_INVALID.
    parameters:
      func:
        type: scalar_function_builder
        description: The scalar function to configure.
      sig:
        type: function_signature
        description: The signature to copy into the builder. Borrowed; the caller retains ownership.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: ERROR
  scalar_function_builder_set_property:
    description: |
      Sets a property on a scalar function.

      Configures a function property that influences planning and execution, such as stability (volatility), NULL handling, fallibility, or collation handling.
      The `value` must be one of the `FUNCTION_PROPERTY_VALUE` entries that matches `key`; passing a value that does not correspond to `key`, or a key that is not valid for scalar functions, results in an error.
    parameters:
      func:
        type: scalar_function_builder
        description: The scalar function to configure.
      key:
        type: FUNCTION_PROPERTY_KEY
        description: The property to set.
      value:
        type: FUNCTION_PROPERTY_VALUE
        description: The value to set for the property. Must be a value that matches `key`.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: ERROR
  scalar_function_builder_get_property:
    description: |
      Gets a property from a scalar function.

      Retrieves the current value of a function property previously set with `scalar_function_builder_set_property`, or its default if it was never set.
      Passing a key that is not valid for scalar functions results in an error.
    parameters:
      func:
        type: scalar_function_builder
        description: The scalar function to query.
      key:
        type: FUNCTION_PROPERTY_KEY
        description: The property to retrieve.
      out_value:
        type: FUNCTION_PROPERTY_VALUE
        indirection: 1
        kind: OUT
        description: On success, receives the current value of the property.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: ERROR
  # --- Bind callback accessors ---
  scalar_function_bind_get_function_name:
    description: Retrieves the name of the function being bound.
    parameters:
      info:
        type: scalar_function_bind_info
        description: The bind info handle.
      out_name:
        type: identifier
        indirection: 1
        kind: OUT
        description: Receives the function name. Borrowed; only valid for the duration of the callback.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: ERROR
  scalar_function_bind_get_user_data:
    description: Retrieves the user data set on the builder via scalar_function_builder_set_user_data.
    parameters:
      info:
        type: scalar_function_bind_info
        description: The bind info handle.
      out_data:
        type: void
        indirection: 2
        kind: OUT
        description: Receives the user data pointer, or null if none was set.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: ERROR
  scalar_function_bind_get_arguments:
    description: |
      Retrieves the bound argument list for inspection during bind.

      Returns a borrowed `bind_arguments` handle. Read it with the bind_arguments accessors: count, get an
      argument's type or slot name, or fold an argument to a value. Borrowed; valid only for the duration of
      the callback.
    parameters:
      info:
        type: scalar_function_bind_info
        description: The bind info handle.
      out_arguments:
        type: bind_arguments
        indirection: 1
        kind: OUT
        description: Receives the borrowed bound argument list handle.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: ERROR
  scalar_function_bind_set_bind_data:
    description: |
      Sets the function's bind data from the bind callback.

      Sets an opaque handle bundling a pointer to user data (the function's "bind data") plus optional
      destructor and equality callbacks. The bind data is accessible from later callbacks (init and exec).
      The destructor, if provided, destroys the bind data when it is no longer needed. The equality callback,
      if provided, compares two bind data pointers (e.g. for plan caching); otherwise a default pointer
      equality check is used.
    parameters:
      info:
        type: scalar_function_bind_info
        description: The bind info handle.
      data:
        type: opaque
        description: Opaque handle bundling the bind data pointer plus optional destructor and equality callbacks.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: ERROR
  scalar_function_bind_set_return_type:
    description: |
      Sets the function's return type from the bind callback.

      Overrides the return type resolved at registration for this call site. Register the function with a
      return type of ANY and set the concrete return type here, derived from the argument types (read via
      scalar_function_bind_get_arguments), to build a function whose result type depends on its input — for
      example a generic pass-through that returns whatever type it was given. The type is copied. Callable
      only during the bind callback.
    parameters:
      info:
        type: scalar_function_bind_info
        description: The bind info handle.
      type:
        type: logical_type
        description: The concrete return type for this call site.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: ERROR
  # --- Init callback accessors ---
  scalar_function_init_get_function_name:
    description: Retrieves the name of the function being initialized.
    parameters:
      info:
        type: scalar_function_init_info
        description: The init info handle.
      out_name:
        type: identifier
        indirection: 1
        kind: OUT
        description: Receives the function name. Borrowed; only valid for the duration of the callback.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: ERROR
  scalar_function_init_get_user_data:
    description: Retrieves the user data set on the builder via scalar_function_builder_set_user_data.
    parameters:
      info:
        type: scalar_function_init_info
        description: The init info handle.
      out_data:
        type: void
        indirection: 2
        kind: OUT
        description: Receives the user data pointer, or null if none was set.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: ERROR
  scalar_function_init_get_bind_data:
    description: Retrieves the bind data set by the function's bind callback.
    parameters:
      info:
        type: scalar_function_init_info
        description: The init info handle.
      out_data:
        type: void
        indirection: 2
        kind: OUT
        description: Receives the bind data pointer, or null if none was set.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: ERROR
  scalar_function_init_set_init_data:
    description: |
      Sets the function's worker-local init data from the init callback.

      Sets an opaque handle bundling a pointer to worker-local "init data" plus an optional destructor
      callback. The init data is associated with the executing worker thread for the duration of the query
      and accessible from the exec callback. The destructor, if provided, destroys the init data when it is no
      longer needed; the opaque handle's equality callback is unused for init data.
    parameters:
      info:
        type: scalar_function_init_info
        description: The init info handle.
      data:
        type: opaque
        description: Opaque handle bundling the init data pointer plus an optional destructor callback.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: ERROR
  # --- Exec callback accessors ---
  scalar_function_exec_get_function_name:
    description: Retrieves the name of the function being executed.
    parameters:
      info:
        type: scalar_function_exec_info
        description: The exec info handle.
      out_name:
        type: identifier
        indirection: 1
        kind: OUT
        description: Receives the function name. Borrowed; only valid for the duration of the callback.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: ERROR
  scalar_function_exec_get_user_data:
    description: Retrieves the user data set on the builder via scalar_function_builder_set_user_data.
    parameters:
      info:
        type: scalar_function_exec_info
        description: The exec info handle.
      out_data:
        type: void
        indirection: 2
        kind: OUT
        description: Receives the user data pointer, or null if none was set.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: ERROR
  scalar_function_exec_get_bind_data:
    description: Retrieves the bind data set by the function's bind callback.
    parameters:
      info:
        type: scalar_function_exec_info
        description: The exec info handle.
      out_data:
        type: void
        indirection: 2
        kind: OUT
        description: Receives the bind data pointer, or null if none was set.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: ERROR
  scalar_function_exec_get_init_data:
    description: Retrieves the worker-local init data set by the function's init callback.
    parameters:
      info:
        type: scalar_function_exec_info
        description: The exec info handle.
      out_data:
        type: void
        indirection: 2
        kind: OUT
        description: Receives the init data pointer for the executing worker thread, or null if none was set.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: ERROR
  scalar_function_exec_get_input:
    description: |
      Retrieves the input data chunk for the current invocation.

      The chunk contains one vector per argument passed to the function, with one row per input row for the current batch. Borrowed; valid only for the duration of the callback.
    parameters:
      info:
        type: scalar_function_exec_info
        description: The exec info handle.
      out_input:
        type: data_chunk
        indirection: 1
        kind: OUT
        description: Receives the borrowed input data chunk.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: ERROR
  scalar_function_exec_get_result:
    description: |
      Retrieves the result vector the callback must write into.

      The vector has space for the current batch's rows. Borrowed; valid only for the duration of the callback.
    parameters:
      info:
        type: scalar_function_exec_info
        description: The exec info handle.
      out_result:
        type: vector
        indirection: 1
        kind: OUT
        description: Receives the borrowed result vector to write into.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: ERROR
