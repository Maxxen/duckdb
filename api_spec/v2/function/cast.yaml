# yaml-language-server: $schema=https://cdn.jsdelivr.net/gh/duckdb/capigen@v0.4.0/src/capigen/schema/module.schema.json
module: cast
handles:
  cast_function_builder:
    description: "An opaque handle to a cast function builder. \nCreated with `cast_function_builder_create`, configured with the various `cast_function_builder_set_*` functions, and registered with `cast_function_builder_register`. \nThe builder is owned by the caller and must be destroyed with `cast_function_builder_destroy` when no longer needed.\n"
    cleanup_with: cast_function_builder_destroy
  cast_function_exec_info:
    description: |
      Borrowed handle passed to the exec callback. Provides access to the input vector, the output vector to
      fill, the number of rows to cast, the cast mode, and the user data set at registration. Valid only for
      the duration of the callback; must not be stored or used after the callback returns.
# Enums
enums:
  CAST_MODE:
    description: |
      The mode in which a cast is being executed. A "normal" cast must
      either succeed for every row or report an error (which aborts the
      query). A "try" cast (e.g. SQL TRY_CAST) tolerates per-row failures
      by writing NULL for the rows that could not be converted instead of
      aborting. The exec callback can read the mode via
      `cast_function_exec_get_mode` to decide whether a conversion failure
      is reported as an error or silently turned into a NULL.
    values:
      CAST_MODE_NORMAL:
        value: 0
        description: A regular cast. Any conversion failure is reported as an error via the error info handle.
      CAST_MODE_TRY:
        value: 1
        description: A "try" cast. Conversion failures are turned into NULL values in the output vector rather than reported as errors.
# Callbacks
callbacks:
  cast_function_exec_callback:
    return_type: void
    parameters:
      info:
        type: cast_function_exec_info
        description: "Borrowed handle providing access to the input vector, the output vector to fill, the number of rows to cast, the cast mode, and any user data set at registration time. \nThe library owns this handle and guarantees its validity only for the duration of the callback invocation; callees must not store or use it after the callback returns.\n"
      err:
        type: error_info
        indirection: 1
        description: "Error info handle, provided by DuckDB. \nCan be used to signal failure and report error details if the callback encounters a conversion error. \nOn success, leave `*err` unchanged. On failure, set an appropriate error code and message in `err` and return. For a `CAST_MODE_NORMAL` cast DuckDB will abort the query with the reported error; for a `CAST_MODE_TRY` cast the reported error is ignored and the rows the callback left NULL in the output vector are kept as NULL.\nThe error info handle is owned by DuckDB, is always valid when the callback is invoked, and must not be stored or destroyed by the callee.\n"
# Functions
functions:
  cast_function_builder_create:
    summary: Creates a new cast function builder.
    description: "Creates a new cast function builder that can be configured with the various `cast_function_builder_set_*` functions and registered with `cast_function_builder_register`. \nOn success, returns a handle to the new builder. The builder is owned by the caller and must be destroyed with `cast_function_builder_destroy` when no longer needed.\n"
    parameters:
      context:
        type: context
        description: The DuckDB context in which the cast function will be created.
      out:
        type: cast_function_builder
        indirection: 1
        kind: OUT
        description: On success, receives the newly created cast function builder. The caller owns the builder and must destroy it with `cast_function_builder_destroy`.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: API_CALL
  cast_function_builder_set_source_type:
    summary: Sets the source type of a cast function.
    description: "Sets the logical type the cast converts from. The library makes an internal copy of \nthe provided type and does not take ownership of it. Failing to set a source type \nbefore registration results in an error. The source type must be a fully defined \nconcrete type.\n"
    parameters:
      func:
        type: cast_function_builder
        description: The cast function to configure.
      type:
        type: logical_type
        description: The source type to cast from.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: API_CALL
  cast_function_builder_set_target_type:
    summary: Sets the target type of a cast function.
    description: "Sets the logical type the cast converts to. The library makes an internal copy of\nthe provided type and does not take ownership of it. Failing to set a target type \nbefore registration results in an error. The target type must be a fully defined \nconcrete type.\n"
    parameters:
      func:
        type: cast_function_builder
        description: The cast function to configure.
      type:
        type: logical_type
        description: The target type to cast to.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: API_CALL
  cast_function_builder_set_implicit_cast_cost:
    summary: Sets the implicit cast cost of a cast function.
    description: "Sets the \"cost\" of applying this cast implicitly. The binder uses this cost when it has to choose between \nmultiple candidate implicit casts: a lower (non-negative) cost ([0, ~20]) makes the cast more likely to \nbe chosen, a higher cost ([100, ...]) makes the cast less likely to be chosen. A negative cost (the default) \nmeans the cast is never applied implicitly and can only be  requested explicitly via CAST / TRY_CAST. This \nsetting is optional.\n"
    parameters:
      func:
        type: cast_function_builder
        description: The cast function to configure.
      cost:
        type: i64
        description: The implicit cast cost. A negative value (the default) disables implicit casting.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: API_CALL
  cast_function_builder_set_exec_callback:
    summary: Sets the exec callback for a cast function.
    description: "The \"exec\" callback is invoked during query execution to convert each batch of input values into the target type. \nThis is the main callback that implements the logic of the cast. \nFailing to set an \"exec\" callback before registration results in an error.\n"
    parameters:
      func:
        type: cast_function_builder
        description: The cast function to configure.
      callback:
        type: cast_function_exec_callback
        description: The "exec" callback to set for the function. This is the callback that will be invoked to perform the cast for each batch of input rows during query execution.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: API_CALL
  cast_function_builder_set_user_data:
    summary: Sets arbitrary extra data on a cast function.
    description: "This function allows the caller to associate an opaque pointer to arbitrary user data with a cast function. \nThis is useful for associating custom metadata or static context with the function that can be retrieved later from the exec callback via `cast_function_exec_get_user_data`. During execution, this data is read-only.\n"
    parameters:
      func:
        type: cast_function_builder
        description: The cast function to configure.
      data:
        type: opaque
        description: Opaque pointer to user data.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: API_CALL
  cast_function_builder_register:
    summary: Registers a cast function on a database via the current context, making the cast available in all subsequent queries to that database.
    description: "This function registers a fully configured cast function builder with a database, making the cast available for use in SQL queries (and for implicit casting, depending on the implicit cast cost). \nThe function builder must have its source type, target type, and exec callback set before registration; otherwise, registration will fail with an error.\nDuckDB makes an internal copy of the configured function and its properties during registration, so the caller retains ownership of the builder and can safely destroy or modify it after registration without affecting the registered cast.\n"
    parameters:
      context:
        type: context
        description: The DuckDB context in which to register the cast function.
      func:
        type: cast_function_builder
        description: The cast function to register.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: API_CALL
  cast_function_builder_destroy:
    summary: Destroys a cast function builder, releasing its resources.
    description: "This function destroys a cast function builder that was created with `cast_function_builder_create`, releasing any resources associated with it. \nIf the builder has already been registered with a database, destroying it does not affect the registered cast in the database, as DuckDB makes an internal copy of the function during registration. \nThis function is null-safe: calling it with a null pointer is a no-op and returns ERROR_NONE.\nThe handle is set to null on return to prevent double-destruction.\n"
    parameters:
      func:
        type: cast_function_builder
        indirection: 1
        description: The cast function to destroy.
    return_type: API_CALL
  # --- Exec callback accessors ---
  cast_function_exec_get_user_data:
    summary: Retrieves the user data set on the builder via cast_function_builder_set_user_data.
    parameters:
      info:
        type: cast_function_exec_info
        description: The exec info handle.
      out_data:
        type: void
        indirection: 2
        kind: OUT
        description: Receives the user data pointer, or null if none was set.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: API_CALL
  cast_function_exec_get_input:
    summary: Retrieves the input vector containing the source values to cast.
    description: The vector contains `count` logical rows. Borrowed; valid only for the duration of the callback.
    parameters:
      info:
        type: cast_function_exec_info
        description: The exec info handle.
      out_input:
        type: vector
        indirection: 1
        kind: OUT
        description: Receives the borrowed input vector.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: API_CALL
  cast_function_exec_get_output:
    summary: Retrieves the output vector the callback must write the cast result values into.
    description: The vector has space for `count` logical rows. Borrowed; valid only for the duration of the callback.
    parameters:
      info:
        type: cast_function_exec_info
        description: The exec info handle.
      out_output:
        type: vector
        indirection: 1
        kind: OUT
        description: Receives the borrowed output vector to write into.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: API_CALL
  cast_function_exec_get_count:
    summary: Retrieves the number of rows to cast.
    description: The number of logical rows in both the input and output vectors.
    parameters:
      info:
        type: cast_function_exec_info
        description: The exec info handle.
      out_count:
        type: idx
        indirection: 1
        kind: OUT
        description: Receives the row count.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: API_CALL
  cast_function_exec_get_mode:
    summary: Retrieves the mode the cast is being executed in.
    description: |
      See `CAST_MODE`. In `CAST_MODE_TRY`, conversion failures should be written as NULL values into the
      output vector instead of being reported as errors.
    parameters:
      info:
        type: cast_function_exec_info
        description: The exec info handle.
      out_mode:
        type: CAST_MODE
        indirection: 1
        kind: OUT
        description: Receives the cast mode.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: API_CALL
