  aggregate_function_combine_get_targets:
    description: |
      Retrieves the array of destination aggregate states.

      An array of pointers, one per state, each pointing to a destination aggregate state that should be updated with the combined results from the source states.
    parameters:
      info:
        type: aggregate_function_combine_info
        description: The combine info handle.
      out_targets:
