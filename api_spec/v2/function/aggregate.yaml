  aggregate_function_finalize_get_result:
    description: |
      Retrieves the result vector the callback must write into.

      The callback writes its finalized result values into this vector, starting at the result offset. Borrowed; valid only for the duration of the callback.
    parameters:
      info:
        type: aggregate_function_finalize_info
        description: The finalize info handle.
      out_result:
