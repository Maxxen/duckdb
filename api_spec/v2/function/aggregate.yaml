module: aggregate
handles:
  aggregate_function_builder:
    description: "An opaque handle representing a builder for defining and registering a custom aggregate function in DuckDB. The builder allows you to specify the function's name, argument types, return type, and implementation callbacks. After configuring the builder, you can register the function with DuckDB to make it available for use in SQL queries."
    cleanup_with: aggregate_function_builder_destroy
  aggregate_function_bind_info:
    description: |
      Borrowed handle passed to the bind callback. Provides access to the function name, user data set at
      registration, and the bound argument list, and is used to set the function's bind data. Valid only for
      the duration of the callback; must not be stored or used after the callback returns.
  aggregate_function_size_info:
    description: |
      Borrowed handle passed to the size callback. Provides access to the user data set at registration, and is
      used to set the aggregate state size for a single row. Valid only for the duration of the callback; must
      not be stored or used after the callback returns.
  aggregate_function_init_info:
    description: |
      Borrowed handle passed to the init callback. Provides access to the user data set at registration and the
      aggregate state to initialize for a single row. Valid only for the duration of the callback; must not be
      stored or used after the callback returns.
  aggregate_function_update_info:
    description: |
      Borrowed handle passed to the update callback. Provides access to the user data, the bind data, the input
      data chunk, the row count, and the array of aggregate states to update. Valid only for the duration of the
      callback; must not be stored or used after the callback returns.
  aggregate_function_combine_info:
    description: |
      Borrowed handle passed to the combine callback. Provides access to the user data, the bind data, the state
      count, and the source and target aggregate state arrays to combine. Valid only for the duration of the
      callback; must not be stored or used after the callback returns.
  aggregate_function_finalize_info:
    description: |
      Borrowed handle passed to the finalize callback. Provides access to the user data, the bind data, the row
      count, the array of aggregate states, and the result vector and offset to write into. Valid only for the
      duration of the callback; must not be stored or used after the callback returns.
  aggregate_function_destroy_info:
    description: |
      Borrowed handle passed to the destroy callback. Provides access to the user data, the bind data, the state
      count, and the array of aggregate states to destroy. Valid only for the duration of the callback; must not
      be stored or used after the callback returns.
callbacks:
  aggregate_function_bind_callback:
    return_type: void
    parameters:
      info:
        type: aggregate_function_bind_info
        description: "Borrowed handle providing access to the function being bound and user data, and used to set bind data via `aggregate_function_bind_set_bind_data`. The library owns this handle and guarantees its validity only for the duration of the callback invocation; callees must not store or use it after the callback returns."
      context:
        type: context
        description: "The DuckDB context in which the function is being bound. Borrowed; only valid for the duration of the callback."
      err:
        type: error_info
        indirection: 1
        description: Error info handle to write details to if the call fails.
  aggregate_function_size_callback:
    return_type: void
    parameters:
      info:
        type: aggregate_function_size_info
        description: "Borrowed handle providing access to user data, and used to set the aggregate state size via `aggregate_function_size_set_size`. The library owns this handle and guarantees its validity only for the duration of the callback invocation; callees must not store or use it after the callback returns."
      err:
        type: error_info
        indirection: 1
        description: Error info handle to write details to if the call fails.
  aggregate_function_init_callback:
    return_type: void
    parameters:
      info:
        type: aggregate_function_init_info
        description: "Borrowed handle providing access to user data and the aggregate state to initialize. The library owns this handle and guarantees its validity only for the duration of the callback invocation; callees must not store or use it after the callback returns."
      err:
        type: error_info
        indirection: 1
        description: Error info handle to write details to if the call fails.
  aggregate_function_update_callback:
    return_type: void
    parameters:
      info:
        type: aggregate_function_update_info
        description: "Borrowed handle providing access to user data, bind data, the input data chunk, the row count, and the aggregate states to update. The library owns this handle and guarantees its validity only for the duration of the callback invocation; callees must not store or use it after the callback returns."
      err:
        type: error_info
        indirection: 1
        description: Error info handle to write details to if the call fails.
  aggregate_function_combine_callback:
    return_type: void
    parameters:
      info:
        type: aggregate_function_combine_info
        description: "Borrowed handle providing access to user data, bind data, the state count, and the source and target aggregate state arrays to combine. The library owns this handle and guarantees its validity only for the duration of the callback invocation; callees must not store or use it after the callback returns."
      err:
        type: error_info
        indirection: 1
        description: Error info handle to write details to if the call fails.
  aggregate_function_finalize_callback:
    return_type: void
    parameters:
      info:
        type: aggregate_function_finalize_info
        description: "Borrowed handle providing access to user data, bind data, the row count, the aggregate states, and the result vector and offset to write into. The library owns this handle and guarantees its validity only for the duration of the callback invocation; callees must not store or use it after the callback returns."
      err:
        type: error_info
        indirection: 1
        description: Error info handle to write details to if the call fails.
  aggregate_function_destroy_callback:
    return_type: void
    parameters:
      info:
        type: aggregate_function_destroy_info
        description: "Borrowed handle providing access to user data, bind data, the state count, and the aggregate states to destroy. The library owns this handle and guarantees its validity only for the duration of the callback invocation; callees must not store or use it after the callback returns."
      err:
        type: error_info
        indirection: 1
        description: Error info handle to write details to if the call fails.
functions:
  # Builder Functions
  aggregate_function_builder_create:
    description: |
      Creates a new aggregate function builder that can be used to define and register a custom aggregate function in DuckDB. The builder allows you to specify the function's name, argument types, return type, and implementation callbacks.
    parameters:
      out:
        type: aggregate_function_builder
        indirection: 1
        kind: OUT
        description: On success, receives the newly created aggregate function builder. The caller owns the builder and must destroy it with `aggregate_function_builder_destroy`.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: ERROR
  aggregate_function_builder_destroy:
    description: |
      Destroys an aggregate function builder that was created with `aggregate_function_builder_create`. This should be called to free resources associated with the builder when it is no longer needed.
    parameters:
      builder:
        type: aggregate_function_builder
        indirection: 1
        description: The aggregate function builder to destroy. After this call, the builder handle is invalid and should not be used.
    return_type: ERROR
  aggregate_function_builder_set_name:
    description: |
      Sets the name of the aggregate function being built

      Sets the name of the aggregate function being defined by the builder. This is the name that will be used to call the function in SQL queries.
    parameters:
      builder:
        type: aggregate_function_builder
        description: The aggregate function builder for which to set the name.
      name:
        type: identifier
        description: The name to set for the function.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: ERROR
  aggregate_function_builder_set_signature:
    description: |
      Sets the signature of an aggregate function.

      Copies a function signature into the builder: the fixed parameters (names, types, defaults), the optional variadic tail, and the return type.
      The signature is borrowed and copied; the caller destroys it independently. Calling this again replaces the previous signature.
      Registration requires a signature whose return type is present and a fully defined concrete type: it rejects a missing return type, and rejects ANY (or any other incomplete type) with ERROR_INPUT_INVALID.
    parameters:
      func:
        type: aggregate_function_builder
        description: The aggregate function to configure.
      sig:
        type: function_signature
        description: The signature to copy into the builder. Borrowed; the caller retains ownership.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: ERROR
  aggregate_function_builder_set_property:
    description: |
      Sets a property on an aggregate function.

      Configures a function property that influences planning and execution. In addition to the shared base properties (stability, NULL handling, fallibility, collation handling), aggregate functions also accept the aggregate-specific keys (order dependence, distinct dependence).
      The `value` must be one of the `FUNCTION_PROPERTY_VALUE` entries that matches `key`; passing a value that does not correspond to `key`, or a key that is not valid for aggregate functions, results in an error.
    parameters:
      func:
        type: aggregate_function_builder
        description: The aggregate function to configure.
      key:
        type: FUNCTION_PROPERTY_KEY
        description: The property to set.
      value:
        type: FUNCTION_PROPERTY_VALUE
        description: The value to set for the property. Must be a value that matches `key`.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: ERROR
  aggregate_function_builder_get_property:
    description: |
      Gets a property from an aggregate function.

      Retrieves the current value of a function property previously set with `aggregate_function_builder_set_property`, or its default if it was never set.
      Passing a key that is not valid for aggregate functions results in an error.
    parameters:
      func:
        type: aggregate_function_builder
        description: The aggregate function to query.
      key:
        type: FUNCTION_PROPERTY_KEY
        description: The property to retrieve.
      out_value:
        type: FUNCTION_PROPERTY_VALUE
        indirection: 1
        kind: OUT
        description: On success, receives the current value of the property.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: ERROR
  aggregate_function_builder_set_bind_callback:
    description: |
      Sets the bind callback for the aggregate function being built

      The "bind" callback is invoked once during query planning. It can set bind data via `out_bind_data`, which is then passed to the update, combine, finalize, and destroy callbacks. This is useful for sharing information computed during binding (e.g. resolved argument types or configuration) with execution. The bind callback is optional; if not set, no bind data is associated with the function. Note that bind data is not available to the size and init callbacks.
    parameters:
      builder:
        type: aggregate_function_builder
        description: The aggregate function builder for which to set the bind callback.
      callback:
        type: aggregate_function_bind_callback
        description: The bind callback function to set for the aggregate function.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: ERROR
  aggregate_function_builder_set_size_callback:
    description: |
      Sets the size callback for the aggregate function being built

      Sets the size callback for the aggregate function being defined by the builder. The size callback is used by DuckDB to determine how much memory to allocate for each aggregate state.
    parameters:
      builder:
        type: aggregate_function_builder
        description: The aggregate function builder for which to set the size callback.
      callback:
        type: aggregate_function_size_callback
        description: The size callback function to set for the aggregate function.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: ERROR
  aggregate_function_builder_set_init_callback:
    description: |
      Sets the init callback for the aggregate function being built

      Sets the init callback for the aggregate function being defined by the builder. The init callback is called by DuckDB to initialize the aggregate state for a single state before any updates are applied.
    parameters:
      builder:
        type: aggregate_function_builder
        description: The aggregate function builder for which to set the init callback.
      callback:
        type: aggregate_function_init_callback
        description: The init callback function to set for the aggregate function.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: ERROR
  aggregate_function_builder_set_update_callback:
    description: |
      Sets the update callback for the aggregate function being built

      Sets the update callback for the aggregate function being defined by the builder. The update callback is called by DuckDB to apply a batch of input rows to a batch of aggregate states.
    parameters:
      builder:
        type: aggregate_function_builder
        description: The aggregate function builder for which to set the update callback.
      callback:
        type: aggregate_function_update_callback
        description: The update callback function to set for the aggregate function.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: ERROR
  aggregate_function_builder_set_combine_callback:
    description: |
      Sets the combine callback for the aggregate function being built

      Sets the combine callback for the aggregate function being defined by the builder. The combine callback is called by DuckDB to combine batches of source aggregate states into batches of destination aggregate states, such as when merging partial aggregates in a parallel execution.
    parameters:
      builder:
        type: aggregate_function_builder
        description: The aggregate function builder for which to set the combine callback.
      callback:
        type: aggregate_function_combine_callback
        description: The combine callback function to set for the aggregate function.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: ERROR
  aggregate_function_builder_set_finalize_callback:
    description: |
      Sets the finalize callback for the aggregate function being built

      Sets the finalize callback for the aggregate function being defined by the builder. The finalize callback is called by DuckDB to finalize a batch of aggregate states into a batch of result values, such as when producing the final output of an aggregate function.
    parameters:
      builder:
        type: aggregate_function_builder
        description: The aggregate function builder for which to set the finalize callback.
      callback:
        type: aggregate_function_finalize_callback
        description: The finalize callback function to set for the aggregate function.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: ERROR
  aggregate_function_builder_set_destroy_callback:
    description: |
      Sets the destroy callback for the aggregate function being built

      Sets the destroy callback for the aggregate function being defined by the builder. The destroy callback is called by DuckDB to destroy a batch of aggregate states and free their resources, such as when cleaning up after an aggregate function has finished processing.
    parameters:
      builder:
        type: aggregate_function_builder
        description: The aggregate function builder for which to set the destroy callback.
      callback:
        type: aggregate_function_destroy_callback
        description: The destroy callback function to set for the aggregate function.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: ERROR
  aggregate_function_builder_set_user_data:
    description: |
      Sets user data for the aggregate function being built

      Sets a user data pointer for the aggregate function being defined by the builder. This pointer is passed to all of the function's callbacks and can be used to store context or state needed by the callbacks.
    parameters:
      builder:
        type: aggregate_function_builder
        description: The aggregate function builder for which to set the user data.
      data:
        type: opaque
        description: The user data pointer to set for the aggregate function. This pointer is passed to all of the function's callbacks and can be used to store context or state needed by the callbacks.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: ERROR
  aggregate_function_builder_register_with_connection:
    description: |
      Registers the aggregate function being built on a connection

      Registers the aggregate function defined by the builder with the connection's database, making it available for use in SQL queries. The registration runs in its own transaction on the connection's context.
      Registered functions do not support plan serialization; the bind callback runs once per binding of a call site.
    parameters:
      conn:
        type: connection
        description: The connection whose database to register the function on.
      builder:
        type: aggregate_function_builder
        description: The aggregate function builder to register.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: ERROR
  aggregate_function_builder_register_with_extension:
    description: |
      Registers the aggregate function being built on the extension being loaded

      Registers the aggregate function defined by the builder with the loading extension's database, making it available for use in SQL queries. Use this from an extension-load callback, where an extension handle is in hand; the entry is attributed to the extension and installed on the database's system transaction.
      Registered functions do not support plan serialization; the bind callback runs once per binding of a call site.
    parameters:
      extension:
        type: extension
        description: The extension being loaded, on which to register the function.
      builder:
        type: aggregate_function_builder
        description: The aggregate function builder to register.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: ERROR
  # --- Bind callback accessors ---
  aggregate_function_bind_get_function_name:
    description: Retrieves the name of the function being bound.
    parameters:
      info:
        type: aggregate_function_bind_info
        description: The bind info handle.
      out_name:
        type: identifier
        indirection: 1
        kind: OUT
        description: Receives the function name. Borrowed; only valid for the duration of the callback.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: ERROR
  aggregate_function_bind_get_user_data:
    description: Retrieves the user data set on the builder via aggregate_function_builder_set_user_data.
    parameters:
      info:
        type: aggregate_function_bind_info
        description: The bind info handle.
      out_data:
        type: void
        indirection: 2
        kind: OUT
        description: Receives the user data pointer, or null if none was set.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: ERROR
  aggregate_function_bind_get_arguments:
    description: |
      Retrieves the bound argument list for inspection during bind.

      Returns a borrowed `bind_arguments` handle. Read it with the bind_arguments accessors: count, get an
      argument's type or slot name, or fold an argument to a value. Borrowed; valid only for the duration of
      the callback.
    parameters:
      info:
        type: aggregate_function_bind_info
        description: The bind info handle.
      out_arguments:
        type: bind_arguments
        indirection: 1
        kind: OUT
        description: Receives the borrowed bound argument list handle.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: ERROR
  aggregate_function_bind_set_bind_data:
    description: |
      Sets the function's bind data from the bind callback.

      Sets an opaque handle bundling a pointer to the aggregate's "bind data" plus optional destructor and
      equality callbacks. The bind data is accessible from the update, combine, finalize, and destroy callbacks.
      The destructor, if provided, destroys the bind data when it is no longer needed. The equality callback, if
      provided, compares two bind data pointers (e.g. for plan caching); otherwise a default pointer equality
      check is used.
    parameters:
      info:
        type: aggregate_function_bind_info
        description: The bind info handle.
      data:
        type: opaque
        description: Opaque handle bundling the bind data pointer plus optional destructor and equality callbacks.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: ERROR
  # --- Size callback accessors ---
  aggregate_function_size_get_user_data:
    description: Retrieves the user data set on the builder via aggregate_function_builder_set_user_data.
    parameters:
      info:
        type: aggregate_function_size_info
        description: The size info handle.
      out_data:
        type: void
        indirection: 2
        kind: OUT
        description: Receives the user data pointer, or null if none was set.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: ERROR
  aggregate_function_size_set_size:
    description: |
      Sets the size of the aggregate state for a single row, in bytes.

      The callback must set the required per-row aggregate state size, which DuckDB uses to allocate state memory.
    parameters:
      info:
        type: aggregate_function_size_info
        description: The size info handle.
      size:
        type: idx
        description: The size of the aggregate state for a single row, in bytes.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: ERROR
  # --- Init callback accessors ---
  aggregate_function_init_get_user_data:
    description: Retrieves the user data set on the builder via aggregate_function_builder_set_user_data.
    parameters:
      info:
        type: aggregate_function_init_info
        description: The init info handle.
      out_data:
        type: void
        indirection: 2
        kind: OUT
        description: Receives the user data pointer, or null if none was set.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: ERROR
  aggregate_function_init_get_state:
    description: |
      Retrieves the aggregate state to initialize for a single row.

      The memory for this state is allocated by DuckDB based on the size returned by the size callback and is zero-initialized. The callback should initialize it in place.
    parameters:
      info:
        type: aggregate_function_init_info
        description: The init info handle.
      out_state:
        type: void
        indirection: 2
        kind: OUT
        description: Receives the pointer to the aggregate state to initialize.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: ERROR
  # --- Update callback accessors ---
  aggregate_function_update_get_user_data:
    description: Retrieves the user data set on the builder via aggregate_function_builder_set_user_data.
    parameters:
      info:
        type: aggregate_function_update_info
        description: The update info handle.
      out_data:
        type: void
        indirection: 2
        kind: OUT
        description: Receives the user data pointer, or null if none was set.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: ERROR
  aggregate_function_update_get_bind_data:
    description: Retrieves the bind data set by the function's bind callback.
    parameters:
      info:
        type: aggregate_function_update_info
        description: The update info handle.
      out_data:
        type: void
        indirection: 2
        kind: OUT
        description: Receives the bind data pointer, or null if none was set.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: ERROR
  aggregate_function_update_get_count:
    description: |
      Retrieves the number of rows in the current batch being processed.

      This is the size of the input data chunk and the number of aggregate states.
    parameters:
      info:
        type: aggregate_function_update_info
        description: The update info handle.
      out_count:
        type: idx
        indirection: 1
        kind: OUT
        description: Receives the number of rows in the current batch.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: ERROR
  aggregate_function_update_get_input:
    description: |
      Retrieves the input data chunk for the current batch of rows.

      The chunk contains one vector per argument passed to the aggregate function, with one row per input row for the current batch. Borrowed; valid only for the duration of the callback.
    parameters:
      info:
        type: aggregate_function_update_info
        description: The update info handle.
      out_input:
        type: data_chunk
        indirection: 1
        kind: OUT
        description: Receives the borrowed input data chunk.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: ERROR
  aggregate_function_update_get_states:
    description: |
      Retrieves the array of aggregate states to update for the current batch.

      An array of pointers, one per row, each pointing to the aggregate state for that row. The callback applies updates to these states based on the input data.
    parameters:
      info:
        type: aggregate_function_update_info
        description: The update info handle.
      out_states:
        type: void
        indirection: 3
        kind: OUT
        description: Receives the array of aggregate state pointers.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: ERROR
  # --- Combine callback accessors ---
  aggregate_function_combine_get_user_data:
    description: Retrieves the user data set on the builder via aggregate_function_builder_set_user_data.
    parameters:
      info:
        type: aggregate_function_combine_info
        description: The combine info handle.
      out_data:
        type: void
        indirection: 2
        kind: OUT
        description: Receives the user data pointer, or null if none was set.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: ERROR
  aggregate_function_combine_get_bind_data:
    description: Retrieves the bind data set by the function's bind callback.
    parameters:
      info:
        type: aggregate_function_combine_info
        description: The combine info handle.
      out_data:
        type: void
        indirection: 2
        kind: OUT
        description: Receives the bind data pointer, or null if none was set.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: ERROR
  aggregate_function_combine_get_count:
    description: |
      Retrieves the number of source and target states to combine.

      This is the size of the sources and targets arrays.
    parameters:
      info:
        type: aggregate_function_combine_info
        description: The combine info handle.
      out_count:
        type: idx
        indirection: 1
        kind: OUT
        description: Receives the number of states to combine.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: ERROR
  aggregate_function_combine_get_sources:
    description: |
      Retrieves the array of source aggregate states to combine.

      An array of pointers, one per state, each pointing to a source aggregate state that should be combined into the corresponding target state.
    parameters:
      info:
        type: aggregate_function_combine_info
        description: The combine info handle.
      out_sources:
        type: void
        indirection: 3
        kind: OUT
        description: Receives the array of source aggregate state pointers.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
