module: copy
handles:
  copy_function_builder:
    description: "An opaque handle to a copy function builder. This is used to build a copy function, which can be used to copy data from one source to another."
    cleanup_with: copy_function_builder_cleanup
  copy_function_bind_info:
    description: |
      Borrowed handle passed to the bind callback. Provides access to the user data set at registration and the list
      of columns being copied (their count, types, and names), and is used to set the function's bind data. Valid only
      for the duration of the callback; must not be stored or used after the callback returns.
  copy_function_init_info:
    description: |
      Borrowed handle passed to the init callback. Provides access to the user data set at registration, the bind data
      set during bind, and the target file path, and is used to set the function's global init data. Valid only for the
      duration of the callback; must not be stored or used after the callback returns.
  copy_function_batch_info:
    description: |
      Borrowed handle passed to the batch callback. Provides access to the user data, bind data, and global init data,
      and the input column data collection to prepare, and is used to set the prepared batch data handed to the flush
      callback. Valid only for the duration of the callback; must not be stored or used after the callback returns.
  copy_function_flush_info:
    description: |
      Borrowed handle passed to the flush callback. Provides access to the user data, bind data, global init data, and
      the prepared batch data produced by the batch callback. Valid only for the duration of the callback; must not be
      stored or used after the callback returns.
  copy_function_finalize_info:
    description: |
      Borrowed handle passed to the finalize callback. Provides access to the user data, bind data, and global init
      data. Valid only for the duration of the callback; must not be stored or used after the callback returns.
callbacks:
  copy_function_bind_callback:
    return_type: void
    parameters:
      info:
        type: copy_function_bind_info
        description: "Borrowed handle providing access to the columns being copied and user data, and used to set bind data via `copy_function_bind_set_bind_data`. \nThe library owns this handle and guarantees its validity only for the duration of the callback invocation; callees must not store or use it after the callback returns.\n"
      context:
        type: context
        description: "The DuckDB context in which the copy operation runs. Borrowed; only valid for the duration of the callback."
      err:
        type: error_info
        indirection: 1
        description: "Error info handle, provided by DuckDB. \nCan be used to signal failure and report error details if the callback encounters an error. \nOn success, leave `*err` unchanged. On failure, set an appropriate error code and message in `err` and return. DuckDB will inspect the error info after the callback returns to determine whether the call succeeded or failed.\nThe error info handle is owned by DuckDB, is always valid when the callback is invoked, and must not be stored or destroyed by the callee.\n"
  copy_function_init_callback:
    return_type: void
    parameters:
      info:
        type: copy_function_init_info
        description: "Borrowed handle providing access to the target file path, bind data, and user data, and used to set global init data via `copy_function_init_set_init_data`. \nThe library owns this handle and guarantees its validity only for the duration of the callback invocation; callees must not store or use it after the callback returns.\n"
      context:
        type: context
        description: "The DuckDB context in which the copy operation runs. Borrowed; only valid for the duration of the callback."
      err:
        type: error_info
        indirection: 1
        description: "Error info handle, provided by DuckDB. \nCan be used to signal failure and report error details if the callback encounters an error. \nOn success, leave `*err` unchanged. On failure, set an appropriate error code and message in `err` and return. DuckDB will inspect the error info after the callback returns to determine whether the call succeeded or failed.\nThe error info handle is owned by DuckDB, is always valid when the callback is invoked, and must not be stored or destroyed by the callee.\n"
  copy_function_batch_callback:
    return_type: void
    parameters:
      info:
        type: copy_function_batch_info
        description: "Borrowed handle providing access to the input column data collection to prepare, plus bind data, init data, and user data, and used to set the prepared batch data via `copy_function_batch_set_batch_data`. \nThe library owns this handle and guarantees its validity only for the duration of the callback invocation; callees must not store or use it after the callback returns.\n"
      context:
        type: context
        description: "The DuckDB context in which the copy operation runs. Borrowed; only valid for the duration of the callback."
      err:
        type: error_info
        indirection: 1
        description: "Error info handle, provided by DuckDB. \nCan be used to signal failure and report error details if the callback encounters an error. \nOn success, leave `*err` unchanged. On failure, set an appropriate error code and message in `err` and return. DuckDB will inspect the error info after the callback returns to determine whether the call succeeded or failed.\nThe error info handle is owned by DuckDB, is always valid when the callback is invoked, and must not be stored or destroyed by the callee.\n"
  copy_function_flush_callback:
    return_type: void
    parameters:
      info:
        type: copy_function_flush_info
        description: "Borrowed handle providing access to the prepared batch data produced by the batch callback, plus bind data, init data, and user data. \nThe library owns this handle and guarantees its validity only for the duration of the callback invocation; callees must not store or use it after the callback returns.\n"
      context:
        type: context
        description: "The DuckDB context in which the copy operation runs. Borrowed; only valid for the duration of the callback."
      err:
        type: error_info
        indirection: 1
        description: "Error info handle, provided by DuckDB. \nCan be used to signal failure and report error details if the callback encounters an error. \nOn success, leave `*err` unchanged. On failure, set an appropriate error code and message in `err` and return. DuckDB will inspect the error info after the callback returns to determine whether the call succeeded or failed.\nThe error info handle is owned by DuckDB, is always valid when the callback is invoked, and must not be stored or destroyed by the callee.\n"
  copy_function_finalize_callback:
    return_type: void
    parameters:
      info:
        type: copy_function_finalize_info
        description: "Borrowed handle providing access to the bind data, init data, and user data. \nThe library owns this handle and guarantees its validity only for the duration of the callback invocation; callees must not store or use it after the callback returns.\n"
      context:
        type: context
        description: "The DuckDB context in which the copy operation runs. Borrowed; only valid for the duration of the callback."
      err:
        type: error_info
        indirection: 1
        description: "Error info handle, provided by DuckDB. \nCan be used to signal failure and report error details if the callback encounters an error. \nOn success, leave `*err` unchanged. On failure, set an appropriate error code and message in `err` and return. DuckDB will inspect the error info after the callback returns to determine whether the call succeeded or failed.\nThe error info handle is owned by DuckDB, is always valid when the callback is invoked, and must not be stored or destroyed by the callee.\n"
functions:
  copy_function_builder_create:
    summary: "Creates a new copy function."
    parameters:
      context:
        type: context
        description: "The DuckDB context in which the function will be created"
      out:
        type: copy_function_builder
        indirection: 1
        description: "Output parameter that will hold the created copy function builder handle."
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: API_CALL
  copy_function_builder_set_name:
    summary: "Sets the name of the copy function. This is the name that will be used to invoke the function in SQL."
    parameters:
      builder:
        type: copy_function_builder
        description: "The copy function builder handle."
      name:
        type: identifier
        description: "The name of the copy function."
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: API_CALL
  copy_function_builder_set_bind_callback:
    summary: "Sets the bind callback for the copy function. The bind callback is responsible for binding the function to a specific set of arguments and return type. It is called during query planning when the function is invoked in SQL."
    parameters:
      builder:
        type: copy_function_builder
        description: "The copy function builder handle."
      callback:
        type: copy_function_bind_callback
        description: "The bind callback function pointer."
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: API_CALL
  copy_function_builder_set_init_callback:
    summary: "Sets the init callback for the copy function. The init callback is responsible for initializing any state or resources needed to execute the function. It is called during query execution when the function is invoked in SQL, before any batches are processed."
    parameters:
      builder:
        type: copy_function_builder
        description: "The copy function builder handle."
      callback:
        type: copy_function_init_callback
        description: "The init callback function pointer."
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: API_CALL
  copy_function_builder_set_batch_callback:
    summary: "Sets the batch callback for the copy function. The batch callback is responsible for processing a batch of data. It is called during query execution when the function is invoked in SQL."
    parameters:
      builder:
        type: copy_function_builder
        description: "The copy function builder handle."
      callback:
        type: copy_function_batch_callback
        description: "The batch callback function pointer."
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: API_CALL
  copy_function_builder_set_flush_callback:
    summary: "Sets the flush callback for the copy function. The flush callback is responsible for flushing a processed batch of data to the output."
    parameters:
      builder:
        type: copy_function_builder
        description: "The copy function builder handle."
      callback:
        type: copy_function_flush_callback
        description: "The flush callback function pointer."
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: API_CALL
  copy_function_builder_set_finalize_callback:
    summary: "Sets the finalize callback for the copy function. The finalize callback is responsible for finalizing the output (for example flushing and closing the underlying file) after all batches have been flushed. It is called once per output file at the end of query execution."
    parameters:
      builder:
        type: copy_function_builder
        description: "The copy function builder handle."
      callback:
        type: copy_function_finalize_callback
        description: "The finalize callback function pointer."
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: API_CALL
  copy_function_builder_set_user_data:
    summary: "Sets the user data for the copy function. The user data is a pointer that will be passed to the callbacks when they are invoked. This can be used to store any state or context that the callbacks need to operate."
    parameters:
      builder:
        type: copy_function_builder
        description: "The copy function builder handle."
      data:
        type: opaque
        description: Opaque pointer to user data.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: API_CALL
  copy_function_builder_register:
    summary: "Registers the copy function with a database, making the function available for use in SQL queries."
    parameters:
      context:
        type: context
        description: "The DuckDB context in which to register the function."
      builder:
        type: copy_function_builder
        description: "The copy function builder handle."
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: API_CALL
  copy_function_builder_destroy:
    summary: "Destroys a copy function builder handle, freeing any associated resources. After this call, the handle is no longer valid and should not be used."
    parameters:
      builder:
        type: copy_function_builder
        indirection: 1
        description: "The copy function builder handle to destroy."
    return_type: API_CALL
  # --- Bind callback accessors ---
  copy_function_bind_get_user_data:
    summary: Retrieves the user data set on the builder via copy_function_builder_set_user_data.
    parameters:
      info:
        type: copy_function_bind_info
        description: The bind info handle.
      out_data:
        type: void
        indirection: 2
        kind: OUT
        description: Receives the user data pointer, or null if none was set.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: API_CALL
  copy_function_bind_get_column_count:
    summary: Retrieves the number of columns being copied.
    parameters:
      info:
        type: copy_function_bind_info
        description: The bind info handle.
      out_count:
        type: idx
        indirection: 1
        kind: OUT
        description: Receives the number of columns being copied.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: API_CALL
  copy_function_bind_get_column_type:
    summary: Retrieves the type of the column at the given index.
    parameters:
      info:
        type: copy_function_bind_info
        description: The bind info handle.
      index:
        type: idx
        description: Zero-based column index.
      out_type:
        type: logical_type
        indirection: 1
        kind: OUT
        description: Receives the column's type. Borrowed; only valid for the duration of the callback.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: API_CALL
  copy_function_bind_get_column_name:
    summary: Retrieves the name of the column at the given index.
    parameters:
      info:
        type: copy_function_bind_info
        description: The bind info handle.
      index:
        type: idx
        description: Zero-based column index.
      out_name:
        type: identifier
        indirection: 1
        kind: OUT
        description: Receives the column's name. Borrowed; only valid for the duration of the callback.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: API_CALL
  copy_function_bind_set_bind_data:
    summary: Sets the function's bind data from the bind callback.
    description: |
      Sets an opaque handle bundling a pointer to user data (the function's "bind data") plus optional
      destructor and equality callbacks. The bind data is accessible from later callbacks (init, batch, flush,
      and finalize). The destructor, if provided, destroys the bind data when it is no longer needed. The
      equality callback, if provided, compares two bind data pointers (e.g. for plan caching); otherwise a
      default pointer equality check is used.
    parameters:
      info:
        type: copy_function_bind_info
        description: The bind info handle.
      data:
        type: opaque
        description: Opaque handle bundling the bind data pointer plus optional destructor and equality callbacks.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: API_CALL
  # --- Init callback accessors ---
  copy_function_init_get_user_data:
    summary: Retrieves the user data set on the builder via copy_function_builder_set_user_data.
    parameters:
      info:
        type: copy_function_init_info
        description: The init info handle.
      out_data:
        type: void
        indirection: 2
        kind: OUT
        description: Receives the user data pointer, or null if none was set.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: API_CALL
  copy_function_init_get_bind_data:
    summary: Retrieves the bind data set by the function's bind callback.
    parameters:
      info:
        type: copy_function_init_info
        description: The init info handle.
      out_data:
        type: void
        indirection: 2
        kind: OUT
        description: Receives the bind data pointer, or null if none was set.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: API_CALL
  copy_function_init_get_file_path:
    summary: Retrieves the target file path for the copy operation.
    parameters:
      info:
        type: copy_function_init_info
        description: The init info handle.
      out_path:
        type: str
        indirection: 1
        kind: OUT_BORROW
        description: Receives a borrowed view of the target file path. Owned by the library; only valid for the duration of the callback.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: API_CALL
  copy_function_init_set_init_data:
    summary: Sets the function's global init data from the init callback.
    description: |
      Sets an opaque handle bundling a pointer to "init data" plus an optional destructor callback. The init
      data is accessible from the batch, flush, and finalize callbacks. The destructor, if provided, destroys
      the init data when it is no longer needed; the opaque handle's equality callback is unused for init data.
    parameters:
      info:
        type: copy_function_init_info
        description: The init info handle.
      data:
        type: opaque
        description: Opaque handle bundling the init data pointer plus an optional destructor callback.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: API_CALL
  # --- Batch callback accessors ---
  copy_function_batch_get_user_data:
    summary: Retrieves the user data set on the builder via copy_function_builder_set_user_data.
    parameters:
      info:
        type: copy_function_batch_info
        description: The batch info handle.
      out_data:
        type: void
        indirection: 2
        kind: OUT
        description: Receives the user data pointer, or null if none was set.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: API_CALL
  copy_function_batch_get_bind_data:
    summary: Retrieves the bind data set by the function's bind callback.
    parameters:
      info:
        type: copy_function_batch_info
        description: The batch info handle.
      out_data:
        type: void
        indirection: 2
        kind: OUT
        description: Receives the bind data pointer, or null if none was set.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: API_CALL
  copy_function_batch_get_init_data:
    summary: Retrieves the global init data set by the function's init callback.
    parameters:
      info:
        type: copy_function_batch_info
        description: The batch info handle.
      out_data:
        type: void
        indirection: 2
        kind: OUT
        description: Receives the init data pointer, or null if none was set.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: API_CALL
  copy_function_batch_get_input:
    summary: Retrieves the input column data collection to prepare for this batch.
    description: |
      Ownership of the collection is transferred to the callback: the callback (or the C++ wrapper around it)
      is responsible for destroying it via column_data_collection_destroy once it is done with it.
    parameters:
      info:
        type: copy_function_batch_info
        description: The batch info handle.
      out_input:
        type: column_data_collection
        indirection: 1
        kind: OUT
        description: Receives the input column data collection. Owned by the callback.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: API_CALL
  copy_function_batch_set_batch_data:
    summary: Sets the prepared batch data from the batch callback.
    description: |
      Sets an opaque handle bundling a pointer to the prepared batch data plus an optional destructor callback,
      to be handed to the flush callback. The destructor, if provided, destroys the batch data when it is no
      longer needed; the opaque handle's equality callback is unused for batch data.
    parameters:
      info:
        type: copy_function_batch_info
        description: The batch info handle.
      data:
        type: opaque
        description: Opaque handle bundling the prepared batch data pointer plus an optional destructor callback.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: API_CALL
  # --- Flush callback accessors ---
  copy_function_flush_get_user_data:
    summary: Retrieves the user data set on the builder via copy_function_builder_set_user_data.
    parameters:
      info:
        type: copy_function_flush_info
        description: The flush info handle.
      out_data:
        type: void
        indirection: 2
        kind: OUT
        description: Receives the user data pointer, or null if none was set.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: API_CALL
  copy_function_flush_get_bind_data:
    summary: Retrieves the bind data set by the function's bind callback.
    parameters:
      info:
        type: copy_function_flush_info
        description: The flush info handle.
      out_data:
        type: void
        indirection: 2
        kind: OUT
        description: Receives the bind data pointer, or null if none was set.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: API_CALL
  copy_function_flush_get_init_data:
    summary: Retrieves the global init data set by the function's init callback.
    parameters:
      info:
        type: copy_function_flush_info
        description: The flush info handle.
      out_data:
        type: void
        indirection: 2
        kind: OUT
        description: Receives the init data pointer, or null if none was set.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: API_CALL
  copy_function_flush_get_batch_data:
    summary: Retrieves the prepared batch data set by the function's batch callback.
    parameters:
      info:
        type: copy_function_flush_info
        description: The flush info handle.
      out_data:
        type: void
        indirection: 2
        kind: OUT
        description: Receives the prepared batch data pointer, or null if none was set.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: API_CALL
  # --- Finalize callback accessors ---
  copy_function_finalize_get_user_data:
    summary: Retrieves the user data set on the builder via copy_function_builder_set_user_data.
    parameters:
      info:
        type: copy_function_finalize_info
        description: The finalize info handle.
      out_data:
        type: void
        indirection: 2
        kind: OUT
        description: Receives the user data pointer, or null if none was set.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: API_CALL
  copy_function_finalize_get_bind_data:
    summary: Retrieves the bind data set by the function's bind callback.
    parameters:
      info:
        type: copy_function_finalize_info
        description: The finalize info handle.
      out_data:
        type: void
        indirection: 2
        kind: OUT
        description: Receives the bind data pointer, or null if none was set.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: API_CALL
  copy_function_finalize_get_init_data:
    summary: Retrieves the global init data set by the function's init callback.
    parameters:
      info:
        type: copy_function_finalize_info
        description: The finalize info handle.
      out_data:
        type: void
        indirection: 2
        kind: OUT
        description: Receives the init data pointer, or null if none was set.
      err:
        type: error_info
        indirection: 1
        description: Optional. Error info handle to write details to if the call fails.
    return_type: API_CALL
