# yaml-language-server: $schema=https://cdn.jsdelivr.net/gh/duckdb/capigen@v0.4.0/src/capigen/schema/module.schema.json
module: column_data_collection
handles:
  column_data_collection:
    description: "A column_data_collection represents a set of (buffer-managed) data chunks."
  # For single-threaded scans
  column_data_collection_scan_state:
    description: "Opaque state handle for scanning a column data collection. This is used to track progress and any other state that needs to be maintained across calls while scanning the collection."
  # For multi-threaded scans
  column_data_collection_shared_scan_state:
    description: "Opaque state handle for shared state across multiple threads scanning a column data collection. This is used to coordinate work distribution, track global progress, or store any other state that needs to be shared across threads during the scan of the collection."
  column_data_collection_worker_scan_state:
    description: "Opaque state handle for worker-local state while scanning a column data collection. This is used to track progress and any other state that needs to be maintained on a per-worker basis across calls while scanning the collection."
  # For appending
  column_data_collection_append_state:
    description: "Opaque state handle for appending to a column data collection. This is used to track progress and any other state that needs to be maintained across calls while appending to the collection."
functions:
  # -----------------------------------------------------------------------
  # Construction and destruction
  # -----------------------------------------------------------------------
  column_data_collection_create:
    summary: Creates an empty column data collection.
    description: |
      Allocates a new, empty column data collection. The collection starts with no chunks and is ready to have chunks appended to it. Caller owns the result and must destroy it via column_data_collection_destroy.
    role: constructor
    parameters:
      context:
        type: context
        description: The context to create the collection within.
      types_array:
        type: logical_type
        indirection: 1
        const: true
        description: Pointer to an array of logical_type handles, one per column. This defines the schema for the chunks that will be stored in the collection. All chunks appended to this collection must have vectors that conform to these types.
      types_count:
        type: idx
        description: Number of elements in the types_array.
      out_collection:
        type: column_data_collection
        indirection: 1
        kind: OUT
        description: Receives the new collection handle.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: API_CALL
  column_data_collection_destroy:
    summary: Destroys a column data collection and all its chunks.
    description: |
      Cleans up the collection and all resources associated with it, including all contained chunks. Sets the collection handle to NULL.
    role: destructor
    parameters:
      collection:
        type: column_data_collection
        indirection: 1
        description: The collection to destroy.
    return_type: API_CALL
  column_data_collection_combine:
    summary: Merges the source collection into the target collection, consuming the source in the process.
    description: Transfers all chunks from the source collection to the target collection. This destroys the source collection, setting the source handle to NULL.
    parameters:
      target:
        type: column_data_collection
        description: The collection to merge into. After the call, this collection will contain all chunks from both collections.
      source:
        type: column_data_collection
        indirection: 1
        description: The collection to merge from. This collection will be destroyed by this operation and its handle set to NULL.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: API_CALL
  column_data_collection_reset:
    summary: Drops all buffered rows, keeping the column types.
    description: |
      Drops all buffered rows and releases their memory. The column types are
      unchanged and the collection is immediately appendable again. Outstanding
      append and scan states are invalidated; create new ones. Must not be
      called while a live result executes over the collection, because that
      result's scan borrows the collection's buffers.
    belongs_to: column_data_collection
    parameters:
      collection:
        type: column_data_collection
        description: The collection to reset.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: API_CALL
  # -----------------------------------------------------------------------
  # Accessors
  # -----------------------------------------------------------------------
  column_data_collection_row_count:
    summary: Returns the total number of rows across all chunks in the collection.
    description: |
      Sums the row counts of all chunks in the collection. This is the total
      number of rows represented by the collection, which may be more than
      the number of rows in any individual chunk.
    role: getter
    belongs_to: column_data_collection
    parameters:
      collection:
        type: column_data_collection
        description: The collection to inspect.
      out_row_count:
        type: idx
        indirection: 1
        kind: OUT
        description: Receives the total row count.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: API_CALL
  ## -----------------------------------------------------------------------
  ## Appending
  ## -----------------------------------------------------------------------
  column_data_collection_append_state_create:
    summary: Initializes an append state for the collection.
    description: |
      Returns an append state handle that can be used to append chunks to the collection while maintaining any necessary state across calls. Caller owns the returned state and must destroy it via column_data_collection_append_state_destroy when done.
    belongs_to: column_data_collection
    parameters:
      collection:
        type: column_data_collection
        description: The collection to prepare for appending.
      out_state:
        type: column_data_collection_append_state
        indirection: 1
        kind: OUT
        description: Receives the new append state handle.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: API_CALL
  column_data_collection_append_state_destroy:
    summary: Destroys an append state handle.
    description: |
      Cleans up any resources associated with the append state. After this call, the state handle must not be used again.
    role: destructor
    belongs_to: column_data_collection
    parameters:
      state:
        type: column_data_collection_append_state
        indirection: 1
        description: The append state to destroy.
    return_type: API_CALL
  column_data_collection_append:
    summary: Appends a data chunk to the collection.
    description: |
      Appends a copy of the given chunk to the end of the collection. The
      chunk's column count and types must equal the collection's exactly; a
      mismatch is rejected with INVALID_INPUT before anything is copied.
      Complex-typed vectors may be flattened in place by the copy.
    belongs_to: column_data_collection
    parameters:
      collection:
        type: column_data_collection
        description: The collection to append to.
      state:
        type: column_data_collection_append_state
        description: The append state to use this append operation.
      chunk:
        type: data_chunk
        description: The chunk to append.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: API_CALL
  ## -----------------------------------------------------------------------
  ## Single Threaded Scanning
  ## -----------------------------------------------------------------------
  column_data_collection_scan_state_create:
    summary: Initializes a scan state for the collection.
    description: |
      Returns a scan state handle that can be used to scan the collection while maintaining progress and any other necessary state across multiple scan calls. Caller owns the returned state and must destroy it via column_data_collection_scan_state_destroy when done.
    belongs_to: column_data_collection
    parameters:
      collection:
        type: column_data_collection
        description: The collection to prepare for scanning.
      out_state:
        type: column_data_collection_scan_state
        indirection: 1
        kind: OUT
        description: Receives the new scan state handle.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: API_CALL
  column_data_collection_scan_state_destroy:
    summary: Destroys a scan state handle.
    description: |
      Cleans up any resources associated with the scan state. After this call, the state handle must not be used again.
    role: destructor
    belongs_to: column_data_collection
    parameters:
      state:
        type: column_data_collection_scan_state
        indirection: 1
        description: The scan state to destroy.
    return_type: API_CALL
  column_data_collection_scan:
    summary: Scans the collection to retrieve the next data chunk.
    description: Retrieves the next chunk of data from the collection based on the provided shared scan states.
    role: getter
    belongs_to: column_data_collection
    parameters:
      collection:
        type: column_data_collection
        description: The collection to scan.
      state:
        type: column_data_collection_scan_state
        description: The scan state to use for this scan operation. This allows each thread to maintain its own progress while coordinating with others via the shared state.
      out_chunk:
        type: data_chunk
        description: The output chunk to write to.
      did_produce_chunk:
        type: bool
        indirection: 1
        kind: OUT
        description: Receives a boolean indicating whether a chunk was produced by this call or if the scan has completed (and the chunk was left as-is).
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: API_CALL
  ## -----------------------------------------------------------------------
  ## Multi-Threaded Scanning
  ## -----------------------------------------------------------------------
  column_data_collection_shared_scan_state_create:
    summary: Initializes a shared scan state for the collection.
    description: |
      Returns a shared scan state handle that can be used by multiple threads to coordinate scanning of the collection. Caller owns the returned state and must destroy it via column_data_collection_shared_scan_state_destroy when done.
    parameters:
      collection:
        type: column_data_collection
        description: The collection to prepare for shared scanning.
      out_state:
        type: column_data_collection_shared_scan_state
        indirection: 1
        kind: OUT
        description: Receives the new shared scan state handle.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: API_CALL
  column_data_collection_shared_scan_state_destroy:
    summary: Destroys a shared scan state handle.
    description: |
      Cleans up any resources associated with the shared scan state. After this call, the state handle must not be used again.
    role: destructor
    parameters:
      state:
        type: column_data_collection_shared_scan_state
        indirection: 1
        description: The shared scan state to destroy.
    return_type: API_CALL
  column_data_collection_worker_scan_state_create:
    summary: Initializes a worker scan state for the collection.
    description: |
      Returns a "local" scan state handle for a worker thread to use while scanning the collection. This allows each worker to maintain its own progress and any other necessary information across multiple scan calls, while still coordinating with other workers via the shared scan state. Caller owns the returned state and must destroy it via column_data_collection_worker_scan_state_destroy when done.
    parameters:
      collection:
        type: column_data_collection
        description: The collection to prepare for worker scanning.
      out_state:
        type: column_data_collection_worker_scan_state
        indirection: 1
        kind: OUT
        description: Receives the new worker scan state handle.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: API_CALL
  column_data_collection_worker_scan_state_destroy:
    summary: Destroys a worker scan state handle.
    description: |
      Cleans up any resources associated with the worker scan state. After this call, the state handle must not be used again.
    role: destructor
    parameters:
      state:
        type: column_data_collection_worker_scan_state
        indirection: 1
        description: The worker scan state to destroy.
    return_type: API_CALL
  column_data_collection_parallel_scan:
    summary: Scans the collection to retrieve the next data chunk, using shared state for coordination across threads and worker-local state for individual progress tracking.
    description: |
      Retrieves the next chunk of data from the collection based on the provided shared scan state and worker-local scan state.
    role: getter
    belongs_to: column_data_collection
    parameters:
      collection:
        type: column_data_collection
        description: The collection to scan.
      shared_state:
        type: column_data_collection_shared_scan_state
        description: The shared scan state to use for coordinating across threads.
      worker_state:
        type: column_data_collection_worker_scan_state
        description: The worker-local scan state to use for this thread's scan operation.
      out_chunk:
        type: data_chunk
        description: The output chunk to write to.
      did_produce_chunk:
        type: bool
        indirection: 1
        kind: OUT
        description: Receives a boolean indicating whether a chunk was produced by this call or if the scan has completed (and the chunk was left as-is).
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: API_CALL
