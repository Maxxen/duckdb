# yaml-language-server: $schema=https://cdn.jsdelivr.net/gh/duckdb/capigen@v0.5.0/src/capigen/schema/module.schema.json
module: data_chunk
#
# Construct and inspect data chunks.
#
# Mirrors duckdb::DataChunk: a set of vectors of equal logical length plus
# a row-count cardinality. Each vector carries its own logical type (see
# vector_get_logical_type in the vector module). The chunk does
# not store types separately; they live on the vectors.
#
# Chunks produced by a streaming result (result_step /
# result_fetch_chunk in the query_result module) are caller-owned and
# must be destroyed via data_chunk_destroy. Vectors borrowed via
# data_chunk_get_vector are valid for the lifetime of the chunk
# and are read via vector_get_view. The row count for top-level
# vectors is data_chunk_get_size; it lives on the chunk, not on
# the view. (Nested children get their row count from parent
# geometry; see the vector module's docstring.)

functions:
  # -----------------------------------------------------------------------
  # DataChunk construction
  # -----------------------------------------------------------------------
  data_chunk_create:
    description: |
      Creates an empty data chunk with the given column types.

      Allocates a new DataChunk with one FLAT vector per element of the
      types array, each initialized to default capacity. Each vector's
      size starts at 0; set it via vector_set_size after populating the
      vector. Caller owns the result and must destroy it via data_chunk_destroy.
    role: constructor
    belongs_to: data_chunk
    parameters:
      types:
        type: logical_type
        indirection: 1
        const: true
        description: Pointer to an array of logical_type handles, one per column.
      column_count:
        type: idx
        description: Number of elements in the types array.
      out_chunk:
        type: data_chunk
        indirection: 1
        kind: OUT
        description: Receives the new chunk handle.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: ERROR
  # -----------------------------------------------------------------------
  # Chunk-level accessors
  # -----------------------------------------------------------------------
  data_chunk_destroy:
    description: |
      Destroys a data chunk handle.

      Null-safe. On success the slot is set to nullptr. Any vectors
      previously borrowed from this chunk become invalid.
    role: destructor
    belongs_to: data_chunk
    parameters:
      chunk:
        type: data_chunk
        indirection: 1
    return_type: ERROR
  data_chunk_get_size:
    description: Returns the row count of a data chunk.
    role: getter
    belongs_to: data_chunk
    parameters:
      chunk:
        type: data_chunk
      out_size:
        type: idx
        indirection: 1
        kind: OUT
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: ERROR
  data_chunk_get_vector_count:
    description: |
      Returns the number of vectors in a data chunk.

      Equals the column count of the producing result.
    role: getter
    belongs_to: data_chunk
    parameters:
      chunk:
        type: data_chunk
      out_count:
        type: idx
        indirection: 1
        kind: OUT
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: ERROR
  data_chunk_get_vector:
    description: |
      Borrows the vector at the given index in a data chunk.

      Returns a borrowed vector handle valid until the chunk is destroyed.
      Do not call destroy_* on it. Out-of-range index returns
      ERROR_INPUT_INVALID.
    role: getter
    belongs_to: data_chunk
    parameters:
      chunk:
        type: data_chunk
      index:
        type: idx
        description: The vector index, in [0, vector_count).
      out_vector:
        type: vector
        indirection: 1
        kind: OUT_BORROW
        description: Receives the borrowed vector handle.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: ERROR
