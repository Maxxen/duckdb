# Function assigning every member in the derived engine-side header.
create_method: CreateAPIv2
# Prefix of the engine-side version define macros. Distinct from v1's
# DUCKDB_EXTENSION_API_VERSION: both internal headers compile into the engine.
version_macro_prefix: DUCKDB_EXTENSION_API_V2_VERSION
# Header the engine-side output includes: duckdb_v2.h behind the engine's own
# Arrow C data interface definitions (see the shim header's comment).
internal_include: duckdb/main/capi_v2/duckdb_v2_engine.hpp
