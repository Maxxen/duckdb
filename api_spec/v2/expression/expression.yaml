# yaml-language-server: $schema=https://cdn.jsdelivr.net/gh/duckdb/capigen@v0.4.0/src/capigen/schema/module.schema.json
module: expression
#
# Read-side introspection of bound expression trees. A duckdb_v2_expression
# is a borrowed handle to a duckdb::Expression living inside the engine's
# plan; it is never owned or destroyed by the caller. Handles arrive through
# a consumer that hands them out (e.g. table-function filter pushdown or
# scalar-function bind-time argument inspection); this module ships the
# handle plus its accessors standalone.
#
# SCOPE: bound expressions only. duckdb_v2_expression is duckdb::Expression —
# the post-binding tree. Parser-level / unbound expressions
# (duckdb::ParsedExpression) are a separate internal hierarchy and are out of
# scope for this surface. Consequently get_class only ever yields the BOUND_*
# values (plus the misc BOUND_EXPRESSION / BOUND_EXPANDED); the parsed-class
# values exist in EXPRESSION_CLASS purely for numeric fidelity with
# duckdb::ExpressionClass and are never returned here. Switch on the BOUND_*
# values: columns are BOUND_COLUMN_REF (not the parsed COLUMN_REF), constants
# are BOUND_CONSTANT (not CONSTANT), and so on.
#
# Design: ONE generic handle, not a type hierarchy.
#   - get_class / get_type / get_return_type are meaningful for every bound
#     class and never fail on class grounds.
#   - get_child_count / get_child traverse children via the engine's own
#     ExpressionIterator, so they are total over every bound class (including
#     the children of nodes this module otherwise doesn't model — case,
#     aggregate, window, etc.). Child order follows the iterator.
# The class-specific accessors return ERROR_INPUT_INVALID when called on a
# class they do not apply to:
#   - get_function_name  : BOUND_FUNCTION only (the registered function name;
#                          an internal symbol like "__comparison" for
#                          comparisons — dispatch on get_type for the operator).
#   - get_constant_value : BOUND_CONSTANT only.
#   - get_column_binding : BOUND_COLUMN_REF only (the logical {table, column}
#                          binding seen during binding / optimization, incl.
#                          filter pushdown).
#   - get_reference_index: BOUND_REF only (the physical DataChunk slot assigned
#                          after physical planning — not what pushdown sees).
# We deliberately did not introduce narrowed sub-handles
# (expression_as_function / _as_constant / _as_reference): with so few
# class-specific accessors a narrowing gate fails the same way, at the same
# call site, as the direct accessor. Revisit when the class-specific surface
# grows (cast try_cast / target type, aggregate distinct / filter, function
# bind-info).
#
# The EXPRESSION_CLASS and EXPRESSION_TYPE enums mirror duckdb::ExpressionClass
# and duckdb::ExpressionType integer values exactly, so the numeric round-trip
# matches what's stored internally.

enums:
  EXPRESSION_CLASS:
    description: |
