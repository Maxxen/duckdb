handles:
  expression:
    description: |
      A borrowed handle to a bound expression node within the engine's plan.
      Read-only; never owned or destroyed by the caller. Valid only for the
      duration of the callback that hands it out (e.g. a filter-pushdown or
      bind callback); do not store it past the callback's return. Children
      borrowed via expression_get_child share the same lifetime.
functions:
  # -----------------------------------------------------------------------
  # Universal introspection — valid for every expression class.
  # -----------------------------------------------------------------------
  expression_get_class:
    summary: Returns the class of a bound expression.
    description: |
      The expression class can be used to determine which class-specific accessors are valid (get_function_name
      for function-like classes; get_constant_value for BOUND_CONSTANT; get_reference_index for BOUND_REF).
    role: getter
    belongs_to: expression
    parameters:
      expression:
        type: expression
        description: The expression to inspect.
      out_class:
        type: EXPRESSION_CLASS
        indirection: 1
        kind: OUT
        description: Receives the expression class.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: ERROR
  expression_get_type:
    summary: Returns the semantic operation type of a bound expression.
    description: |
      Distinguishes two nodes of the same class (e.g. COMPARE_EQUAL versus
      COMPARE_GREATERTHAN on two BOUND_FUNCTION nodes). Never fails on class
      grounds.
    role: getter
    belongs_to: expression
    parameters:
      expression:
        type: expression
        description: The expression to inspect.
      out_type:
        type: EXPRESSION_TYPE
        indirection: 1
        kind: OUT
        description: Receives the expression type.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: ERROR
  expression_get_return_type:
    summary: Returns the logical type of the expression's result.
    description: |
      The returned logical type is caller-owned and must be destroyed via logical_type_destroy.
    role: getter
    belongs_to: expression
    parameters:
      expression:
        type: expression
        description: The expression to inspect.
      out_type:
        type: logical_type
        indirection: 1
        kind: OUT
        description: Receives the owned result logical type.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: ERROR
  expression_get_child_count:
    summary: Returns the number of child expressions.
    description: |
      Total over every bound class that has children. Leaves (BOUND_CONSTANT, BOUND_REF) report 0, BOUND_CAST reports 1,
      and nested nodes report their full fan-out (including hidden children such as a CASE's when/then/else or an
      aggregate's filter and order keys). Never fails on bound classes.
    role: getter
    belongs_to: expression
    parameters:
      expression:
        type: expression
        description: The expression to inspect.
      out_count:
        type: idx
        indirection: 1
        kind: OUT
        description: Receives the child count.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: ERROR
  expression_get_child:
    summary: Borrows a child expression by index.
    description: |
      Child order follows the engine's ExpressionIterator. Returns
      ERROR_INPUT_INVALID if index is out of range (>= the count from
      expression_get_child_count), which includes every index on a leaf
      expression. The returned handle is borrowed and shares the parent's
      lifetime; do not destroy it.
    role: getter
    belongs_to: expression
    parameters:
      expression:
        type: expression
        description: The parent expression.
      index:
        type: idx
        description: Zero-based child index.
      out_child:
        type: expression
        indirection: 1
        kind: OUT_BORROW
        description: Receives a borrowed child expression handle.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: ERROR
  # -----------------------------------------------------------------------
  # BOUND_FUNCTION.
  # -----------------------------------------------------------------------
  expression_get_function_name:
    summary: Borrows the function name of a BOUND_FUNCTION expression.
    description: |
      Returns the bound scalar function's registered name. For comparison
      operators this is an internal symbol such as "__comparison" — dispatch on
      expression_get_type for the semantic operator (e.g. COMPARE_EQUAL).
      Returns ERROR_INPUT_INVALID if the expression class is not BOUND_FUNCTION.
      On success, writes a borrowed null-terminated byte string into *out_name,
      valid for the expression handle's lifetime.
    role: getter
    belongs_to: expression
    parameters:
      expression:
        type: expression
        description: The expression to inspect.
      out_name:
        type: identifier
        indirection: 1
        kind: OUT_BORROW
        description: Receives a borrowed view of the function name.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: ERROR
  # -----------------------------------------------------------------------
  # BOUND_CONSTANT.
  # -----------------------------------------------------------------------
  expression_get_constant_value:
    summary: Returns the value of a BOUND_CONSTANT expression.
    description: |
      The returned value is caller-owned and must be destroyed via
      value_destroy. Returns ERROR_INPUT_INVALID if the expression class is
      not BOUND_CONSTANT.
    role: getter
    belongs_to: expression
    parameters:
      expression:
        type: expression
        description: The expression to inspect.
      out_value:
        type: value
        indirection: 1
        kind: OUT
        description: Receives the owned constant value.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: ERROR
  # -----------------------------------------------------------------------
  # BOUND_COLUMN_REF.
  # -----------------------------------------------------------------------
  expression_get_column_binding:
    summary: Returns the column binding of a BOUND_COLUMN_REF expression.
    description: |
      A BOUND_COLUMN_REF identifies a column logically, by binding — this is
      the representation seen during binding and optimization, including
      table-function filter pushdown (columns only become physical BOUND_REF
      slots after physical planning). The binding is {table_index,
      column_index}; column_index is relative to the producing operator's
      output (e.g. a scan's projected columns). Each out-param is optional:
      pass NULL to skip a field. Returns ERROR_INPUT_INVALID if the expression
      class is not BOUND_COLUMN_REF.
    role: getter
    belongs_to: expression
    parameters:
      expression:
        type: expression
        description: The expression to inspect.
      out_table_index:
        type: idx
        indirection: 1
        kind: OUT
        description: Optional. Receives the binding's table index (binding namespace id).
      out_column_index:
        type: idx
        indirection: 1
        kind: OUT
        description: Optional. Receives the binding's column index within the producing operator's output.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: ERROR
  # -----------------------------------------------------------------------
  # BOUND_REF.
  # -----------------------------------------------------------------------
  expression_get_reference_index:
    summary: Returns the physical column index of a BOUND_REF expression.
    description: |
      The index identifies the column within the expression's input DataChunk.
      BOUND_REF is the execution-stage column representation assigned after
      physical planning; binding/optimization-stage trees (e.g. filter
      pushdown) carry BOUND_COLUMN_REF instead — see
      expression_get_column_binding. Returns ERROR_INPUT_INVALID if the
      expression class is not BOUND_REF.
    role: getter
    belongs_to: expression
    parameters:
      expression:
        type: expression
        description: The expression to inspect.
      out_index:
        type: idx
        indirection: 1
        kind: OUT
        description: Receives the physical column index.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: ERROR
