module: arena
#
# Bump allocation of caller-written bytes whose lifetime is owned by another
# object. The arena has no value semantics of its own: it hands out raw
# uninitialized bytes, and the borrowing context defines what they may back and
# how long they live.
#
# Currently the only source is vector_get_arena, whose bytes back the
# out-of-line payload of string-backed vectors: borrow the arena once (the
# single string-ness check), reserve bytes with arena_allocate, write them,
# assemble a duckdb_v2_bytes, and place it via vector_get_data_mutable. Values
# <= DUCKDB_V2_BYTES_INLINE_LENGTH need no allocation. The stable C++ API wraps
# all of this.
functions:
  arena_allocate:
    description: |
      Reserves byte_len bytes of memory from the arena.

      Raw bump allocation: returns a writable pointer to byte_len uninitialized
      bytes, valid for the arena's lifetime. No value semantics and no size
      gating; byte_len may be 0. The caller writes the bytes and assembles
      whatever the borrowing context expects. For a vector arena that is a
      duckdb_v2_bytes, whose length is a uint32, so bytes backing a single
      value must respect that bound; this is the caller's to enforce.
    role: method
    belongs_to: arena
    parameters:
      arena:
        type: arena
      byte_len:
        type: idx
        description: Number of bytes to reserve. May be 0.
      out_ptr:
        type: u8
        indirection: 2
        kind: OUT_BORROW
        description: Receives a writable pointer to byte_len arena-owned bytes.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: ERROR
