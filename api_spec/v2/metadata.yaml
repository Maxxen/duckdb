schema_version: "0.5"
versions:
  - "v1.2.0"
  - "v1.3.0"
  - "v1.4.0"
  - "v1.5.0"
prefix: "duckdb_v2_"
suffixes:
  handles: "_handle"
  callbacks: "_fn"
  aliases: "_t"
primitives:
  - name: void
    c_type: void
  - name: char
    c_type: char
  - name: bool
    c_type: bool
  - name: i8
    c_type: int8_t
  - name: i16
    c_type: int16_t
  - name: i32
    c_type: int32_t
  - name: i64
    c_type: int64_t
  - name: u8
    c_type: uint8_t
  - name: u16
    c_type: uint16_t
  - name: u32
    c_type: uint32_t
  - name: u64
    c_type: uint64_t
  - name: f32
    c_type: float
  - name: f64
    c_type: double
  - name: idx
    c_type: idx_t
    underlying: uint64_t
  - name: size
    c_type: size_t
  # Arrow C Data Interface structs. Declared as primitives so the arrow module
  # can reference them by their upstream names (e.g. `struct ArrowSchema *`).
  # They carry no `underlying`, so no typedef is emitted; the full struct
  # definitions come from the header preamble (emit_arrow_defs above).
  - name: ArrowSchema
    c_type: struct ArrowSchema
  - name: ArrowArray
    c_type: struct ArrowArray
  - name: ArrowArrayStream
    c_type: struct ArrowArrayStream
