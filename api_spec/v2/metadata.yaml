# yaml-language-server: $schema=https://raw.githubusercontent.com/duckdblabs/capiv2/main/src/capigen/schema/metadata.schema.json
schema_version: "0.3.0"
versions:
  - "1.2.0"
  - "1.3.0"
  - "1.4.0"
  - "1.5.0"
prefix: "duckdb_v2_"
options:
  c:
    api_macro: DUCKDB_C_API
    extension_api_macro: DUCKDB_EXTENSION_API
    deprecated_macro: DUCKDB_DEPRECATED
    no_deprecated_guard: DUCKDB_API_NO_DEPRECATED
    typedef_guard_prefix: DUCKDB_TYPEDEF_
    banner: |-
      //===----------------------------------------------------------------------===//
      //
      //                         DuckDB
      //
      //
      //===----------------------------------------------------------------------===//
      //
      // !!!!!!!
      // WARNING: this file is autogenerated, manual changes will be overwritten
      // !!!!!!!
    handles:
      default_style: tagged_struct
    # Emit the full ArrowSchema / ArrowArray / ArrowArrayStream struct
    # definitions into the header preamble, guarded by ARROW_C_DATA_INTERFACE /
    # ARROW_C_STREAM_INTERFACE so they coexist with a consumer's own Arrow
    # headers. The arrow module references these structs by their upstream
    # names (declared as primitives below).
    emit_arrow_defs: true
  bridge:
    include: capi_v2_internal.hpp
suffixes:
  handles: "_handle"
  callbacks: "_fn"
  aliases: "_t"
primitives:
  - name: void
    c_type: void
  - name: char
    c_type: char
  - name: bool
    c_type: bool
  - name: i8
    c_type: int8_t
  - name: i16
    c_type: int16_t
  - name: i32
    c_type: int32_t
  - name: i64
    c_type: int64_t
  - name: u8
    c_type: uint8_t
  - name: u16
    c_type: uint16_t
  - name: u32
    c_type: uint32_t
  - name: u64
    c_type: uint64_t
  - name: f32
    c_type: float
  - name: f64
    c_type: double
  - name: idx
    c_type: idx_t
    underlying: uint64_t
  - name: size
    c_type: size_t
  # Arrow C Data Interface structs. Declared as primitives so the arrow module
  # can reference them by their upstream names (e.g. `struct ArrowSchema *`).
  # They carry no `underlying`, so no typedef is emitted; the full struct
  # definitions come from the header preamble (emit_arrow_defs above).
  - name: ArrowSchema
    c_type: struct ArrowSchema
  - name: ArrowArray
    c_type: struct ArrowArray
  - name: ArrowArrayStream
    c_type: struct ArrowArrayStream
