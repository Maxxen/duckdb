# yaml-language-server: $schema=https://cdn.jsdelivr.net/gh/duckdb/capigen@v0.5.0/src/capigen/schema/module.schema.json
module: string_heap
#
# Write side of string-backed vectors. Borrow the heap once with
# vector_get_string_heap (the single string-ness check), reserve vector-lifetime
# bytes with string_heap_allocate, write them, assemble a duckdb_v2_string, and
# place it via vector_get_data_mutable. Values <= DUCKDB_V2_STRING_INLINE_LENGTH
# need no allocation. The stable C++ API wraps all of this.
#
# Lifetime: allocated bytes, and non-inlined values referencing them, are valid
# only while the owning vector lives. Inlined values are self-contained.
functions:
  string_heap_allocate:
    description: |
      Reserves byte_len bytes of vector-lifetime memory from the heap.

      Raw arena allocation: returns a writable pointer to byte_len uninitialized
      bytes. No string semantics and no size gating; byte_len may be 0. The
      caller writes the bytes and assembles the duckdb_v2_string. A
      duckdb_v2_string length is a uint32, so bytes backing a single value must
      respect that bound; this is the caller's to enforce.
    role: method
    belongs_to: string_heap
    parameters:
      heap:
        type: string_heap
      byte_len:
        type: idx
        description: Number of bytes to reserve. May be 0.
      out_ptr:
        type: u8
        indirection: 2
        kind: OUT_BORROW
        description: Receives a writable pointer to byte_len heap-owned bytes.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: ERROR
