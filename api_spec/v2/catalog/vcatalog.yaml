  #---------------------------------------------------------------------------------------------------------------------
  # Schema
  #---------------------------------------------------------------------------------------------------------------------
  vcatalog_schema_create:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-05" ]
    description: |
      Creates a schema of the database.

      The schema starts out with the given name and no state. Creating it does not make it visible: DuckDB only sees
      the schemas the find and list callbacks hand it. The caller owns the returned handle and must destroy it with
      `[[vcatalog_schema_destroy]]`, within the rules of the module notes.
    role: constructor
    belongs_to: vcatalog_schema
    parameters:
      database:
        type: vcatalog_database
        description: The database to create the schema in.
      name:
        type: char
        indirection: 1
        const: true
        kind: IN
        description: The name of the schema. Borrowed and copied.
      name_length:
        type: idx
        description: The length of `name` in bytes. `name` must be valid UTF-8, need not be null-terminated, and may be NULL only when this is 0.
      schema:
        type: vcatalog_schema
        indirection: 1
        kind: OUT
        description: On success, receives the newly created schema. Owned by the caller.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vcatalog_schema_destroy:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-05" ]
    description: |
      Destroys the schema and its state.

      Destroy a schema only once every transaction it was handed out in has ended, and after every entry created in
      it. Null-safe: passing a null pointer or null handle is a no-op. The handle is set to null on return to prevent
      double-destruction.
    parameters:
      schema:
        type: vcatalog_schema
        description: The schema to destroy.
        indirection: 1
    return_type: ERROR

  vcatalog_schema_get_name:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-05" ]
    description: |
