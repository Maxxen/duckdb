      schema:
        type: vcatalog_schema
        description: The schema to set the state of.
      data:
        type: opaque
        indirection: 1
        description: Opaque handle bundling the state pointer plus an optional destructor.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
