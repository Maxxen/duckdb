module: vcatalog
#
# Implementing a database type of your own: one that `ATTACH` can open, whose catalog and transactions are provided by
# callbacks instead of by DuckDB's storage. A vcatalog is built with the setters below and registered on an instance
# under a name, after which `ATTACH '<path>' (TYPE <name>)` attaches a database of that type.
#
# State lives at three levels, each an opaque pointer bundled with an optional destructor:
#   - The user data, set on the vcatalog and shared by every database attached with it. It lives as long as the
#     instance does.
#   - The catalog state, set by the attach callback for one attached database. It is destroyed when the database is
#     detached, after every transaction state of that database.
#   - The transaction state, set by the begin callback for one transaction on one attached database. It is destroyed
#     once that transaction has been committed or rolled back.
#
# DuckDB begins a transaction on an attached database the first time a transaction touches it, and commits or rolls it
# back together with the rest of the transaction. What a transaction means for the backing store is up to the
# implementation: the callbacks only tell it when to begin, commit and roll back. A transaction writes to at most one
# attached database, so a commit needs no coordination with the other databases the transaction read from.
#
# The transaction state may be used by several threads of one query at once, e.g. by a parallel scan, so the
# implementation must synchronize its own access to it.
#
# The catalog of an attached database is resolved through find and list callbacks, which hand DuckDB entries the
# implementation creates and owns, such as `[[vcatalog_schema]]`. The implementation decides how long it keeps an entry
# and whether it shares it between transactions and connections, within two rules:
#   - An entry handed to DuckDB must stay alive until every transaction it was handed out in has ended: binding and
#     execution use it long after the callback returned. Destroying it from the destructor of the transaction state,
#     or of the catalog state, is always late enough.
#   - DuckDB recognizes an entry by its handle. Hand out the same handle for the same entry, at least within a
#     transaction: two handles are two entries to DuckDB, e.g. two scans of one table are then not recognized as
#     scanning the same table.
# An entry may be in use by several connections at once, so the implementation must synchronize its own access to the
# state of an entry it shares.
#
# Registration is not transactional: a registered vcatalog lives for as long as the instance does.

#-----------------------------------------------------------------------------------------------------------------------
# Handles
#-----------------------------------------------------------------------------------------------------------------------
handles:
  vcatalog:
    description: |
      An owned opaque handle to a vcatalog being built. Created with `[[vcatalog_create]]`, configured with
      `[[vcatalog_set_name]]`, `[[vcatalog_set_attach_callback]]` and the other setters, made available with
      `[[connection_register_vcatalog]]` or `[[extension_register_vcatalog]]`, and destroyed with
      `[[vcatalog_destroy]]`.

  vcatalog_attach_info:
    description: |
      A borrowed opaque handle to a database being attached, received by the attach callback and valid only for the
      duration of that call. It gives access to the name, path and options of the `ATTACH`, and sets the catalog state
      of the database.

  vcatalog_transaction_begin_info:
    description: |
      A borrowed opaque handle to a transaction beginning on an attached database, received by the begin callback and
      valid only for the duration of that call. It tells whether the transaction is read-only, and sets the
      transaction state.

  vcatalog_transaction_commit_info:
    description: |
      A borrowed opaque handle to a transaction committing on an attached database, received by the commit callback
      and valid only for the duration of that call. It gives access to the transaction state.

  vcatalog_transaction_rollback_info:
    description: |
      A borrowed opaque handle to a transaction rolling back on an attached database, received by the rollback
      callback and valid only for the duration of that call. It gives access to the transaction state.

  vcatalog_database:
    description: |
      A borrowed opaque handle to a database attached with a vcatalog, passed to every callback that runs on it, and
      valid for as long as the database stays attached. It gives access to the user data and the catalog state, and is
      what the schemas of the database are created in, with `[[vcatalog_schema_create]]`.

  vcatalog_schema:
    description: |
      An owned opaque handle to a schema of a database attached with a vcatalog. Created with
      `[[vcatalog_schema_create]]`, handed to DuckDB by the schema find and list callbacks, and destroyed with
      `[[vcatalog_schema_destroy]]` within the rules of the module notes. It carries a name and the implementation's
      own state.

  vcatalog_schema_find_info:
    description: |
      A borrowed opaque handle to a request to find a schema by name, received by the schema find callback and valid
      only for the duration of that call. It gives access to the transaction state and the name, and reports the schema
      found.

  vcatalog_schema_list_info:
    description: |
      A borrowed opaque handle to the listing of the schemas of a database, received by the schema list callback and
      valid only for the duration of that call. It gives access to the transaction state, and receives the schemas.

  vcatalog_table:
    description: |
      An owned opaque handle to a table of a schema of a database attached with a vcatalog. Created with
      `[[vcatalog_table_create]]`, given its columns with `[[vcatalog_table_add_column]]`, handed to DuckDB by the table
      find and list callbacks, and destroyed with `[[vcatalog_table_destroy]]` within the rules of the module notes.
      It carries a name, its columns and the implementation's own state. Reading the rows of a table is not supported
      yet: a statement that scans one fails.

  vcatalog_table_find_info:
    description: |
      A borrowed opaque handle to a request to find a table of a schema by name, received by the table find callback
      and valid only for the duration of that call. It gives access to the transaction state, the schema and the name,
      and reports the table found.

  vcatalog_table_list_info:
    description: |
      A borrowed opaque handle to the listing of the tables of a schema, received by the table list callback and valid
      only for the duration of that call. It gives access to the transaction state and the schema, and receives the
      tables.

#-----------------------------------------------------------------------------------------------------------------------
# Callbacks
#-----------------------------------------------------------------------------------------------------------------------
callbacks:
  vcatalog_attach_callback:
    parameters:
      info:
        type: vcatalog_attach_info
        description: Borrowed opaque handle to the `ATTACH`.
      database:
        type: vcatalog_database
        description: Borrowed handle to the database the callback runs on.
      context:
        type: context
        description: Borrowed handle to the context of the connection running the `ATTACH`.
      err:
        type: error_info
        indirection: 1
        description: |
          Borrowed error info handle to use to report errors that occur during the callback. Reporting an error fails
          the `ATTACH`.
    return_type: void

  vcatalog_transaction_begin_callback:
    parameters:
      info:
        type: vcatalog_transaction_begin_info
        description: Borrowed opaque handle to the beginning transaction.
      database:
        type: vcatalog_database
        description: Borrowed handle to the database the callback runs on.
      err:
        type: error_info
        indirection: 1
        description: |
          Borrowed error info handle to use to report errors that occur during the callback. Reporting an error fails
          the statement that touched the database.
    return_type: void

  vcatalog_transaction_commit_callback:
    parameters:
      info:
        type: vcatalog_transaction_commit_info
        description: Borrowed opaque handle to the committing transaction.
      database:
        type: vcatalog_database
        description: Borrowed handle to the database the callback runs on.
      err:
        type: error_info
        indirection: 1
        description: |
          Borrowed error info handle to use to report errors that occur during the callback. Reporting an error fails
          the commit, after which the transaction is rolled back.
    return_type: void

  vcatalog_transaction_rollback_callback:
    parameters:
      info:
        type: vcatalog_transaction_rollback_info
        description: Borrowed opaque handle to the transaction rolling back.
      database:
        type: vcatalog_database
        description: Borrowed handle to the database the callback runs on.
      err:
        type: error_info
        indirection: 1
        description: |
          Borrowed error info handle to use to report errors that occur during the callback. A reported error is
          passed on, but does not stop the transaction from ending.
    return_type: void

  vcatalog_schema_find_callback:
    parameters:
      info:
        type: vcatalog_schema_find_info
        description: Borrowed opaque handle to the request.
      database:
        type: vcatalog_database
        description: Borrowed handle to the database the callback runs on.
      context:
        type: context
        description: Borrowed handle to the context of the connection the schema is found for.
      err:
        type: error_info
        indirection: 1
        description: |
          Borrowed error info handle to use to report errors that occur during the callback. Reporting an error fails
          the statement that needed the schema.
    return_type: void

  vcatalog_schema_list_callback:
    parameters:
      info:
        type: vcatalog_schema_list_info
        description: Borrowed opaque handle to the listing.
      database:
        type: vcatalog_database
        description: Borrowed handle to the database the callback runs on.
      context:
        type: context
        description: Borrowed handle to the context of the connection listing the schemas.
      err:
        type: error_info
        indirection: 1
        description: |
          Borrowed error info handle to use to report errors that occur during the callback. Reporting an error fails
          the statement that listed the schemas.
    return_type: void

  vcatalog_table_find_callback:
    parameters:
      info:
        type: vcatalog_table_find_info
        description: Borrowed opaque handle to the request.
      database:
        type: vcatalog_database
        description: Borrowed handle to the database the callback runs on.
      context:
        type: context
        description: Borrowed handle to the context of the connection the table is found for.
      err:
        type: error_info
        indirection: 1
        description: |
          Borrowed error info handle to use to report errors that occur during the callback. Reporting an error fails
          the statement that needed the table.
    return_type: void

  vcatalog_table_list_callback:
    parameters:
      info:
        type: vcatalog_table_list_info
        description: Borrowed opaque handle to the listing.
      database:
        type: vcatalog_database
        description: Borrowed handle to the database the callback runs on.
      context:
        type: context
        description: Borrowed handle to the context of the connection listing the tables.
      err:
        type: error_info
        indirection: 1
        description: |
          Borrowed error info handle to use to report errors that occur during the callback. Reporting an error fails
          the statement that listed the tables.
    return_type: void

#-----------------------------------------------------------------------------------------------------------------------
# Functions
#-----------------------------------------------------------------------------------------------------------------------
functions:
  #---------------------------------------------------------------------------------------------------------------------
  # Constructors
  #---------------------------------------------------------------------------------------------------------------------
  vcatalog_create:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-04" ]
    description: |
      Creates a new vcatalog through a factory.

      The vcatalog starts out empty: configure it with the setter functions, then make it available with
      `[[connection_register_vcatalog]]` or `[[extension_register_vcatalog]]`. The caller owns the returned handle and
      must destroy it with `[[vcatalog_destroy]]`, also after registration.

      The vcatalog can only be registered on the instance the factory belongs to.
    role: constructor
    belongs_to: vcatalog
    parameters:
      factory:
        type: factory
        description: The factory to create the vcatalog through.
      vcatalog:
        type: vcatalog
        indirection: 1
        kind: OUT
        description: On success, receives the newly created vcatalog. Owned by the caller.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vcatalog_destroy:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-04" ]
    description: |
      Destroys the vcatalog, releasing its resources.

      Null-safe: passing a null pointer or null handle is a no-op. The handle is set to null on return to prevent
      double-destruction. Destroying the handle after registration does not affect the registered vcatalog.
    parameters:
      vcatalog:
        type: vcatalog
        description: The vcatalog to destroy.
        indirection: 1
    return_type: ERROR

  #---------------------------------------------------------------------------------------------------------------------
  # Properties
  #---------------------------------------------------------------------------------------------------------------------
  vcatalog_set_name:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-04" ]
    description: |
      Sets the name of the database type, as `ATTACH '<path>' (TYPE <name>)` refers to it.

      Names are matched case-insensitively. A name of at least two characters, all alphanumeric or underscores, can
      also be given as a path prefix: `ATTACH '<name>:<path>'`. The name is borrowed and copied. Calling this again
      replaces the previous name. A name must be set before registration.
    parameters:
      vcatalog:
        type: vcatalog
        description: The vcatalog to set the name of.
      name:
        type: char
        indirection: 1
        const: true
        kind: IN
        description: The name to set. Borrowed and copied.
      name_length:
        type: idx
        description: The length of `name` in bytes. `name` must be valid UTF-8, need not be null-terminated, and may be NULL only when this is 0.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vcatalog_set_user_data:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-04" ]
    description: |
      Sets arbitrary user data on the vcatalog.

      Associates an opaque pointer with the vcatalog, retrievable in each of its callbacks from the database they run
      on, via `[[vcatalog_database_get_user_data]]`. Every database attached with the vcatalog shares it, so
      the callbacks must synchronize their own access to it. The opaque handle bundles the pointer with an optional
      destructor, invoked when the data is no longer needed: once the vcatalog handle is destroyed and, if it was
      registered, the instance is too.
    parameters:
      vcatalog:
        type: vcatalog
        description: The vcatalog to set the user data of.
      data:
        type: opaque
        indirection: 1
        description: Opaque handle bundling the user data pointer plus an optional destructor.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vcatalog_set_attach_callback:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-04" ]
    description: |
      Sets the attach callback of the vcatalog, invoked once for every `ATTACH` of a database of its type.

      The callback reads the path and options of the `ATTACH` through the attach info, opens what the database needs,
      and sets the catalog state the other callbacks of the database receive, via
      `[[vcatalog_attach_set_catalog_state]]`. Reporting an error fails the `ATTACH`. So does an option the callback did
      not read, which is reported as unrecognized. An attach callback must be set before registration.
    parameters:
      vcatalog:
        type: vcatalog
        description: The vcatalog to set the attach callback of.
      callback:
        type: vcatalog_attach_callback
        description: The attach callback to set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vcatalog_set_transaction_begin_callback:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-04" ]
    description: |
      Sets the optional begin callback of the vcatalog, invoked when a transaction first touches a database of its
      type.

      A transaction touches a database the first time it looks up, reads or writes anything in it, or at `BEGIN` for
      every attached database when `immediate_transaction_mode` is set. The callback runs while DuckDB holds the lock
      of the transaction, so it receives no context and must return quickly: set the transaction state via
      `[[vcatalog_transaction_begin_set_transaction_state]]`, and defer work on the backing store, such as beginning
      a transaction of its own, to the first callback that needs it.

      Reporting an error fails the statement that touched the database. Neither the commit nor the rollback callback is
      then invoked for the transaction, and a transaction state set before the error is destroyed.

      Without a begin callback, transactions on the database have no transaction state.
    parameters:
      vcatalog:
        type: vcatalog
        description: The vcatalog to set the begin callback of.
      callback:
        type: vcatalog_transaction_begin_callback
        description: The begin callback to set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vcatalog_set_transaction_commit_callback:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-04" ]
    description: |
      Sets the optional commit callback of the vcatalog, invoked when a transaction that began on a database of its
      type commits: at `COMMIT`, or at the end of a statement in auto-commit mode.

      The callback receives no context: the connection's transaction has already ended when its databases commit.
      Reporting an error fails the commit. The rollback callback is then invoked for the same transaction, and the
      error is reported to the client. A transaction spanning several attached databases commits them one after the
      other; once one of them fails, the remaining ones are rolled back instead of committed.

      The transaction state is destroyed after the transaction ends, whether it committed or not.
    parameters:
      vcatalog:
        type: vcatalog
        description: The vcatalog to set the commit callback of.
      callback:
        type: vcatalog_transaction_commit_callback
        description: The commit callback to set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vcatalog_set_transaction_rollback_callback:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-04" ]
    description: |
      Sets the optional rollback callback of the vcatalog, invoked when a transaction that began on a database of its
      type ends without committing.

      That is at `ROLLBACK`; at `COMMIT` of a transaction a failed statement invalidated; at the end of a failed
      statement in auto-commit mode; after the commit of this or another attached database failed; and when the
      connection closes with the transaction still open. A statement that fails inside an explicit transaction only
      invalidates the transaction: the callback is invoked once the transaction ends.

      The callback runs on cleanup paths, so it receives no context, and an error it reports is passed on but does not
      stop the transaction from ending. After a failed commit it is invoked for the same transaction, so it must cope
      with a transaction of the backing store that the failed commit already ended.

      The transaction state is destroyed after the callback returns.
    parameters:
      vcatalog:
        type: vcatalog
        description: The vcatalog to set the rollback callback of.
      callback:
        type: vcatalog_transaction_rollback_callback
        description: The rollback callback to set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vcatalog_set_schema_find_callback:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-05" ]
    description: |
      Sets the optional schema find callback of the vcatalog, invoked whenever DuckDB resolves a schema name in a
      database of its type: e.g. for `v.main.t`, for `USE v`, or for an unqualified name on the search path.

      The callback resolves the name with `[[vcatalog_schema_find_set_schema]]`, or leaves it unresolved when there
      is no such schema. DuckDB keeps nothing between calls, so the callback runs every time DuckDB resolves the name,
      often several times per statement: keep it fast, e.g. by keeping the schemas in the catalog state. Without a
      find callback, no schema of a database of the type can be resolved by name.
    parameters:
      vcatalog:
        type: vcatalog
        description: The vcatalog to set the schema find callback of.
      callback:
        type: vcatalog_schema_find_callback
        description: The schema find callback to set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vcatalog_set_schema_list_callback:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-05" ]
    description: |
      Sets the optional schema list callback of the vcatalog, invoked when DuckDB lists the schemas of a database of its
      type, e.g. for `duckdb_schemas()`.

      The callback adds every schema of the database with `[[vcatalog_schema_list_add_schema]]`. Without a list
      callback, a database of the type lists no schemas.
    parameters:
      vcatalog:
        type: vcatalog
        description: The vcatalog to set the schema list callback of.
      callback:
        type: vcatalog_schema_list_callback
        description: The schema list callback to set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vcatalog_set_table_find_callback:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-10" ]
    description: |
      Sets the optional table find callback of the vcatalog, invoked whenever DuckDB resolves a table name in a schema
      of a database of its type: e.g. for `SELECT * FROM v.main.t` or `pragma_table_info('v.main.t')`.

      The callback resolves the name with `[[vcatalog_table_find_set_table]]`, or leaves it unresolved when the schema
      has no such table. As for schemas, DuckDB keeps nothing between calls, so keep the callback fast. DuckDB finds no
      other kinds of entries, such as functions or types, in the schemas of a vcatalog. Without a table find
      callback, no table of a database of the type can be resolved by name.
    parameters:
      vcatalog:
        type: vcatalog
        description: The vcatalog to set the callback of.
      callback:
        type: vcatalog_table_find_callback
        description: The callback to set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vcatalog_set_table_list_callback:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-10" ]
    description: |
      Sets the optional table list callback of the vcatalog, invoked when DuckDB lists the tables of a schema of a
      database of its type, e.g. for `duckdb_tables()`, `duckdb_columns()` or `SHOW ALL TABLES`.

      The callback adds every table of the schema with `[[vcatalog_table_list_add_table]]`. Without a table list
      callback, the schemas of a database of the type list no tables.
    parameters:
      vcatalog:
        type: vcatalog
        description: The vcatalog to set the callback of.
      callback:
        type: vcatalog_table_list_callback
        description: The callback to set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  #---------------------------------------------------------------------------------------------------------------------
  # Attach Info
  #---------------------------------------------------------------------------------------------------------------------
  vcatalog_attach_get_name:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-04" ]
    description: |
      Retrieves the name the database is attached under: the alias of `ATTACH ... AS <alias>`, or else the name DuckDB
      derived from the path. The name is borrowed and valid only for the duration of the callback.
    parameters:
      info:
        type: vcatalog_attach_info
        description: The attach info handle.
      name:
        type: char
        indirection: 2
        const: true
        kind: OUT_BORROW
        description: Receives a borrowed pointer to the name. Valid only for the duration of the callback.
      name_length:
        type: idx
        indirection: 1
        kind: OUT
        description: Receives the length of `*name` in bytes. `*name` is not guaranteed to be null-terminated.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vcatalog_attach_get_path:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-04" ]
    description: |
      Retrieves the path the database is attached from, as given to `ATTACH`, with a leading `<name>:` prefix removed.
      What the path means is up to the vcatalog: a file, a connection string, a URL. The path is borrowed and valid
      only for the duration of the callback.
    parameters:
      info:
        type: vcatalog_attach_info
        description: The attach info handle.
      path:
        type: char
        indirection: 2
        const: true
        kind: OUT_BORROW
        description: Receives a borrowed pointer to the path. Valid only for the duration of the callback.
      path_length:
        type: idx
        indirection: 1
        kind: OUT
        description: Receives the length of `*path` in bytes. `*path` is not guaranteed to be null-terminated.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vcatalog_attach_is_read_only:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-04" ]
    description: |
      Retrieves whether the database is attached read-only: with the `READ_ONLY` option, or because the access mode of
      the instance is read-only.
    parameters:
      info:
        type: vcatalog_attach_info
        description: The attach info handle.
      read_only:
        type: bool
        indirection: 1
        kind: OUT
        description: Receives whether the database is attached read-only.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vcatalog_attach_get_option:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-04" ]
    description: |
      Retrieves the value of an option given to `ATTACH`, e.g. `ATTACH '<path>' (TYPE <name>, <option> <value>)`.

      Option names are matched case-insensitively. The options DuckDB interprets itself, such as `TYPE` and
      `READ_ONLY`, are not visible here. Retrieving an option marks it as recognized: an option no call retrieves fails
      the `ATTACH` once the attach callback returns. An option that was not given has no value: `present` then
      receives false and `value` is left untouched.
    parameters:
      info:
        type: vcatalog_attach_info
        description: The attach info handle.
      name:
        type: char
        indirection: 1
        const: true
        kind: IN
        description: The name of the option. Borrowed for the duration of the call.
      name_length:
        type: idx
        description: The length of `name` in bytes. `name` must be valid UTF-8, need not be null-terminated, and may be NULL only when this is 0.
      value:
        type: value
        indirection: 1
        kind: OUT
        description: Receives the value of the option, if present. Owned by the caller; destroy via `[[value_destroy]]`.
      present:
        type: bool
        indirection: 1
        kind: OUT
        description: Receives whether the option was given.
      err:
        type: error_info
