    parameters:
      schema:
        type: vcatalog_schema
        description: The schema.
      name:
        type: char
        indirection: 2
        const: true
        kind: OUT_BORROW
        description: Receives a borrowed pointer to the name. Valid for as long as the schema is.
      name_length:
        type: idx
        indirection: 1
        kind: OUT
        description: Receives the length of `*name` in bytes. `*name` is not guaranteed to be null-terminated.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vcatalog_schema_get_database:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-05" ]
    description: Retrieves the database the schema was created in.
    parameters:
      schema:
        type: vcatalog_schema
        description: The schema.
      database:
