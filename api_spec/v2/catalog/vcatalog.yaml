        indirection: 1
        kind: OUT
        description: Receives the borrowed database handle.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  vcatalog_schema_set_state:
    lifecycle:
