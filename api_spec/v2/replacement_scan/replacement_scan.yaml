#
# Replacement scan API.
#
# A replacement scan is a callback the binder consults when a table name
# cannot be resolved in the catalog (this is what makes
# `SELECT * FROM 'file.csv'` work). The callback inspects the unresolved
# (possibly qualified) name and either claims it by naming a target table
# function plus parameters, declines (the engine consults the next
# registered scan and falls through to the normal catalog error if none
# claims), or fails with an error.
#
# Firing model: scans run only after a base-table lookup fails, gated by
# an internal client option that is on by default (host applications
# embedding DuckDB can disable replacement scans programmatically; the
# option is not reachable through SQL or this API). Scans are consulted
# in registration order; the first scan to claim wins and the rest are
# not invoked.
#
# Thread safety: registration is not thread-safe with respect to running
# queries; register before issuing queries on any connection of the
# database.
#
# Deliberate deferrals:
#   - No unregistration. Registered scans live until the database closes;
#     the user data's destroy callback runs at that point.
#   - Only the table-function target form is exposed. The engine accepts
#     any table reference from a replacement callback (wrapping
#     non-table-function, non-subquery references in a subquery itself);
#     a view-query-style target could be added to this module later.
module: replacement_scan
handles:
  replacement_scan_info:
    description: |
      Borrowed handle passed to the replacement scan callback. Provides access to the unresolved table reference
      (catalog, schema, and table name) and the user data, and is used to claim the reference by naming a target table
      function and adding parameters. Valid only for the callback duration.
callbacks:
  replacement_scan_callback:
    description: |
      Replacement scan callback, invoked during binding when a table name cannot be resolved. The callback inspects
      the unresolved name via the replacement_scan_get_* accessors and finishes in one of three ways:
        - claim: call replacement_scan_set_function_name (and optionally add parameters); the engine plans the named
          table function in place of the unresolved name.
        - decline: return without calling replacement_scan_set_function_name; the engine consults the next registered
          scan and falls through to the normal catalog error if none claims.
        - fail: set a code and message on the error slot and return; the query fails with that code.
      The callback runs on the binding thread, inside the active query: reading settings through the context is fine;
      running queries through it deadlocks on the context lock.
    return_type: void
    parameters:
      info:
        type: replacement_scan_info
        description: Handle providing access to the unresolved name and claim functions.
      context:
        type: context
        description: The DuckDB context.
      err:
        type: error_info
        indirection: 1
        description: Error slot. Signal failure via error_info_set_code / error_info_set_text and return.
functions:
  replacement_scan_register_with_database:
    description: |
      Registers a replacement scan callback on a database.

      Scans are consulted in registration order; the first scan to claim an unresolved name wins. Registered scans
      live until the database closes; there is no unregistration. The user data's destroy callback (if set) runs
      exactly once, at database close; a NULL user data pointer has nothing to destroy.

      Registration is not thread-safe with respect to running queries; register before issuing queries on any
      connection of the database.
    role: method
    belongs_to: database
    parameters:
      db:
        type: database
        description: The database to register the scan on.
      callback:
        type: replacement_scan_callback
        description: The replacement scan callback.
      user_data:
        type: opaque
        description: |
          User data accessible from the callback via replacement_scan_get_user_data, bundling the pointer with an
          optional destroy callback that runs once at database close. The pointer may be NULL.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: ERROR
  replacement_scan_register_with_context:
    description: |
      Registers a replacement scan callback on the context's database.

      Same as replacement_scan_register_with_database, but resolves the target database from a context. Use this from
      inside a callback or extension where a context is already in hand.

      Scans are consulted in registration order; the first scan to claim an unresolved name wins. Registered scans
      live until the database closes; there is no unregistration. The user data's destroy callback (if set) runs
      exactly once, at database close; a NULL user data pointer has nothing to destroy.

      Registration is not thread-safe with respect to running queries; register before issuing queries on any
      connection of the database.
    role: method
    belongs_to: database
    parameters:
      context:
        type: context
        description: The context whose database to register the scan on.
      callback:
        type: replacement_scan_callback
        description: The replacement scan callback.
      user_data:
        type: opaque
        description: |
          User data accessible from the callback via replacement_scan_get_user_data, bundling the pointer with an
          optional destroy callback that runs once at database close. The pointer may be NULL.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: ERROR
  replacement_scan_get_catalog_name:
    description: |
      Borrows the catalog name of the unresolved table reference.

      Returns a borrowed string view, valid for the callback duration. The canonical empty view {NULL, 0} when the
      reference carries no catalog qualifier (the engine reports an absent part as an empty string; this accessor
      translates that to the empty view per the borrowed-string convention).
    role: getter
    belongs_to: replacement_scan_info
    parameters:
      info:
        type: replacement_scan_info
        description: The replacement scan info handle.
      out_name:
        type: identifier
        indirection: 1
        kind: OUT_BORROW
        description: Receives the borrowed catalog name view, or the empty view {NULL, 0} when the reference was unqualified.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: ERROR
  replacement_scan_get_schema_name:
    description: |
      Borrows the schema name of the unresolved table reference.

      Returns a borrowed string view, valid for the callback duration. The canonical empty view {NULL, 0} when the
      reference carries no schema qualifier (the engine reports an absent part as an empty string; this accessor
      translates that to the empty view per the borrowed-string convention).
    role: getter
    belongs_to: replacement_scan_info
    parameters:
      info:
        type: replacement_scan_info
        description: The replacement scan info handle.
      out_name:
        type: identifier
        indirection: 1
        kind: OUT_BORROW
        description: Receives the borrowed schema name view, or the empty view {NULL, 0} when the reference was unqualified.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: ERROR
  replacement_scan_get_table_name:
    description: |
      Borrows the table name of the unresolved table reference.

      Returns a borrowed string view, valid for the callback duration. Always a non-empty view.
    role: getter
    belongs_to: replacement_scan_info
    parameters:
      info:
        type: replacement_scan_info
        description: The replacement scan info handle.
      out_name:
        type: identifier
        indirection: 1
        kind: OUT_BORROW
        description: Receives the borrowed table name view.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: ERROR
  replacement_scan_get_user_data:
    description: Retrieves the user data passed at registration.
    role: getter
    belongs_to: replacement_scan_info
    parameters:
      info:
        type: replacement_scan_info
        description: The replacement scan info handle.
      out_data:
        type: void
        indirection: 2
        kind: OUT
        description: Receives the user data pointer.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: ERROR
  replacement_scan_set_function_name:
    description: |
      Claims the unresolved name by naming the target table function.

      The library copies the name. The name is not validated here: an unknown function surfaces later as the binder's
      own catalog error. Calling this more than once overwrites the previous name; the last call wins.
    role: setter
    belongs_to: replacement_scan_info
    parameters:
      info:
        type: replacement_scan_info
        description: The replacement scan info handle.
      name:
        type: identifier
        description: Table function name. The library copies it.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: ERROR
  replacement_scan_add_parameter:
    description: |
      Adds a positional parameter for the target table function.

      Parameters are passed to the table function in the order they are added. The value is borrowed and copied at
      the call; the caller still owns it and destroys it.
    role: method
    belongs_to: replacement_scan_info
    parameters:
      info:
        type: replacement_scan_info
        description: The replacement scan info handle.
      value:
        type: value
        description: The parameter value. Borrowed and copied at the call; the caller still owns it.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: ERROR
  replacement_scan_add_named_parameter:
    description: |
      Adds a named (keyword) parameter for the target table function.

      The library copies the name. The value is borrowed and copied at the call; the caller still owns it and
      destroys it.
    role: method
    belongs_to: replacement_scan_info
    parameters:
      info:
        type: replacement_scan_info
        description: The replacement scan info handle.
      name:
        type: identifier
        description: Parameter name. The library copies it.
      value:
        type: value
        description: The parameter value. Borrowed and copied at the call; the caller still owns it.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: ERROR
