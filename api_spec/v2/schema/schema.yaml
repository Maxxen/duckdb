# yaml-language-server: $schema=https://raw.githubusercontent.com/duckdblabs/capiv2/main/src/capigen/schema/module.schema.json
module: schema
# An ordered list of (name, type) fields: a row schema. The single schema type
# across the V2 API: a bound statement's output (result columns) and input
# (parameters), a result's columns, Arrow conversion. Field names may repeat or
# be empty, and the list may be empty.
#
# Lifetime: get_field borrows the field name and type, valid only until the schema
# is destroyed. The bind verbs produce one the caller owns and destroys.
handles:
  schema:
    description: |
      An owned, ordered list of (name, type) fields. Read with schema_get_count
      and schema_get_field. Destroy via schema_destroy.
    cleanup_with: schema_destroy
functions:
  schema_get_count:
    summary: "Returns the number of fields in a schema."
    role: getter
    belongs_to: schema
    parameters:
      schema:
        type: schema
        description: "The schema."
      out_count:
        type: idx
        indirection: 1
        kind: OUT
        description: "Receives the field count."
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy."
    return_type: API_CALL
  schema_get_field:
    summary: "Borrows the name and type of the field at index."
    description: |
      Borrows the field at index. out_name and out_type are valid only until the
      schema is destroyed, and out_type must not be destroyed. An out-of-range
      index is rejected with INVALID_INPUT.
    role: getter
    belongs_to: schema
    parameters:
      schema:
        type: schema
        description: "The schema."
      index:
        type: idx
        description: "Zero-based field index."
      out_name:
        type: identifier
        indirection: 1
        kind: OUT_BORROW
        description: "Receives a borrowed view of the field name. Valid until the schema is destroyed."
      out_type:
        type: logical_type
        indirection: 1
        kind: OUT_BORROW
        description: "Receives a borrowed field type. Valid until the schema is destroyed; do not destroy it."
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy."
    return_type: API_CALL
  schema_destroy:
    summary: "Destroys a schema handle."
    description: |
      Frees the handle and all owned names and types. On success the slot is set
      to null. Safe to call on an already-null slot.
    role: destructor
    belongs_to: schema
    parameters:
      schema:
        type: schema
        indirection: 1
        description: "The schema handle to destroy."
    return_type: API_CALL
